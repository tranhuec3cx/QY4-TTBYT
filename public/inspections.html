<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiểm định - Hiệu chuẩn - ATBX</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <div id="menuHost"></div>
    <main class="main">
      <div class="topbar">
        <div><h1 id="pageTitle" class="page-title"></h1><p id="pageSubtitle" class="page-subtitle"></p></div>
        <div class="page-actions">
          <button class="btn btn-primary" type="button" onclick="document.getElementById('formCard').scrollIntoView({behavior:'smooth'})">+ Thêm hồ sơ</button>
          <button class="btn" id="exportBtn">Xuất Excel</button>
          <div class="user-box" style="display:none"></div>
        </div>
      </div>

      <section class="card compact-card clean-filter-card">
        <div class="filters compact-primary-filters">
          <label class="field"><span class="field-label">Từ ngày</span><input id="fromDate" type="date" /></label>
          <label class="field"><span class="field-label">Đến ngày</span><input id="toDate" type="date" /></label>
          <label class="field field-wide"><span class="field-label">Tìm kiếm</span><input id="searchInput" placeholder="Mã, tên thiết bị hoặc số chứng nhận" /></label>
          <label class="field"><span class="field-label">Loại hồ sơ</span><select id="typeFilter"><option value="ALL">Tất cả loại</option><option>Kiểm định</option><option>Hiệu chuẩn</option><option>Kiểm định an toàn bức xạ</option><option>Kiểm xạ</option></select></label>
          <div class="filter-actions"><button class="btn btn-primary" id="filterBtn">Lọc</button></div>
        </div>
        <details class="advanced-filter-details">
          <summary>Lọc thêm</summary>
          <div class="advanced-filter-grid">
            <label class="field"><span class="field-label">Thiết bị</span><select id="deviceFilter"></select></label>
            <label class="field"><span class="field-label">Đơn vị thực hiện</span><select id="orgFilter"><option value="ALL">Tất cả đơn vị</option></select></label>
          </div>
        </details>
      </section>

      <section class="card">
        <div class="table-card-header">
          <div><h3 id="countLabel">0 hồ sơ</h3><div class="small">Kết quả chuyên môn và tình trạng thời hạn được hiển thị riêng.</div></div>
        </div>
        <div class="table-wrap scroll-area">
          <table class="primary-list-table">
            <thead><tr><th>Hạn tiếp theo</th><th>Thiết bị</th><th>Khoa/vị trí</th><th>Loại</th><th>Kết quả</th><th>Đơn vị / Số CN</th><th>Thao tác</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <section id="formCard" class="card">
        <div class="table-card-header"><h3>Thêm / cập nhật kiểm định - hiệu chuẩn - ATBX</h3></div>
        <form id="form">
          <input type="hidden" id="recordId" />
          <div class="form-grid">
            <input id="deviceSearch" list="inspectionDeviceOptions" placeholder="Gõ mã thiết bị / tên / model / Serial" autocomplete="off" required />
            <input type="hidden" id="deviceId" />
            <datalist id="inspectionDeviceOptions"></datalist>
            <input id="dept" readonly placeholder="Khoa" />
            <input id="location" readonly placeholder="Vị trí" />
            <select id="type"><option>Kiểm định</option><option>Hiệu chuẩn</option><option>Kiểm định an toàn bức xạ</option><option>Kiểm xạ</option></select>
            <input id="inspectionDate" type="datetime-local" required />
            <input id="organization" placeholder="Đơn vị thực hiện" required />
            <input id="certificateNo" placeholder="Số giấy chứng nhận" />
            <select id="result"><option>Đạt</option><option>Đạt có lưu ý</option><option>Không đạt</option></select>
            <input id="nextDate" type="date" />
            <input id="fileNote" placeholder="Tên file đính kèm / ghi chú nội bộ" />
            <input id="fileUpload" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.zip" />
            <textarea id="note" class="span-3" placeholder="Ghi chú"></textarea>
          </div>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Lưu vào hồ sơ thiết bị</button><button class="btn" type="button" id="resetBtn">Đặt lại</button></div>
        </form>
      </section>
    </main>
  </div>
  <script src="/api.js"></script>
  <script src="/inspections.js"></script>
</body>
</html>
