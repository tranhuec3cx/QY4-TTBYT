<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Báo cáo</title>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="stylesheet" href="/reports-ui.css"/>
</head>
<body>
<div class="layout">
  <div id="menuHost"></div>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle" class="page-title"></h1>
        <p id="pageSubtitle" class="page-subtitle"></p>
      </div>
      <div class="reports-page-actions">
        <button class="btn btn-primary" id="exportBtn">Xuất Excel</button>
      </div>
    </div>

    <section class="card reports-filter-card">
      <div class="reports-filter-grid">
        <label class="field">
          <span class="field-label">Loại báo cáo</span>
          <select id="reportType">
            <optgroup label="Kỹ thuật">
              <option value="maintenanceOverdue">Quá hạn bảo dưỡng</option>
              <option value="inspectionOverdue">Quá hạn kiểm định / hiệu chuẩn</option>
              <option value="warrantySoon">Sắp hết bảo hành</option>
            </optgroup>
            <optgroup label="Sửa chữa - chi phí">
              <option value="frequentRepairs">Thiết bị sửa chữa nhiều lần</option>
              <option value="costByDepartment">Chi phí sửa chữa theo khoa/phòng</option>
            </optgroup>
            <optgroup label="Kế hoạch - thống kê">
              <option value="replaceList">Thiết bị cần xem xét thay thế / thanh lý</option>
              <option value="statusRatio">Thiết bị theo trạng thái</option>
            </optgroup>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Khoa/phòng</span>
          <select id="deptFilter"><option value="ALL">Tất cả khoa/phòng</option></select>
        </label>

        <label class="field">
          <span class="field-label">Nhóm thiết bị</span>
          <select id="groupFilter"><option value="ALL">Tất cả nhóm</option></select>
        </label>

        <label class="field">
          <span class="field-label">Tìm kiếm</span>
          <input id="searchInput" placeholder="Mã thiết bị, tên thiết bị hoặc model" autocomplete="off"/>
        </label>
      </div>
    </section>

    <section class="card reports-main-card">
      <div class="reports-main-head">
        <div>
          <h3 id="reportTitle">Báo cáo</h3>
          <div id="reportHint" class="small"></div>
        </div>
        <span id="countLabel" class="reports-count">0 thiết bị</span>
      </div>
      <div class="reports-table-wrap">
        <table class="report-table">
          <thead id="thead"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script src="/api.js"></script>
<script src="/vendor/xlsx.full.min.js"></script>
<script src="/reports.js"></script>
</body>
</html>
