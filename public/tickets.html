<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sự cố thiết bị</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <div id="menuHost"></div>
    <main class="main">
      <div class="topbar">
        <div><h1 id="pageTitle" class="page-title"></h1><p id="pageSubtitle" class="page-subtitle"></p></div>
        <div class="page-actions"><button class="btn btn-primary" id="newIncidentBtn">+ Ghi nhận sự cố</button><button class="btn" id="exportIncidentExcelBtn">Xuất Excel</button><div class="user-box" style="display:none"></div></div>
      </div>

      <section class="card compact-card clean-filter-card">
        <div class="filters simple-filter-grid">
          <label class="field"><span class="field-label">Từ ngày</span><input id="fromDate" type="date" /></label>
          <label class="field"><span class="field-label">Đến ngày</span><input id="toDate" type="date" /></label>
          <label class="field field-wide"><span class="field-label">Tìm kiếm</span><input id="searchInput" placeholder="Thiết bị / mô tả sự cố" /></label>
          <label class="field"><span class="field-label">Tiến độ</span><select id="statusFilter"><option value="ALL">Tất cả</option><option value="NEW">Mới</option><option value="ACTIVE">Đang xử lý</option><option value="DONE">Hoàn thành</option></select></label>
          <div class="filter-actions"><button class="btn btn-primary" id="filterBtn">Lọc</button><button class="btn" id="clearFilterBtn">Đặt lại</button></div>
        </div>
        <details class="advanced-filter-details">
          <summary>Lọc thêm</summary>
          <div class="advanced-filter-grid">
            <label class="field"><span class="field-label">Thiết bị</span><select id="deviceFilter"><option value="ALL">Tất cả thiết bị</option></select></label>
            <label class="field"><span class="field-label">Nguồn báo</span><select id="sourceFilter"><option value="ALL">Tất cả nguồn</option><option>QR</option><option>Nhập trực tiếp</option><option>Không xác định</option></select></label>
          </div>
        </details>
      </section>

      <section class="summary-strip" id="incidentStats">
        <div class="summary-item summary-item-warning"><span>Mới</span><strong id="stNewIncidents">0</strong></div>
        <div class="summary-item"><span>Đang xử lý</span><strong id="stActiveIncidents">0</strong></div>
        <div class="summary-item summary-item-success"><span>Hoàn thành</span><strong id="stDoneIncidents">0</strong></div>
      </section>

      <section class="card">
        <div class="table-card-header"><h3 id="countLabel">0 sự cố</h3></div>
        <div class="table-wrap scroll-area">
          <table class="incident-table-v2">
            <thead><tr><th>STT</th><th>Thời gian</th><th>Thiết bị</th><th>Khoa/vị trí</th><th>Sự cố</th><th>Tiến độ</th><th>Thao tác</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <section class="card incident-form-card">
        <div class="table-card-header"><h3 id="incidentFormTitle">Ghi nhận sự cố</h3><div class="small">Sự cố là bước ghi nhận ban đầu; khi cần xử lý kỹ thuật hãy chuyển sang phiếu sửa chữa.</div></div>
        <form id="incidentForm" enctype="multipart/form-data">
          <input type="hidden" id="incidentId" />
          <div class="form-grid incident-form-grid">
            <label class="field span-3"><span class="field-label">Thiết bị</span><input id="deviceSearch" list="incidentDeviceOptions" placeholder="Gõ mã thiết bị / tên / model / Serial" autocomplete="off" required /><input type="hidden" id="deviceId" /><datalist id="incidentDeviceOptions"></datalist></label>
            <label class="field"><span class="field-label">Khoa</span><input id="incidentDept" readonly /></label>
            <label class="field"><span class="field-label">Vị trí</span><input id="incidentLocation" readonly /></label>
            <label class="field"><span class="field-label">Thời gian ghi nhận</span><input id="incidentTime" type="datetime-local" required /></label>
            <label class="field"><span class="field-label">Người báo sự cố</span><input id="reporter" placeholder="Nhập đúng người báo thực tế" required /></label>
            <label class="field"><span class="field-label">Số điện thoại</span><input id="reporterPhone" placeholder="Số điện thoại liên hệ" /></label>
                        <label class="field"><span class="field-label">Trạng thái sự cố</span><select id="status"><option>Mới ghi nhận</option><option>Đã tiếp nhận</option><option>Đã xử lý tại chỗ</option></select></label>
            <label class="field span-3"><span class="field-label">Mô tả sự cố</span><textarea id="description" class="textarea-medium" required></textarea></label>
            <label class="field span-3" id="localResolutionField" style="display:none"><span class="field-label">Nội dung xử lý tại chỗ</span><textarea id="localResolutionNote" placeholder="Chỉ nhập khi sự cố được xử lý tại chỗ: đã kiểm tra gì, đã thao tác gì, kết quả ra sao..."></textarea></label>
            <label class="field span-3"><span class="field-label">Ảnh/Video đính kèm</span><input id="incidentMedia" type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime" /><small>Ảnh tối đa 5 file, mỗi ảnh 5MB; video tối đa 1 file, 30MB.</small></label>
            <label class="field span-3"><span class="field-label">Ghi chú</span><textarea id="note"></textarea></label>
          </div>
          <div class="form-actions"><button class="btn btn-primary" type="submit" id="saveIncidentBtn">Lưu sự cố</button><button class="btn" type="button" id="resetIncidentBtn">Làm mới form</button></div>
        </form>
      </section>
          <dialog id="mediaDialog" class="wide-dialog media-dialog"><div class="dialog-head"><h2>Ảnh/Video sự cố</h2><button class="btn" onclick="q('mediaDialog').close()">Đóng</button></div><div id="mediaDialogBody" class="media-dialog-body"></div></dialog>
    </main>
  </div>
  <script src="/api.js"></script>
  
  <script src="/tickets.js"></script>
</body>
</html>
