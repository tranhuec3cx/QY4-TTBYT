<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Phân cấp chất lượng</title><link rel="stylesheet" href="/styles.css"/></head><body><div class="layout"><div id="menuHost"></div><main class="main"><div class="topbar"><div><h1 id="pageTitle" class="page-title"></h1><p id="pageSubtitle" class="page-subtitle"></p></div><div class="user-box">Người dùng: Quản trị viên</div></div>
<section class="card"><div class="filters"><input id="searchInput" placeholder="Tìm thiết bị"/><select id="gradeFilter"><option value="ALL">Tất cả cấp</option><option>A</option><option>B</option><option>C</option><option>D</option></select><button class="btn" id="filterBtn">Lọc</button><button class="btn" id="exportBtn">Xuất Excel</button></div></section>
<section class="card"><div class="table-card-header"><h3 id="countLabel">0 thiết bị</h3></div><div class="table-wrap scroll-area"><table><thead><tr><th>Mã TBị</th><th>Tên thiết bị</th><th>Khoa</th><th>Ngày đánh giá</th><th>Tuổi TB</th><th>Hiệu suất</th><th>Sửa chữa</th><th>Kiểm định</th><th>Phụ tùng</th><th>Tổng</th><th>Cấp</th><th>Khuyến nghị</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="card"><div class="table-card-header"><h3>Đánh giá / cập nhật phân cấp</h3></div><form id="form"><div class="form-grid"><select id="deviceId"></select><input id="ratingDate" type="date"/><input id="evaluator" placeholder="Người đánh giá"/><input id="ageScore" type="number" placeholder="Điểm tuổi TB, max 25"/><input id="performanceScore" type="number" placeholder="Điểm hiệu suất, max 25"/><input id="repairScore" type="number" placeholder="Điểm sửa chữa, max 20"/><input id="inspectionScore" type="number" placeholder="Điểm kiểm định, max 15"/><input id="sparepartScore" type="number" placeholder="Điểm phụ tùng, max 15"/><input id="recommendation" class="span-2" placeholder="Khuyến nghị"/><textarea id="note" class="span-3" placeholder="Ghi chú"></textarea></div><div class="form-actions"><button class="btn btn-primary" type="submit">Lưu đánh giá</button><button class="btn" type="button" id="resetBtn">Đặt lại</button></div></form></section>
</main></div><script src="/api.js"></script><script src="/vendor/xlsx.full.min.js"></script><script src="/quality.js"></script></body></html>
