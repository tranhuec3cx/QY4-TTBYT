name: QY4 one-time dependency refresh

on:
  push:
    branches:
      - "feat/ui-final-20261121"
    paths:
      - ".github/workflows/refresh-dependencies-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-final-20261121
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Refresh direct and transitive dependencies
        run: |
          npm install multer@2.5.0 --save --package-lock-only
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          git config user.name "qy4-ci"
          git config user.email "qy4-ci@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "fix(deps): refresh vulnerable dependencies"
            git push origin HEAD:feat/ui-final-20261121
          fi
