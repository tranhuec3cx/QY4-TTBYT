name: QY4 syntax and smoke check
on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          for f in public/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
          if grep -R "XLSX\." public server.js; then
            echo "Legacy SheetJS XLSX reference remains"
            exit 1
          fi
          if grep -R "/vendor/xlsx" public server.js; then
            echo "Legacy SheetJS vendor route remains"
            exit 1
          fi
          node - <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("public/device-detail.html","utf8");
          const js=fs.readFileSync("public/device-detail.js","utf8");
          for(const legacy of ["tab-accessories","tab-incidents","tab-repairs","tab-maint","tab-inspections","tab-op","tab-docs"]){
            if(html.includes('id="'+legacy+'"')) throw new Error("Legacy device-detail tab remains: "+legacy);
          }
          if(!html.includes('id="generalDepartment" disabled')) throw new Error("Device department must be locked in general info");
          if(!html.includes('id="generalLocation" placeholder="Vị trí đặt máy" readonly')) throw new Error("Device location must be locked in general info");
          if(js.includes('department_code: q("generalDepartment").value')) throw new Error("General form can bypass transfer department history");
          if(js.includes('location: q("generalLocation").value.trim()')) throw new Error("General form can bypass transfer location history");
          if(!js.includes('/api/devices/${DEVICE_ID}/transfer')) throw new Error("Transfer workflow missing");
          for(const legacyApi of ["/api/accessories","/api/repairs","/api/maintenances","/api/operation-logs","/api/documents"]){
            if(js.includes(legacyApi)) throw new Error("Legacy device-detail write path remains: "+legacyApi);
          }
          console.log("Device detail single-workflow guard passed");
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Prepare legacy quality-rating schema
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const Database=require("better-sqlite3");
          fs.mkdirSync("db",{recursive:true});
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.exec(`
            CREATE TABLE IF NOT EXISTS quality_ratings (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              device_id INTEGER NOT NULL UNIQUE,
              rating_date TEXT,
              age_score INTEGER DEFAULT 0,
              performance_score INTEGER DEFAULT 0,
              repair_score INTEGER DEFAULT 0,
              inspection_score INTEGER DEFAULT 0,
              sparepart_score INTEGER DEFAULT 0,
              total_score INTEGER DEFAULT 0,
              grade TEXT,
              recommendation TEXT,
              evaluator TEXT,
              note TEXT
            );
          `);
          db.close();
          NODE
      - name: Dependency audit summary
        run: |
          npm audit --json >/tmp/npm-audit.json || true
          node - <<'NODE'
          const fs=require("fs");
          const a=JSON.parse(fs.readFileSync("/tmp/npm-audit.json","utf8"));
          const meta=a.metadata?.vulnerabilities || {};
          console.log("npm audit summary:",meta);
          for(const [name,v] of Object.entries(a.vulnerabilities || {})){
            console.log(`AUDIT ${String(v.severity||"unknown").toUpperCase()} ${name} direct=${Boolean(v.isDirect)} via=${JSON.stringify(v.via)} fix=${JSON.stringify(v.fixAvailable)}`);
          }
          if(Number(meta.high||0)>0 || Number(meta.critical||0)>0){
            throw new Error("Dependency audit has High/Critical vulnerabilities");
          }
          NODE
      - name: Start server
        run: |
          QY4_DEMO_SEED=0 node server.js > /tmp/qy4-server.log 2>&1 &
          echo $! > /tmp/qy4-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/api/devices >/tmp/devices.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qy4-server.log
          exit 1
      - name: Smoke test core APIs
        run: |
          BASE=http://127.0.0.1:5000
          curl -fsS "$BASE/api/dashboard/operations" >/tmp/dashboard.json
          curl -fsS "$BASE/api/inventory-sessions" >/tmp/inventory.json
          curl -fsS "$BASE/api/system/backups" >/tmp/backups.json
          curl -fsS "$BASE/api/system/readiness" >/tmp/readiness.json
          curl -fsS -X POST "$BASE/api/export/xlsx" -H 'Content-Type: application/json' --data '{"filename":"ci-export.xlsx","sheets":[{"name":"Test","rows":[{"Cot A":"Gia tri 1","Cot B":123},{"Cot A":"Gia tri 2","Cot B":456}]}]}' >/tmp/ci-export.xlsx
          node - <<'NODE'
          const ExcelJS=require("exceljs");
          (async()=>{
            const wb=new ExcelJS.Workbook();
            await wb.xlsx.readFile("/tmp/ci-export.xlsx");
            const ws=wb.getWorksheet("Test");
            if(!ws || ws.getCell("A1").value!=="Cot A" || ws.getCell("B3").value!==456) throw new Error("Server XLSX export invalid");
            console.log("Server XLSX export passed");
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          curl -fsS "$BASE/api/devices/duplicate-check?serial=__TEST__" >/tmp/duplicate.json
          node -e 'for (const p of ["/tmp/devices.json","/tmp/dashboard.json","/tmp/inventory.json","/tmp/backups.json","/tmp/readiness.json","/tmp/duplicate.json"]) JSON.parse(require("fs").readFileSync(p,"utf8")); const r=JSON.parse(require("fs").readFileSync("/tmp/readiness.json","utf8")); if(!Array.isArray(r.checks)||r.checks.length<10||r.system?.time_zone!=="Asia/Bangkok"||r.system?.database_integrity!=="Đạt"||r.system?.foreign_keys_enabled!==true||Number(r.system?.foreign_key_violations||0)!==0) throw new Error("Readiness API invalid"); console.log("Core API smoke test passed")'

      - name: Smoke test QR incident repair lifecycle
        run: |
          BASE=http://127.0.0.1:5000
          curl -fsS -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"TST","name":"Khoa kiểm thử"}' >/tmp/dept.json
          curl -fsS -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"TST2","name":"Khoa kiểm thử 2"}' >/tmp/dept2.json
          curl -fsS -X POST "$BASE/api/device-groups" -H 'Content-Type: application/json' --data '{"code":"TST","name":"Nhóm kiểm thử"}' >/tmp/group.json
          CODE=$(curl -s -o /tmp/device-invalid.json -w '%{http_code}' -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST"}')
          test "$CODE" = "400"
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST","name":"Thiết bị tối giản CI"}' >/tmp/device-minimal.json
          MIN_DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-minimal.json","utf8")).id')
          curl -fsS "$BASE/api/devices/$MIN_DEVICE_ID" >/tmp/device-minimal-read.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/device-minimal-read.json","utf8")); if(d.name!=="Thiết bị tối giản CI"||d.model!==""||d.serial!==""||!d.qr_uid) throw new Error("Minimal device defaults failed")'
          MIN_QR_UID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-minimal-read.json","utf8")).qr_uid')
          curl -fsS -X DELETE "$BASE/api/devices/$MIN_DEVICE_ID" >/tmp/device-minimal-archive.json
          curl -fsS "$BASE/api/public/device-qr/$MIN_QR_UID" >/tmp/device-minimal-archived-public.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/device-minimal-archived-public.json","utf8")); if(!d.is_archived||d.qr_uid!==process.argv[1]) throw new Error("Archived QR did not preserve identity")' "$MIN_QR_UID"
          CODE=$(curl -s -o /tmp/device-minimal-archived-post.json -w '%{http_code}' -X POST "$BASE/api/qr/checks" -F "qr_uid=$MIN_QR_UID" -F "inspector=CI" -F "condition=Bình thường")
          test "$CODE" = "404"
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST","name":"Thiết bị kiểm thử QR","manufacturer":"Test","model":"TEST-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"SERIAL-BEFORE","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí A","note":"","insurance_code":"","actor":"CI"}' >/tmp/device-create.json
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/quality-ratings" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"rating_date\":\"2026-09-23\",\"evaluator\":\"CI 1\",\"age_score\":25,\"performance_score\":20,\"repair_score\":15,\"inspection_score\":15,\"sparepart_score\":15,\"recommendation\":\"Mốc 1\",\"note\":\"Lịch sử 1\"}" >/tmp/quality-1.json
          QUALITY_ID_1=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/quality-1.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/quality-ratings" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"rating_date\":\"2026-09-24\",\"evaluator\":\"CI 2\",\"age_score\":25,\"performance_score\":25,\"repair_score\":20,\"inspection_score\":15,\"sparepart_score\":15,\"recommendation\":\"Mốc 2\",\"note\":\"Lịch sử 2\"}" >/tmp/quality-2.json
          QUALITY_ID_2=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/quality-2.json","utf8")).id')
          curl -fsS "$BASE/api/quality-ratings" >/tmp/quality-list.json
          node -e 'const fs=require("fs");const device=Number(process.argv[1]);const id1=Number(process.argv[2]);const id2=Number(process.argv[3]);const rows=JSON.parse(fs.readFileSync("/tmp/quality-list.json","utf8")).filter(x=>Number(x.device_id)===device);if(rows.length!==2)throw new Error("Quality history did not preserve 2 ratings: "+rows.length);const a=rows.find(x=>Number(x.id)===id1),b=rows.find(x=>Number(x.id)===id2);if(!a||!b||Number(a.is_latest)!==0||Number(b.is_latest)!==1)throw new Error("Quality latest marker invalid");' "$DEVICE_ID" "$QUALITY_ID_1" "$QUALITY_ID_2"
          curl -fsS -X PUT "$BASE/api/quality-ratings/$QUALITY_ID_1" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"rating_date\":\"2026-09-23\",\"evaluator\":\"CI 1 sửa\",\"age_score\":20,\"performance_score\":20,\"repair_score\":15,\"inspection_score\":15,\"sparepart_score\":15,\"recommendation\":\"Mốc 1 sửa\",\"note\":\"Hiệu chỉnh\"}" >/tmp/quality-update.json
          curl -fsS "$BASE/api/quality-ratings" >/tmp/quality-after-update.json
          node -e 'const fs=require("fs");const id1=Number(process.argv[1]),id2=Number(process.argv[2]);const rows=JSON.parse(fs.readFileSync("/tmp/quality-after-update.json","utf8"));const a=rows.find(x=>Number(x.id)===id1),b=rows.find(x=>Number(x.id)===id2);if(a?.evaluator!=="CI 1 sửa"||b?.evaluator!=="CI 2")throw new Error("Quality PUT overwrote wrong history row");' "$QUALITY_ID_1" "$QUALITY_ID_2"
          CODE=$(curl -s -o /tmp/quality-delete-reject.json -w '%{http_code}' -X DELETE "$BASE/api/quality-ratings/$QUALITY_ID_1")
          test "$CODE" = "409"
          QR_UID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).qr_uid')
          test -n "$DEVICE_ID"
          test -n "$QR_UID"
          curl -fsS "$BASE/api/qr/device-uid/$QR_UID" >/tmp/qr-before.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/qr-before.json","utf8")); if(d.device_code!=="TST.TST.0002") throw new Error("Archived device code was incorrectly reused: "+d.device_code)'
          curl -fsS "$BASE/api/qr-image?data=$(node -p 'encodeURIComponent(`http://10.0.0.10:5000/q/${process.argv[1]}`)' "$QR_UID")" >/tmp/local-qr.svg
          grep -q '<svg' /tmp/local-qr.svg
          if grep -R "api.qrserver.com" public server.js; then
            echo "External QR image service reference still exists"
            exit 1
          fi

          BEFORE_REJECTED_FILES=$(find uploads/qr -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          printf '\xFF\xD8\xFF\xD9' >/tmp/rejected-qr.jpg
          CODE=$(curl -s -o /tmp/rejected-qr-check.json -w '%{http_code}' -X POST "$BASE/api/qr/checks" \
            -F "device_id=$DEVICE_ID" \
            -F "inspector=Giả QR bằng device_id" \
            -F "condition=Bình thường" \
            -F "media=@/tmp/rejected-qr.jpg;type=image/jpeg")
          test "$CODE" = "400"
          AFTER_REJECTED_FILES=$(find uploads/qr -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$BEFORE_REJECTED_FILES" = "$AFTER_REJECTED_FILES"

          CODE=$(curl -s -o /tmp/rejected-qr-incident.json -w '%{http_code}' -X POST "$BASE/api/qr/incidents" \
            -H 'Content-Type: application/json' \
            --data "{\"device_id\":$DEVICE_ID,\"reporter\":\"CI\",\"description\":\"Không được tính là QR\",\"severity\":\"Trung bình\"}")
          test "$CODE" = "400"

          curl -fsS -X POST "$BASE/api/qr/checks" \
            -F "qr_uid=$QR_UID" \
            -F "inspector=QR Check CI" \
            -F "condition=Bình thường" \
            -F "description=" \
            -F "create_incident=0" >/tmp/qr-check.json
          QR_CHECK_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/qr-check.json","utf8")).check_id')
          curl -fsS "$BASE/api/checks?from_date=2000-01-01&to_date=2100-12-31" >/tmp/checks-before-edit.json
          QR_CHECK_TIME=$(node -e 'const fs=require("fs");const id=Number(process.argv[1]);const rows=JSON.parse(fs.readFileSync("/tmp/checks-before-edit.json","utf8"));const r=rows.find(x=>Number(x.id)===id);if(!r)throw new Error("QR check missing");process.stdout.write(String(r.check_datetime||""))' "$QR_CHECK_ID")
          curl -fsS -X PUT "$BASE/api/checks/$QR_CHECK_ID" -H 'Content-Type: application/json' --data '{"check_datetime":"2001-01-01 00:00:00","inspector":"QR Check CI sửa","content":"Hiệu chỉnh nội dung","result":"Có vấn đề","note":"Giữ nguyên thời điểm và kết quả quét"}' >/tmp/qr-check-update.json
          curl -fsS "$BASE/api/checks?from_date=2000-01-01&to_date=2100-12-31" >/tmp/checks-after-edit.json
          node -e 'const fs=require("fs");const id=Number(process.argv[1]);const expected=process.argv[2];const rows=JSON.parse(fs.readFileSync("/tmp/checks-after-edit.json","utf8"));const r=rows.find(x=>Number(x.id)===id);if(!r)throw new Error("QR check disappeared after edit");if(String(r.check_datetime)!==expected)throw new Error("QR timestamp changed");if(r.result!=="Bình thường")throw new Error("QR result changed after capture");if(r.inspector!=="QR Check CI sửa")throw new Error("QR content correction not saved")' "$QR_CHECK_ID" "$QR_CHECK_TIME"
          CODE=$(curl -s -o /tmp/qr-check-delete-reject.json -w '%{http_code}' -X DELETE "$BASE/api/checks/$QR_CHECK_ID")
          test "$CODE" = "409"
          curl -fsS -X POST "$BASE/api/checks" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"inspector\":\"Manual Check CI\",\"content\":\"Kiểm tra nhập trực tiếp\",\"result\":\"Bình thường\",\"note\":\"Không tính QR\"}" >/tmp/manual-check.json
          MANUAL_CHECK_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/manual-check.json","utf8")).id')
          CODE=$(curl -s -o /tmp/manual-check-delete-reject.json -w '%{http_code}' -X DELETE "$BASE/api/checks/$MANUAL_CHECK_ID")
          test "$CODE" = "409"
          curl -fsS "$BASE/api/dashboard/operations" >/tmp/dashboard-ops.json
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          EXPECTED_TODAY=$(node -p 'new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok"}).format(new Date())')
          test "$TODAY" = "$EXPECTED_TODAY"
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")); if(d.timeZone!=="Asia/Bangkok"||Number(d.qrChecksToday)!==1||Number(d.qrIssuesToday)!==0) throw new Error("Dashboard QR/time-zone metrics failed")'
          NOW="$TODAY 12:00"
          BEFORE_MANUAL_REJECT=$(find uploads/qr -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          printf '\xFF\xD8\xFF\xD9' >/tmp/rejected-manual.jpg
          CODE=$(curl -s -o /tmp/rejected-manual.json -w '%{http_code}' -X POST "$BASE/api/incidents" -F "device_id=$DEVICE_ID" -F "media=@/tmp/rejected-manual.jpg;type=image/jpeg")
          test "$CODE" = "400"
          AFTER_MANUAL_REJECT=$(find uploads/qr -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$BEFORE_MANUAL_REJECT" = "$AFTER_MANUAL_REJECT"
          curl -fsS -X POST "$BASE/api/incidents" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"incident_datetime\":\"$NOW\",\"description\":\"Sự cố kiểm thử CI\",\"severity\":\"Trung bình\",\"reporter\":\"CI\",\"status\":\"Mới ghi nhận\",\"note\":\"Ghi chú sự cố CI\"}" >/tmp/incident-create.json
          INCIDENT_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/incident-create.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/incidents/$INCIDENT_ID/acknowledge" -H 'Content-Type: application/json' --data '{"actor":"Khoa Trang bị - CI"}' >/tmp/ack.json
          CODE=$(curl -s -o /tmp/acknowledged-delete-reject.json -w '%{http_code}' -X DELETE "$BASE/api/incidents/$INCIDENT_ID")
          test "$CODE" = "400"
          curl -fsS -X POST "$BASE/api/incidents/$INCIDENT_ID/transfer-repair" -H 'Content-Type: application/json' --data '{"actor":"Khoa Trang bị - CI"}' >/tmp/transfer.json
          REPAIR_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/transfer.json","utf8")).repair_id')
          curl -fsS -X PUT "$BASE/api/repairs/$REPAIR_ID" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$NOW\",\"issue\":\"Sự cố kiểm thử CI\",\"work\":\"Khắc phục hoàn tất\",\"person\":\"Khoa Trang bị - CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"Đạt\",\"processing_status\":\"Đã hoàn thành\"}" >/tmp/repair-complete.json
          curl -fsS "$BASE/api/repairs" >/tmp/repairs-after-transfer.json
          node -e 'const fs=require("fs");const id=Number(process.argv[1]);const rows=JSON.parse(fs.readFileSync("/tmp/repairs-after-transfer.json","utf8"));const r=rows.find(x=>Number(x.id)===id);if(!r)throw new Error("Transferred repair missing");if(r.priority!=="Trung bình"||r.reporter!=="CI"||r.note!=="Ghi chú sự cố CI")throw new Error("Incident metadata was not preserved in repair: "+JSON.stringify({priority:r.priority,reporter:r.reporter,note:r.note}))' "$REPAIR_ID"
          curl -fsS -X POST "$BASE/api/devices/$DEVICE_ID/transfer" -H 'Content-Type: application/json' --data '{"to_department_code":"TST2","to_location":"Vị trí chuyển","reason":"Kiểm thử snapshot khoa","actor":"CI"}' >/tmp/device-transfer.json
          curl -fsS -X PUT "$BASE/api/devices/$DEVICE_ID" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị kiểm thử QR","manufacturer":"Test","model":"TEST-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"SERIAL-AFTER","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí B","note":"","insurance_code":"","actor":"CI"}' >/tmp/device-update.json
          curl -fsS "$BASE/api/qr/device-uid/$QR_UID" >/tmp/qr-after.json
          printf '\xFF\xD8\xFF\xD9' >/tmp/ci-upload.jpg
          curl -fsS -X POST "$BASE/api/qr/incidents" \
            -F "qr_uid=$QR_UID" \
            -F "reporter=QR CI" \
            -F "description=Sự cố báo qua QR CI" \
            -F "severity=Trung bình" \
            -F "media=@/tmp/ci-upload.jpg;type=image/jpeg" >/tmp/qr-incident.json
          QR_INCIDENT_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/qr-incident.json","utf8")).incident_id')
          curl -fsS "$BASE/api/incidents" >/tmp/incidents-after.json
          curl -fsS "$BASE/api/reports/kpi?from_date=$TODAY&to_date=$TODAY&department_code=ALL&response_target_minutes=30" >/tmp/kpi.json
          curl -fsS "$BASE/api/reports/kpi?from_date=$TODAY&to_date=$TODAY&department_code=TST&response_target_minutes=30" >/tmp/kpi-tst.json
          curl -fsS "$BASE/api/reports/kpi?from_date=$TODAY&to_date=$TODAY&department_code=TST2&response_target_minutes=30" >/tmp/kpi-tst2.json
          node - <<'NODE'
          const fs=require("fs");
          const before=JSON.parse(fs.readFileSync("/tmp/qr-before.json","utf8"));
          const after=JSON.parse(fs.readFileSync("/tmp/qr-after.json","utf8"));
          const incidentId=Number(JSON.parse(fs.readFileSync("/tmp/incident-create.json","utf8")).id);
          const qrIncidentId=Number(JSON.parse(fs.readFileSync("/tmp/qr-incident.json","utf8")).incident_id);
          const incidents=JSON.parse(fs.readFileSync("/tmp/incidents-after.json","utf8"));
          const row=incidents.find(x=>Number(x.id)===incidentId);
          const qrRow=incidents.find(x=>Number(x.id)===qrIncidentId);
          const kpi=JSON.parse(fs.readFileSync("/tmp/kpi.json","utf8"));
          const kpiTst=JSON.parse(fs.readFileSync("/tmp/kpi-tst.json","utf8"));
          const kpiTst2=JSON.parse(fs.readFileSync("/tmp/kpi-tst2.json","utf8"));
          if (!row) throw new Error("Incident not found after lifecycle");
          if (!qrRow) throw new Error("QR incident not found");
          if (!row.acknowledged_at) throw new Error("acknowledged_at missing");
          if (row.acknowledged_by!=="Khoa Trang bị - CI") throw new Error("acknowledged_by incorrect: "+row.acknowledged_by);
          if (row.source_channel!=="Nhập trực tiếp") throw new Error("Manual incident source incorrect");
          if (qrRow.source_channel!=="QR") throw new Error("QR incident source incorrect");
          if (Number(qrRow.media_count||0)<1 || !Array.isArray(qrRow.files) || !qrRow.files[0]?.file_path) throw new Error("Multipart incident media upload missing");
          if (row.location_snapshot!=="Vị trí A") throw new Error("Historical location snapshot changed: "+row.location_snapshot);
          if (row.department_code_snapshot!=="TST") throw new Error("Historical department snapshot changed: "+row.department_code_snapshot);
          if (row.location!=="Vị trí A") throw new Error("Incident location history failed");
          if (row.department_code!=="TST") throw new Error("Incident department history failed");
          if (row.current_location!=="Vị trí B") throw new Error("Current location context missing");
          if (row.current_department_code!=="TST2") throw new Error("Current department context missing");
          if (!row.linked_repair_completed_at) throw new Error("repair completion timestamp missing");
          if (String(before.qr_uid)!==String(after.qr_uid)) throw new Error("QR UID changed after device edit");
          if (String(after.serial)!=="SERIAL-AFTER") throw new Error("QR did not resolve current device data");
          if (Number(kpi.summary.total_incidents)!==2) throw new Error("KPI total incident count incorrect");
          if (Number(kpi.summary.qr_incidents)!==1 || Number(kpi.summary.direct_incidents)!==1) throw new Error("KPI source counts incorrect");
          const qrSource=(kpi.by_source||[]).find(x=>x.source==="QR");
          const directSource=(kpi.by_source||[]).find(x=>x.source==="Nhập trực tiếp");
          if(!qrSource || !directSource) throw new Error("KPI source comparison missing");
          if(Number(qrSource.count)!==1 || Number(directSource.count)!==1) throw new Error("KPI source comparison count failed");
          if(Number(qrSource.responded_incidents)!==0 || Number(directSource.responded_incidents)!==1) throw new Error("KPI source response denominator failed");
          if (Number(kpi.summary.qr_checks)!==1 || Number(kpi.summary.qr_check_unique_devices)!==1) throw new Error("QR check adoption metrics incorrect");
          if (Number(kpi.summary.qr_check_normal_count)!==1 || Number(kpi.summary.qr_check_issue_count)!==0) throw new Error("QR check result metrics incorrect");
          if (!Array.isArray(kpi.by_day) || kpi.by_day.length!==1) throw new Error("Daily KPI trend missing");
          if (Number(kpi.by_day[0].qr_checks)!==1 || Number(kpi.by_day[0].qr_unique_devices)!==1) throw new Error("Daily QR check metrics incorrect");
          if (Number(kpi.by_day[0].incidents)!==2 || Number(kpi.by_day[0].qr_incidents)!==1) throw new Error("Daily incident metrics incorrect");
          if (Number(kpi.summary.unknown_source_incidents)!==0) throw new Error("Unexpected unknown incident source");
          if (!Array.isArray(kpi.records) || kpi.records.length!==2) throw new Error("KPI detail records missing");
          if (Number(kpiTst.summary.total_incidents)!==1 || Number(kpiTst.summary.direct_incidents)!==1) throw new Error("Historical KPI department filter failed for TST");
          if (Number(kpiTst.summary.qr_checks)!==1) throw new Error("Historical QR check department snapshot failed for TST");
          if (Number(kpiTst2.summary.total_incidents)!==1 || Number(kpiTst2.summary.qr_incidents)!==1) throw new Error("KPI department filter failed for TST2");
          if (Number(kpiTst2.summary.qr_checks)!==0) throw new Error("QR check incorrectly moved to new department");
          console.log("QR/source/receiver/snapshot/KPI lifecycle passed");
          NODE

          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị truy vết QR","manufacturer":"Test","model":"TRACE-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"TRACE-QR-001","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí truy vết","note":"","insurance_code":"","actor":"CI"}' >/tmp/trace-device.json
          TRACE_QR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/trace-device.json","utf8")).qr_uid')
          curl -fsS -X POST "$BASE/api/qr/checks" \
            -F "qr_uid=$TRACE_QR" \
            -F "inspector=QR Trace CI" \
            -F "condition=Có vấn đề" \
            -F "description=Lỗi truy vết QR CI" \
            -F "severity=Thấp" \
            -F "create_incident=1" >/tmp/trace-check.json
          TRACE_CHECK_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/trace-check.json","utf8")).check_id')
          TRACE_INCIDENT_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/trace-check.json","utf8")).incident_id')
          test -n "$TRACE_CHECK_ID"
          test -n "$TRACE_INCIDENT_ID"
          curl -fsS "$BASE/api/checks?from_date=2000-01-01&to_date=2100-12-31" >/tmp/trace-checks.json
          node -e 'const fs=require("fs");const checkId=Number(process.argv[1]);const incidentId=Number(process.argv[2]);const rows=JSON.parse(fs.readFileSync("/tmp/trace-checks.json","utf8"));const r=rows.find(x=>Number(x.id)===checkId);if(!r)throw new Error("QR trace check missing");if(Number(r.incident_id)!==incidentId)throw new Error("QR check to incident link failed")' "$TRACE_CHECK_ID" "$TRACE_INCIDENT_ID"

      - name: Smoke test catalog rename integrity
        run: |
          BASE=http://127.0.0.1:5000
          curl -fsS -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"REN1","name":"Khoa đổi mã"}' >/tmp/ren-dept.json
          curl -fsS -X POST "$BASE/api/device-groups" -H 'Content-Type: application/json' --data '{"code":"RG1","name":"Nhóm đổi mã"}' >/tmp/ren-group.json
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"REN1","group_code":"RG1","name":"Thiết bị đổi danh mục","serial":"REN-CI-001","status":"Đang hoạt động","location":"Phòng CI"}' >/tmp/ren-device.json
          REN_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/ren-device.json","utf8")).id')
          REN_QR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/ren-device.json","utf8")).qr_uid')
          curl -fsS -X PUT "$BASE/api/departments/REN1" -H 'Content-Type: application/json' --data '{"code":"REN2","name":"Khoa đổi mã mới"}' >/tmp/ren-dept-update.json
          curl -fsS -X PUT "$BASE/api/device-groups/RG1" -H 'Content-Type: application/json' --data '{"code":"RG2","name":"Nhóm đổi mã mới"}' >/tmp/ren-group-update.json
          curl -fsS "$BASE/api/devices/$REN_DEVICE" >/tmp/ren-device-after.json
          curl -fsS "$BASE/api/system/readiness" >/tmp/ren-readiness.json
          node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/ren-device-after.json","utf8"));
          const r=JSON.parse(fs.readFileSync("/tmp/ren-readiness.json","utf8"));
          const original=JSON.parse(fs.readFileSync("/tmp/ren-device.json","utf8"));
          if(d.department_code!=="REN2" || d.group_code!=="RG2") throw new Error("Catalog rename did not update current device references");
          if(String(d.qr_uid)!==String(original.qr_uid)) throw new Error("Catalog rename changed QR UID");
          if(r.system?.foreign_keys_enabled!==true || Number(r.system?.foreign_key_violations||0)!==0) throw new Error("Catalog rename broke foreign-key integrity");
          console.log("Catalog rename integrity passed");
          NODE

      - name: Smoke test attachment file integrity
        run: |
          BASE=http://127.0.0.1:5000
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).id')
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          printf '%s\n' '%PDF-1.4' '%%EOF' >/tmp/attachment-a.pdf
          printf '%s\n' '%PDF-1.4' 'replacement' '%%EOF' >/tmp/attachment-b.pdf
          printf '<html>CI rejected upload</html>' >/tmp/rejected-upload.html
          printf 'CI rejected QR media' >/tmp/rejected-qr-media.txt

          BEFORE_DOC_REJECT=$(find uploads/documents -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          CODE=$(curl -s -o /tmp/rejected-document-type.json -w '%{http_code}' -X POST "$BASE/api/documents" \
            -F "device_id=$DEVICE_ID" -F "name=File không hợp lệ" -F "type=Khác" \
            -F "file=@/tmp/rejected-upload.html;type=text/html")
          test "$CODE" = "400"
          AFTER_DOC_REJECT=$(find uploads/documents -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$BEFORE_DOC_REJECT" = "$AFTER_DOC_REJECT"

          QR_UID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).qr_uid')
          BEFORE_QR_REJECT=$(find uploads/qr -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          CODE=$(curl -s -o /tmp/rejected-qr-media-type.json -w '%{http_code}' -X POST "$BASE/api/qr/checks" \
            -F "qr_uid=$QR_UID" -F "inspector=CI" -F "condition=Bình thường" \
            -F "media=@/tmp/rejected-qr-media.txt;type=text/plain")
          test "$CODE" = "400"
          AFTER_QR_REJECT=$(find uploads/qr -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$BEFORE_QR_REJECT" = "$AFTER_QR_REJECT"

          BEFORE=$(find uploads/documents -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          CODE=$(curl -s -o /tmp/rejected-maintenance.json -w '%{http_code}' -X POST "$BASE/api/maintenances" \
            -F "device_id=999999" -F "maintenance_date=$TODAY 14:00" -F "content=Không hợp lệ" \
            -F "file=@/tmp/attachment-a.pdf;type=application/pdf")
          test "$CODE" = "400"
          AFTER=$(find uploads/documents -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$BEFORE" = "$AFTER"

          curl -fsS -X POST "$BASE/api/documents" \
            -F "device_id=$DEVICE_ID" -F "name=Tài liệu chung kiểm thử" -F "type=Khác" -F "doc_date=$TODAY" \
            -F "file=@/tmp/attachment-a.pdf;type=application/pdf" >/tmp/document-create.json
          DOC_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/document-create.json","utf8")).id')
          OLD_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/document-create.json","utf8")).file_path')
          test -f ".$OLD_PATH"

          curl -fsS -X PUT "$BASE/api/documents/$DOC_ID" \
            -F "name=Tài liệu chung cập nhật" -F "type=Khác" -F "doc_date=$TODAY" \
            -F "file=@/tmp/attachment-b.pdf;type=application/pdf" >/tmp/document-update.json
          NEW_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/document-update.json","utf8")).file_path')
          test ! -f ".$OLD_PATH"
          test -f ".$NEW_PATH"
          curl -fsS -X DELETE "$BASE/api/documents/$DOC_ID" >/tmp/document-delete.json
          test ! -f ".$NEW_PATH"

          curl -fsS -X POST "$BASE/api/maintenances" \
            -F "device_id=$DEVICE_ID" -F "maintenance_date=$TODAY 15:00" -F "type=Bảo dưỡng định kỳ" \
            -F "content=Kiểm tra file lịch sử" -F "result=Đạt" -F "performer=CI" \
            -F "file=@/tmp/attachment-a.pdf;type=application/pdf" >/tmp/maintenance-file-create.json
          MAINT_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/maintenance-file-create.json","utf8")).id')
          MAINT_OLD_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/maintenance-file-create.json","utf8")).file_path')
          test -f ".$MAINT_OLD_PATH"
          curl -fsS -X PUT "$BASE/api/maintenances/$MAINT_ID" \
            -F "device_id=$DEVICE_ID" -F "maintenance_date=$TODAY 15:30" -F "type=Bảo dưỡng định kỳ" \
            -F "content=Thay file nhưng giữ lịch sử" -F "result=Đạt" -F "performer=CI" \
            -F "file=@/tmp/attachment-b.pdf;type=application/pdf" >/tmp/maintenance-file-update.json
          MAINT_NEW_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/maintenance-file-update.json","utf8")).file_path')
          test -f ".$MAINT_OLD_PATH"
          test -f ".$MAINT_NEW_PATH"
          CODE=$(curl -s -o /tmp/maintenance-evidence-delete.json -w '%{http_code}' -X DELETE "$BASE/api/maintenances/$MAINT_ID")
          test "$CODE" = "409"
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-with-maint-doc.json
          MAINT_DOC_ID=$(node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/device-with-maint-doc.json","utf8"));
          const p=String(JSON.parse(fs.readFileSync("/tmp/maintenance-file-update.json","utf8")).file_path||"");
          const row=(d.documents||[]).find(x=>String(x.file_path||"")===p);
          if(!row) throw new Error("Maintenance document mirror missing");
          process.stdout.write(String(row.id));
          NODE
          )
          CODE=$(curl -s -o /tmp/maintenance-doc-delete-reject.json -w '%{http_code}' -X DELETE "$BASE/api/documents/$MAINT_DOC_ID")
          test "$CODE" = "409"
          test -f ".$MAINT_NEW_PATH"

          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"inspection_date\":\"$TODAY 16:00\",\"type\":\"Kiểm định\",\"organization\":\"CI\",\"certificate_no\":\"CERT-CI\",\"result\":\"Đạt\",\"next_date\":\"\",\"file_note\":\"$MAINT_NEW_PATH\",\"note\":\"Kiểm tra bảo toàn chứng nhận\"}" >/tmp/inspection-evidence.json
          INSPECTION_EVIDENCE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/inspection-evidence.json","utf8")).id')
          CODE=$(curl -s -o /tmp/inspection-evidence-delete.json -w '%{http_code}' -X DELETE "$BASE/api/inspections/$INSPECTION_EVIDENCE_ID")
          test "$CODE" = "409"
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/protected-history-after.json
          node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/protected-history-after.json","utf8"));
          const maint=Number(JSON.parse(fs.readFileSync("/tmp/maintenance-file-create.json","utf8")).id);
          const insp=Number(JSON.parse(fs.readFileSync("/tmp/inspection-evidence.json","utf8")).id);
          if(!(d.maintenances||[]).some(x=>Number(x.id)===maint)) throw new Error("Protected maintenance record disappeared");
          if(!(d.inspections||[]).some(x=>Number(x.id)===insp)) throw new Error("Protected inspection record disappeared");
          NODE
          echo "Attachment and protected technical-history integrity passed"

      - name: Smoke test quality and usage validation
        run: |
          BASE=http://127.0.0.1:5000
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).id')
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')

          CODE=$(curl -s -o /tmp/quality-invalid.json -w '%{http_code}' -X POST "$BASE/api/quality-ratings" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"rating_date\":\"$TODAY\",\"evaluator\":\"CI\",\"age_score\":26,\"performance_score\":25,\"repair_score\":20,\"inspection_score\":15,\"sparepart_score\":15}")
          test "$CODE" = "400"

