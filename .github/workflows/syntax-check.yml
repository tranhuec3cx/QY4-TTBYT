          curl -fsS -X POST "$BASE/api/devices/$BACK_DEVICE/transfer" -H 'Content-Type: application/json' --data "{\"transfer_datetime\":\"$HISTORY_DAY 12:00:00\",\"to_department_code\":\"TST2\",\"to_location\":\"Vị trí hiện tại B\",\"reason\":\"Kiểm thử nhập hồi cứu\",\"actor\":\"CI\"}" >/tmp/backdated-transfer.json

