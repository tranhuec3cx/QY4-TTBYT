name: QY4 syntax and smoke check
on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          for f in public/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
          if grep -R "XLSX\." public server.js; then
            echo "Legacy SheetJS XLSX reference remains"
            exit 1
          fi
          if grep -R "/vendor/xlsx" public server.js; then
            echo "Legacy SheetJS vendor route remains"
            exit 1
          fi
          node - <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("public/device-detail.html","utf8");
          const js=fs.readFileSync("public/device-detail.js","utf8");
          const serverSource=fs.readFileSync("server.js","utf8");
          const authGuardIndex=serverSource.indexOf("app.use(authApiGuard)");
          const qrLimiterIndex=serverSource.indexOf('app.use("/api/qr", qrPublicWriteLimiter)');
          const jsonParserIndex=serverSource.indexOf('app.use(express.json({ limit: "10mb" }))');
          if(authGuardIndex<0 || qrLimiterIndex<0 || jsonParserIndex<0 || !(authGuardIndex<qrLimiterIndex && qrLimiterIndex<jsonParserIndex)){
            throw new Error("Security middleware order must be auth -> QR limiter -> JSON parser");
          }
          for(const legacy of ["tab-accessories","tab-incidents","tab-repairs","tab-maint","tab-inspections","tab-op","tab-docs"]){
            if(html.includes('id="'+legacy+'"')) throw new Error("Legacy device-detail tab remains: "+legacy);
          }
          if(!html.includes('id="generalDepartment" disabled')) throw new Error("Device department must be locked in general info");
          if(!html.includes('id="generalLocation" placeholder="Vị trí đặt máy" readonly')) throw new Error("Device location must be locked in general info");
          if(js.includes('department_code: q("generalDepartment").value')) throw new Error("General form can bypass transfer department history");
          if(js.includes('location: q("generalLocation").value.trim()')) throw new Error("General form can bypass transfer location history");
          if(!js.includes('/api/devices/${DEVICE_ID}/transfer')) throw new Error("Transfer workflow missing");
          if(!html.includes("<th>Hồ sơ</th>") || !js.includes("transferFileHref")) throw new Error("Legacy transfer attachment UI missing");
          const maintenanceJs=fs.readFileSync("public/maintenance.js","utf8");
          const ticketsJs=fs.readFileSync("public/tickets.js","utf8");
          const maintenancePlanJs=fs.readFileSync("public/inspection.js","utf8");
          const inspectionsJs=fs.readFileSync("public/inspections.js","utf8");
          if(!maintenanceJs.includes('q("repairStatus").disabled = isTerminal')) throw new Error("Terminal repair status must be locked in edit UI");
          if(!maintenanceJs.includes('q("repairStatus").disabled = false')) throw new Error("Repair status control must reset for new records");
          for(const [name,source] of [["Sự cố",ticketsJs],["Sửa chữa",maintenanceJs],["Bảo dưỡng",maintenancePlanJs],["Kiểm định",inspectionsJs]]){
            if(!source.includes("bindDevicePicker(")) throw new Error(name+" must use the shared device picker");
          }
          if(!ticketsJs.includes('q("deviceSearch").readOnly=false')) throw new Error("Incident reset must unlock device picker");
          if(!maintenanceJs.includes('q("repairDeviceSearch").readOnly = false')) throw new Error("Repair reset must unlock device picker");
          if(!maintenancePlanJs.includes('q("deviceSearch").readOnly=false')) throw new Error("Maintenance reset must unlock device picker");
          if(!inspectionsJs.includes("q('deviceSearch').readOnly=false")) throw new Error("Inspection reset must unlock device picker");
          for(const legacyApi of ["/api/accessories","/api/repairs","/api/maintenances","/api/operation-logs","/api/documents"]){
            if(js.includes(legacyApi)) throw new Error("Legacy device-detail write path remains: "+legacyApi);
          }
          console.log("Device detail single-workflow guard passed");
          NODE
      - name: Check Windows production launcher
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Path "./start-qy4-production.ps1"
          [void][ScriptBlock]::Create($content)
          if (-not (Test-Path "./start-qy4-production.cmd")) { throw "Missing Windows CMD launcher" }
          if ($content -notmatch 'QY4_DEMO_SEED = "0"') { throw "Production launcher must disable demo seed" }
          if ($content -notmatch 'QY4_AUTH_REQUIRED = "1"') { throw "Production launcher must enable auth" }
          if ($content -notmatch 'QY4_ALLOW_LEGACY_QR = "0"') { throw "Production launcher must disable legacy QR" }
          if ($content -notmatch 'npm ci') { throw "Production launcher must synchronize dependencies" }
          if ($content -notmatch 'prestart_') { throw "Production launcher must create pre-migration DB backup" }
          if ($content -notmatch 'QY4_PRESTART_KEEP') { throw "Production launcher must cap pre-start backup retention" }
          if (-not (Test-Path "./scripts/preflight-realdata.js")) { throw "Missing real-data preflight script" }
          if (-not (Test-Path "./scripts/verify-backup-restore.js")) { throw "Missing backup restore rehearsal script" }
          if (-not (Test-Path "./verify-backup.cmd")) { throw "Missing one-click Windows backup verifier" }
          if (-not (Test-Path "./scripts/audit-migration.js")) { throw "Missing migration preservation audit script" }
          if (-not (Test-Path "./audit-migration.cmd")) { throw "Missing one-click Windows migration audit" }
          if (-not (Test-Path "./scripts/final-release-gate.js")) { throw "Missing consolidated final release gate script" }
          if (-not (Test-Path "./final-release-gate.cmd")) { throw "Missing one-click Windows final release gate" }
          if ($content -notmatch 'QY4_PUBLIC_ORIGIN') { throw "Production launcher must warn about server-locked QR origin" }
          $apiJs = Get-Content -Raw -Path "./public/api.js"
          if ($apiJs -notmatch 'origin_locked' -or $apiJs -notmatch 'origin_print_safe' -or $apiJs -notmatch 'qrPrintBtn') { throw "QR UI must honor server-locked origin before printing" }
          $npmCiIndex = $content.IndexOf("npm ci")
          $preflightIndex = $content.IndexOf("scripts\preflight-realdata.js")
          $npmStartIndex = $content.LastIndexOf("npm start")
          if ($npmCiIndex -lt 0 -or $preflightIndex -lt 0 -or $npmStartIndex -lt 0) { throw "Launcher dependency/preflight/start sequence missing" }
          if ($preflightIndex -le $npmCiIndex) { throw "Preflight must run after dependency synchronization" }
          if ($preflightIndex -ge $npmStartIndex) { throw "Preflight must run before server migration/start" }
          Write-Host "Windows production launcher check passed"

      - name: Install dependencies
        run: npm ci
      - name: Prepare legacy quality-rating schema
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const Database=require("better-sqlite3");
          fs.mkdirSync("db",{recursive:true});
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.exec(`
            CREATE TABLE IF NOT EXISTS quality_ratings (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              device_id INTEGER NOT NULL UNIQUE,
              rating_date TEXT,
              age_score INTEGER DEFAULT 0,
              performance_score INTEGER DEFAULT 0,
              repair_score INTEGER DEFAULT 0,
              inspection_score INTEGER DEFAULT 0,
              sparepart_score INTEGER DEFAULT 0,
              total_score INTEGER DEFAULT 0,
              grade TEXT,
              recommendation TEXT,
              evaluator TEXT,
              note TEXT
            );

            -- Schema thiết bị/điều chuyển legacy lấy từ gói R15 trước RC.
            CREATE TABLE IF NOT EXISTS departments (
              code TEXT PRIMARY KEY,
              name TEXT NOT NULL
            );
            CREATE TABLE IF NOT EXISTS device_groups (
              code TEXT PRIMARY KEY,
              name TEXT NOT NULL
            );
            INSERT INTO departments(code,name) VALUES
              ('A12','Khoa HSTC'),('A2','Khoa Nội tim mạch');
            INSERT INTO device_groups(code,name) VALUES
              ('MON','Monitor');
            CREATE TABLE IF NOT EXISTS devices (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              department_code TEXT,
              group_code TEXT,
              name TEXT NOT NULL,
              manufacturer TEXT,
              model TEXT,
              year_in_use INTEGER,
              warranty_end TEXT,
              status TEXT,
              quality_level INTEGER DEFAULT 3,
              serial TEXT,
              country TEXT,
              year_manufactured INTEGER,
              cost REAL DEFAULT 0,
              funding TEXT,
              location TEXT,
              note TEXT,
              device_code TEXT,
              insurance_code TEXT
            );
            CREATE TABLE IF NOT EXISTS device_transfers (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              device_id INTEGER NOT NULL,
              transfer_date TEXT,
              from_department TEXT,
              to_department TEXT,
              from_location TEXT,
              to_location TEXT,
              reason TEXT,
              approved_by TEXT,
              receiver TEXT,
              note TEXT,
              created_at TEXT,
              movement_type TEXT,
              document_no TEXT,
              handover_condition TEXT,
              giver TEXT,
              status_before TEXT,
              status_after TEXT,
              document_original_name TEXT,
              document_stored_name TEXT,
              document_file_path TEXT,
              document_file_mime TEXT,
              document_file_size INTEGER DEFAULT 0
            );
            CREATE TABLE IF NOT EXISTS daily_checks (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              device_id INTEGER NOT NULL,
              check_datetime TEXT,
              inspector TEXT,
              content TEXT,
              result TEXT,
              note TEXT
            );
            INSERT INTO devices
              (id,department_code,group_code,name,manufacturer,model,year_in_use,status,quality_level,serial,country,location,device_code)
            VALUES
              (1,'A2','MON','Thiết bị legacy R15','CI','R15-LEGACY',2020,'Đang hoạt động',3,'R15-LEGACY-001','VN','P1','A2.MON.0001');
            INSERT INTO device_transfers
              (device_id,transfer_date,from_department,to_department,from_location,to_location,reason,approved_by,receiver,note,created_at,movement_type,giver,status_before,status_after,document_original_name,document_stored_name,document_file_path,document_file_mime,document_file_size)
            VALUES
              (1,'2026-09-06','A12','A2','Buồng HSTC 2','P1','Điều chuyển legacy R15','C','B','Giữ lịch sử R15','2026-09-06 12:14:46','Thu hồi','A','Đang hoạt động','Đang hoạt động','bien-ban-legacy.txt','legacy-transfer.txt','/uploads/documents/legacy-transfer.txt','text/plain',18);
            INSERT INTO daily_checks
              (device_id,check_datetime,inspector,content,result,note)
            VALUES
              (1,'2026-09-05 09:00:00','CI R15','Kiểm tra trước điều chuyển','Đạt','Legacy check');
          `);
          db.close();
          fs.mkdirSync("uploads/documents",{recursive:true});
          fs.writeFileSync("uploads/documents/legacy-transfer.txt","bien ban legacy ci");
          NODE
          cp db/qy4_ttbyt.sqlite /tmp/qy4-r15-before.sqlite
      - name: Dependency audit summary
        run: |
          npm audit --json >/tmp/npm-audit.json || true
          node - <<'NODE'
          const fs=require("fs");
          const a=JSON.parse(fs.readFileSync("/tmp/npm-audit.json","utf8"));
          const meta=a.metadata?.vulnerabilities || {};
          console.log("npm audit summary:",meta);
          for(const [name,v] of Object.entries(a.vulnerabilities || {})){
            console.log(`AUDIT ${String(v.severity||"unknown").toUpperCase()} ${name} direct=${Boolean(v.isDirect)} via=${JSON.stringify(v.via)} fix=${JSON.stringify(v.fixAvailable)}`);
          }
          if(Number(meta.high||0)>0 || Number(meta.critical||0)>0){
            throw new Error("Dependency audit has High/Critical vulnerabilities");
          }
          NODE
      - name: Preflight legacy R15 fixture
        run: |
          node scripts/preflight-realdata.js --db db/qy4_ttbyt.sqlite --uploads uploads --json >/tmp/preflight-r15.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/preflight-r15.json","utf8"));
          if(r.ok!==true || (r.blockers||[]).length) throw new Error("Legacy R15 preflight unexpectedly blocked: "+JSON.stringify(r.blockers));
          if(r.stats?.legacy_transfer_schema!==true) throw new Error("Legacy transfer schema was not detected by preflight");
          if(r.stats?.legacy_quality_unique!==true) throw new Error("Legacy quality schema was not detected by preflight");
          if(r.stats?.quick_check!=="ok" || Number(r.stats?.foreign_key_violations||0)!==0) throw new Error("Legacy fixture integrity preflight failed");
          console.log("Legacy R15 read-only preflight passed");
          NODE

          cp db/qy4_ttbyt.sqlite /tmp/preflight-bad-catalog.sqlite
          node - <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("/tmp/preflight-bad-catalog.sqlite");
          db.exec("ALTER TABLE devices ADD COLUMN qr_uid TEXT");
          db.prepare("UPDATE devices SET department_code='', group_code='MISSING_GROUP', qr_uid='duplicate-qr-ci' WHERE id=1").run();
          db.prepare(`
            INSERT INTO devices
              (id,department_code,group_code,name,manufacturer,model,year_in_use,status,quality_level,serial,country,location,device_code,qr_uid)
            VALUES
              (2,'A2','MON','Thiết bị trùng QR CI','CI','QR-DUP',2020,'Đang hoạt động',3,'R15-QR-DUP','VN','P2','A2.MON.0002','duplicate-qr-ci')
          `).run();
          db.prepare("UPDATE device_transfers SET document_file_size=999 WHERE id=1").run();
          db.close();
          NODE
          set +e
          node scripts/preflight-realdata.js --db /tmp/preflight-bad-catalog.sqlite --uploads uploads --json >/tmp/preflight-bad-catalog.json
          PREFLIGHT_CODE=$?
          set -e
          test "$PREFLIGHT_CODE" = "2"
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/preflight-bad-catalog.json","utf8"));
          if(r.ok!==false || Number(r.stats?.missing_device_department||0)<1) throw new Error("Missing device department was not detected by preflight");
          if(Number(r.stats?.unknown_device_group_refs||0)<1) throw new Error("Orphan device group was not detected by preflight");
          if(Number(r.stats?.duplicate_qr_uid_groups||0)<1) throw new Error("Duplicate QR UID was not detected by preflight");
          if(Number(r.stats?.referenced_file_size_mismatches||0)<1) throw new Error("Attachment size mismatch was not detected by preflight");
          if(!(r.blockers||[]).some(x=>String(x).includes("dữ liệu định danh lõi"))) throw new Error("Core device identity blocker missing");
          if(!(r.blockers||[]).some(x=>String(x).includes("danh mục không tồn tại"))) throw new Error("Orphan catalog-reference blocker missing");
          if(!(r.blockers||[]).some(x=>String(x).includes("QR UID bị trùng"))) throw new Error("Duplicate QR UID blocker missing");
          if(!(r.blockers||[]).some(x=>String(x).includes("kích thước không khớp"))) throw new Error("Attachment-size blocker missing");
          console.log("Invalid catalog + attachment metadata preflight blocking passed");
          NODE

          cp db/qy4_ttbyt.sqlite /tmp/preflight-bad-transfer.sqlite
          node - <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("/tmp/preflight-bad-transfer.sqlite");
          db.prepare(`
            INSERT INTO device_transfers
              (device_id,transfer_date,from_department,to_department,from_location,to_location,reason,created_at,movement_type,giver)
            VALUES
              (1,'2026-09-07','SAI_KHOA','A2','Sai vị trí','P1','CI tạo đứt chuỗi legacy','2026-09-07 08:00:00','Điều chuyển','CI')
          `).run();
          db.close();
          NODE
          node scripts/preflight-realdata.js --db /tmp/preflight-bad-transfer.sqlite --uploads uploads --json >/tmp/preflight-bad-transfer.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/preflight-bad-transfer.json","utf8"));
          if(r.ok!==true || (r.blockers||[]).length) throw new Error("Transfer-chain anomaly should warn, not block pre-migration");
          if(Number(r.stats?.transfer_chain_mismatches||0)<1) throw new Error("Legacy transfer-chain break was not detected");
          if(!(r.warnings||[]).some(x=>String(x).includes("đứt chuỗi"))) throw new Error("Transfer-chain warning text missing");
          console.log("Legacy transfer-chain preflight warning passed");
          NODE

      - name: Start server
        run: |
          QY4_DEMO_SEED=0 node server.js > /tmp/qy4-server.log 2>&1 &
          echo $! > /tmp/qy4-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/api/devices >/tmp/devices.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qy4-server.log
          exit 1
      - name: Audit legacy migration record preservation
        run: |
          node scripts/audit-migration.js --before /tmp/qy4-r15-before.sqlite --after db/qy4_ttbyt.sqlite --json >/tmp/migration-audit.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/migration-audit.json","utf8"));
          if(r.ok!==true || (r.blockers||[]).length) throw new Error("Migration preservation audit failed: "+JSON.stringify(r.blockers));
          for(const table of ["devices","device_transfers","daily_checks","quality_ratings"]){
            const x=r.stats?.tables?.[table];
            if(!x) throw new Error("Migration audit missing table result: "+table);
            if(Number(x.lost_keys||0)!==0) throw new Error("Migration lost legacy keys in "+table);
          }
          if(Number(r.stats?.foreign_key_violations_after||0)!==0) throw new Error("Migration audit found FK violations");
          console.log("Legacy migration record preservation audit passed");
          NODE

          cp db/qy4_ttbyt.sqlite /tmp/qy4-r15-after-corrupt.sqlite
          node - <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("/tmp/qy4-r15-after-corrupt.sqlite");
          db.pragma("foreign_keys=OFF");
          db.prepare("DELETE FROM device_transfers WHERE id=1").run();
          db.prepare("UPDATE devices SET serial='SERIAL-BI-DOI-SAI' WHERE id=1").run();
          db.close();
          NODE
          set +e
          node scripts/audit-migration.js --before /tmp/qy4-r15-before.sqlite --after /tmp/qy4-r15-after-corrupt.sqlite --json >/tmp/migration-audit-corrupt.json
          MIGRATION_AUDIT_BAD=$?
          set -e
          test "$MIGRATION_AUDIT_BAD" = "2"
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/migration-audit-corrupt.json","utf8"));
          if(r.ok!==false) throw new Error("Corrupted post-migration DB was not rejected");
          if(Number(r.stats?.tables?.device_transfers?.lost_keys||0)<1) throw new Error("Audit missed lost transfer ID");
          if(Number(r.stats?.tables?.devices?.identity_changes?.serial||0)<1) throw new Error("Audit missed changed device Serial");
          console.log("Migration audit corruption detection passed");
          NODE
      - name: Smoke test core APIs
        run: |
          BASE=http://127.0.0.1:5000
          CODE=$(curl -s -o /tmp/root.html -w '%{http_code}' "$BASE/")
          test "$CODE" = "302"
          LOCATION=$(curl -s -I "$BASE/" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}' | tail -1)
          test "$LOCATION" = "/dashboard.html"
          curl -fsS "$BASE/api/dashboard/operations" >/tmp/dashboard.json
          curl -fsS "$BASE/api/inventory-sessions" >/tmp/inventory.json
          curl -fsS "$BASE/api/system/backups" >/tmp/backups.json
          curl -fsS "$BASE/api/system/readiness" >/tmp/readiness.json
          curl -fsS -X POST "$BASE/api/export/xlsx" -H 'Content-Type: application/json' --data '{"filename":"ci-export.xlsx","sheets":[{"name":"Test","rows":[{"Cot A":"Gia tri 1","Cot B":123},{"Cot A":"Gia tri 2","Cot B":456}]}]}' >/tmp/ci-export.xlsx
          node - <<'NODE'
          const ExcelJS=require("exceljs");
          (async()=>{
            const wb=new ExcelJS.Workbook();
            await wb.xlsx.readFile("/tmp/ci-export.xlsx");
            const ws=wb.getWorksheet("Test");
            if(!ws || ws.getCell("A1").value!=="Cot A" || ws.getCell("B3").value!==456) throw new Error("Server XLSX export invalid");
            console.log("Server XLSX export passed");
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          curl -fsS "$BASE/api/devices/duplicate-check?serial=__TEST__" >/tmp/duplicate.json
          node -e 'for (const p of ["/tmp/devices.json","/tmp/dashboard.json","/tmp/inventory.json","/tmp/backups.json","/tmp/readiness.json","/tmp/duplicate.json"]) JSON.parse(require("fs").readFileSync(p,"utf8")); const r=JSON.parse(require("fs").readFileSync("/tmp/readiness.json","utf8")); if(!Array.isArray(r.checks)||r.checks.length<10||r.system?.time_zone!=="Asia/Bangkok"||r.system?.database_integrity!=="Đạt"||r.system?.foreign_keys_enabled!==true||Number(r.system?.foreign_key_violations||0)!==0) throw new Error("Readiness API invalid"); console.log("Core API smoke test passed")'
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/readiness.json","utf8")); const c=(r.checks||[]).find(x=>x.key==="repair_consistency"); if(!c||c.level!=="Đạt"||Number(r.system?.duplicate_open_repair_devices||0)!==0||Number(r.system?.open_repair_status_mismatches||0)!==0) throw new Error("Repair consistency readiness baseline invalid: "+JSON.stringify(c)); console.log("Repair consistency readiness baseline passed")'
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/readiness.json","utf8")); const c=(r.checks||[]).find(x=>x.key==="device_catalog_integrity"); if(!c||c.level!=="Đạt"||Number(r.system?.missing_device_name||0)!==0||Number(r.system?.missing_device_department||0)!==0||Number(r.system?.missing_device_group||0)!==0||Number(r.system?.unknown_device_department_refs||0)!==0||Number(r.system?.unknown_device_group_refs||0)!==0) throw new Error("Device catalog integrity readiness invalid: "+JSON.stringify(c)); console.log("Device catalog integrity readiness passed")'
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/readiness.json","utf8")); const c=(r.checks||[]).find(x=>x.key==="transfer_history"); if(!c||c.level!=="Đạt"||Number(r.system?.transfer_chain_mismatches||0)!==0||Number(r.system?.transfer_current_context_mismatches||0)!==0) throw new Error("Transfer history readiness baseline invalid: "+JSON.stringify(c)); console.log("Transfer history readiness baseline passed")'

          node - <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.pragma("busy_timeout=5000");
          db.prepare(`
            INSERT INTO device_transfers
              (device_id,transfer_datetime,from_department_code,from_location,to_department_code,to_location,reason,actor,note)
            VALUES
              (1,'2026-09-07 08:00:00','SAI_KHOA','Sai vị trí','A2','P1','CI tạo đứt chuỗi readiness','CI','')
          `).run();
          db.close();
          NODE
          curl -fsS "$BASE/api/system/readiness" >/tmp/transfer-dirty-readiness.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/transfer-dirty-readiness.json","utf8"));
          const c=(r.checks||[]).find(x=>x.key==="transfer_history");
          if(c?.level!=="Cần xử lý" || Number(r.system?.transfer_chain_mismatches||0)<1) throw new Error("Broken transfer chain was not blocked by readiness: "+JSON.stringify(c));
          console.log("Broken transfer-chain readiness detection passed");
          NODE
          node - <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.prepare("DELETE FROM device_transfers WHERE reason='CI tạo đứt chuỗi readiness'").run();
          db.prepare("UPDATE devices SET location='P1-direct-edit' WHERE id=1").run();
          db.close();
          NODE
          curl -fsS "$BASE/api/system/readiness" >/tmp/transfer-current-warning.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/transfer-current-warning.json","utf8"));
          const c=(r.checks||[]).find(x=>x.key==="transfer_history");
          if(c?.level!=="Lưu ý" || Number(r.system?.transfer_chain_mismatches||0)!==0 || Number(r.system?.transfer_current_context_mismatches||0)<1) throw new Error("Current-context transfer mismatch should be a warning: "+JSON.stringify(c));
          console.log("Transfer current-context warning passed");
          NODE
          node - <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.prepare("UPDATE devices SET location='P1' WHERE id=1").run();
          db.close();
          NODE
