          node -e 'const fs=require("fs");const id=Number(process.argv[1]);const rows=JSON.parse(fs.readFileSync("/tmp/repairs-after-transfer.json","utf8"));const r=rows.find(x=>Number(x.id)===id);if(!r)throw new Error("Transferred repair missing");if(r.priority!=="Trung bình"||r.reporter!=="CI"||r.note!=="Ghi chú sự cố CI")throw new Error("Incident metadata was not preserved in repair: "+JSON.stringify({priority:r.priority,reporter:r.reporter,note:r.note}))' "$REPAIR_ID"
          curl -fsS -X POST "$BASE/api/devices/$DEVICE_ID/transfer" -H 'Content-Type: application/json' --data '{"to_department_code":"TST2","to_location":"Vị trí chuyển","reason":"Kiểm thử snapshot khoa","actor":"CI"}' >/tmp/device-transfer.json
          CODE=$(curl -s -o /tmp/device-location-bypass.json -w '%{http_code}' -X PUT "$BASE/api/devices/$DEVICE_ID" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị kiểm thử QR","manufacturer":"Test","model":"TEST-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"SERIAL-AFTER","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí B","note":"","insurance_code":"","actor":"CI"}')
          test "$CODE" = "409"
          curl -fsS -X PUT "$BASE/api/devices/$DEVICE_ID" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị kiểm thử QR","manufacturer":"Test","model":"TEST-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"SERIAL-AFTER","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí chuyển","note":"","insurance_code":"","actor":"CI"}' >/tmp/device-update.json
          curl -fsS "$BASE/api/checks?from_date=2000-01-01&to_date=2100-12-31" >/tmp/checks-after-transfer.json
          node -e 'const fs=require("fs");const id=Number(process.argv[1]);const rows=JSON.parse(fs.readFileSync("/tmp/checks-after-transfer.json","utf8"));const r=rows.find(x=>Number(x.id)===id);if(!r)throw new Error("Historical QR check missing after transfer");if(r.department_code!=="TST"||r.location!=="Vị trí A")throw new Error("Check API lost historical context");if(r.current_department_code!=="TST2"||r.current_location!=="Vị trí chuyển")throw new Error("Check API lost current context")' "$QR_CHECK_ID"
          curl -fsS "$BASE/api/qr/device-uid/$QR_UID" >/tmp/qr-after.json
          printf '\xFF\xD8\xFF\xD9' >/tmp/ci-upload.jpg
          curl -fsS -X POST "$BASE/api/qr/incidents" \
            -F "qr_uid=$QR_UID" \
            -F "reporter=QR CI" \
            -F "description=Sự cố báo qua QR CI" \
            -F "severity=Trung bình" \
            -F "media=@/tmp/ci-upload.jpg;type=image/jpeg" >/tmp/qr-incident.json
          QR_INCIDENT_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/qr-incident.json","utf8")).incident_id')
          curl -fsS "$BASE/api/incidents" >/tmp/incidents-after.json
          curl -fsS "$BASE/api/reports/kpi?from_date=$TODAY&to_date=$TODAY&department_code=ALL&response_target_minutes=30" >/tmp/kpi.json
          curl -fsS "$BASE/api/reports/kpi?from_date=$TODAY&to_date=$TODAY&department_code=TST&response_target_minutes=30" >/tmp/kpi-tst.json
          curl -fsS "$BASE/api/reports/kpi?from_date=$TODAY&to_date=$TODAY&department_code=TST2&response_target_minutes=30" >/tmp/kpi-tst2.json
          node - <<'NODE'
          const fs=require("fs");
          const before=JSON.parse(fs.readFileSync("/tmp/qr-before.json","utf8"));
          const after=JSON.parse(fs.readFileSync("/tmp/qr-after.json","utf8"));
          const incidentId=Number(JSON.parse(fs.readFileSync("/tmp/incident-create.json","utf8")).id);
          const qrIncidentId=Number(JSON.parse(fs.readFileSync("/tmp/qr-incident.json","utf8")).incident_id);
          const incidents=JSON.parse(fs.readFileSync("/tmp/incidents-after.json","utf8"));
          const row=incidents.find(x=>Number(x.id)===incidentId);
          const qrRow=incidents.find(x=>Number(x.id)===qrIncidentId);
          const kpi=JSON.parse(fs.readFileSync("/tmp/kpi.json","utf8"));
          const kpiTst=JSON.parse(fs.readFileSync("/tmp/kpi-tst.json","utf8"));
          const kpiTst2=JSON.parse(fs.readFileSync("/tmp/kpi-tst2.json","utf8"));
          if (!row) throw new Error("Incident not found after lifecycle");
          if (!qrRow) throw new Error("QR incident not found");
          if (!row.acknowledged_at) throw new Error("acknowledged_at missing");
          if (row.acknowledged_by!=="Khoa Trang bị - CI") throw new Error("acknowledged_by incorrect: "+row.acknowledged_by);
          if (row.source_channel!=="Nhập trực tiếp") throw new Error("Manual incident source incorrect");
          if (qrRow.source_channel!=="QR") throw new Error("QR incident source incorrect");
          if (Number(qrRow.media_count||0)<1 || !Array.isArray(qrRow.files) || !qrRow.files[0]?.file_path) throw new Error("Multipart incident media upload missing");
          if (row.location_snapshot!=="Vị trí A") throw new Error("Historical location snapshot changed: "+row.location_snapshot);
          if (row.department_code_snapshot!=="TST") throw new Error("Historical department snapshot changed: "+row.department_code_snapshot);
          if (row.location!=="Vị trí A") throw new Error("Incident location history failed");
          if (row.department_code!=="TST") throw new Error("Incident department history failed");
          if (row.current_location!=="Vị trí chuyển") throw new Error("Current location context missing");
          if (row.current_department_code!=="TST2") throw new Error("Current department context missing");
          if (!row.linked_repair_completed_at) throw new Error("repair completion timestamp missing");
          if (String(before.qr_uid)!==String(after.qr_uid)) throw new Error("QR UID changed after device edit");
          if (String(after.serial)!=="SERIAL-AFTER") throw new Error("QR did not resolve current device data");
          if (Number(kpi.summary.total_incidents)!==2) throw new Error("KPI total incident count incorrect");
          if (Number(kpi.summary.qr_incidents)!==1 || Number(kpi.summary.direct_incidents)!==1) throw new Error("KPI source counts incorrect");
          const qrSource=(kpi.by_source||[]).find(x=>x.source==="QR");
          const directSource=(kpi.by_source||[]).find(x=>x.source==="Nhập trực tiếp");
          if(!qrSource || !directSource) throw new Error("KPI source comparison missing");
          if(Number(qrSource.count)!==1 || Number(directSource.count)!==1) throw new Error("KPI source comparison count failed");
          if(Number(qrSource.responded_incidents)!==0 || Number(directSource.responded_incidents)!==1) throw new Error("KPI source response denominator failed");
          if (Number(kpi.summary.qr_checks)!==1 || Number(kpi.summary.qr_check_unique_devices)!==1) throw new Error("QR check adoption metrics incorrect");
          if (Number(kpi.summary.qr_check_normal_count)!==1 || Number(kpi.summary.qr_check_issue_count)!==0) throw new Error("QR check result metrics incorrect");
          if (!Array.isArray(kpi.by_day) || kpi.by_day.length!==1) throw new Error("Daily KPI trend missing");
          if (Number(kpi.by_day[0].qr_checks)!==1 || Number(kpi.by_day[0].qr_unique_devices)!==1) throw new Error("Daily QR check metrics incorrect");
          if (Number(kpi.by_day[0].incidents)!==2 || Number(kpi.by_day[0].qr_incidents)!==1) throw new Error("Daily incident metrics incorrect");
          if (Number(kpi.summary.unknown_source_incidents)!==0) throw new Error("Unexpected unknown incident source");
          if (!Array.isArray(kpi.records) || kpi.records.length!==2) throw new Error("KPI detail records missing");
          if (Number(kpiTst.summary.total_incidents)!==1 || Number(kpiTst.summary.direct_incidents)!==1) throw new Error("Historical KPI department filter failed for TST");
          const historicalKpiRow=(kpiTst.records||[])[0];
          if(!historicalKpiRow || historicalKpiRow.department_code!=="TST" || historicalKpiRow.department_name!=="Khoa kiểm thử") throw new Error("Historical KPI department code/name snapshot mismatch: "+JSON.stringify(historicalKpiRow));
          if (Number(kpiTst.summary.qr_checks)!==1) throw new Error("Historical QR check department snapshot failed for TST");
          if (Number(kpiTst2.summary.total_incidents)!==1 || Number(kpiTst2.summary.qr_incidents)!==1) throw new Error("KPI department filter failed for TST2");
          const currentKpiRow=(kpiTst2.records||[])[0];
          if(!currentKpiRow || currentKpiRow.department_code!=="TST2" || currentKpiRow.department_name!=="Khoa kiểm thử 2") throw new Error("Current KPI department code/name mismatch: "+JSON.stringify(currentKpiRow));
          if (Number(kpiTst2.summary.qr_checks)!==0) throw new Error("QR check incorrectly moved to new department");
          console.log("QR/source/receiver/snapshot/KPI lifecycle passed");
          NODE

          QR_MEDIA_PATH=$(node -p 'const fs=require("fs");const id=Number(JSON.parse(fs.readFileSync("/tmp/qr-incident.json","utf8")).incident_id);const rows=JSON.parse(fs.readFileSync("/tmp/incidents-after.json","utf8"));const r=rows.find(x=>Number(x.id)===id);r?.files?.[0]?.file_path||""')
          test -n "$QR_MEDIA_PATH"
          test -f ".$QR_MEDIA_PATH"
          CODE=$(curl -s -o /tmp/qr-incident-delete.json -w '%{http_code}' -X DELETE "$BASE/api/incidents/$QR_INCIDENT_ID")
          if [ "$CODE" != "200" ]; then echo "qr-incident-delete HTTP=$CODE"; cat /tmp/qr-incident-delete.json; exit 1; fi
          test ! -f ".$QR_MEDIA_PATH"
          CODE=$(curl -s -o /tmp/device-after-qr-incident-delete.json -w '%{http_code}' "$BASE/api/devices/$DEVICE_ID")
          if [ "$CODE" != "200" ]; then echo "device-after-qr-delete HTTP=$CODE"; cat /tmp/device-after-qr-incident-delete.json; exit 1; fi
          node -e 'const fs=require("fs");const p=process.argv[1];const d=JSON.parse(fs.readFileSync("/tmp/device-after-qr-incident-delete.json","utf8"));if((d.documents||[]).some(x=>String(x.file_path||"")===p))throw new Error("Deleted QR incident left a ghost document")' "$QR_MEDIA_PATH"

          CODE=$(curl -s -o /tmp/trace-device.json -w '%{http_code}' -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị truy vết QR","manufacturer":"Test","model":"TRACE-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"TRACE-QR-001","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí truy vết","note":"","insurance_code":"","actor":"CI"}')
          if [ "$CODE" != "200" ]; then echo "trace-device HTTP=$CODE"; cat /tmp/trace-device.json; exit 1; fi
          TRACE_DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/trace-device.json","utf8")).id')
          TRACE_QR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/trace-device.json","utf8")).qr_uid')
          printf '\xFF\xD8\xFF\xD9' >/tmp/trace-check-media.jpg
          CODE=$(curl -s -o /tmp/trace-check.json -w '%{http_code}' -X POST "$BASE/api/qr/checks" \
            -F "qr_uid=$TRACE_QR" \
            -F "inspector=QR Trace CI" \
            -F "condition=Có vấn đề" \
            -F "description=Lỗi truy vết QR CI" \
            -F "severity=Thấp" \
            -F "create_incident=1" \
            -F "media=@/tmp/trace-check-media.jpg;type=image/jpeg")
          if [ "$CODE" != "200" ]; then cat /tmp/trace-check.json; exit 1; fi
          TRACE_CHECK_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/trace-check.json","utf8")).check_id')
          TRACE_INCIDENT_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/trace-check.json","utf8")).incident_id')
          test -n "$TRACE_CHECK_ID"
          test -n "$TRACE_INCIDENT_ID"
          CODE=$(curl -s -o /tmp/trace-checks.json -w '%{http_code}' "$BASE/api/checks?from_date=2000-01-01&to_date=2100-12-31")
          if [ "$CODE" != "200" ]; then echo "trace-checks HTTP=$CODE"; cat /tmp/trace-checks.json; exit 1; fi
          node -e 'const fs=require("fs");const checkId=Number(process.argv[1]);const incidentId=Number(process.argv[2]);const rows=JSON.parse(fs.readFileSync("/tmp/trace-checks.json","utf8"));const r=rows.find(x=>Number(x.id)===checkId);if(!r)throw new Error("QR trace check missing");if(Number(r.incident_id)!==incidentId)throw new Error("QR check to incident link failed")' "$TRACE_CHECK_ID" "$TRACE_INCIDENT_ID"
          CODE=$(curl -s -o /tmp/trace-device-detail.json -w '%{http_code}' "$BASE/api/devices/$TRACE_DEVICE_ID")
          if [ "$CODE" != "200" ]; then echo "trace-device-detail HTTP=$CODE"; cat /tmp/trace-device-detail.json; exit 1; fi
          TRACE_MEDIA_PATH=$(node -p 'const d=JSON.parse(require("fs").readFileSync("/tmp/trace-device-detail.json","utf8"));const r=(d.documents||[]).find(x=>x.type==="Kiểm tra"&&String(x.updated_by||"")==="QR Trace CI");r?.file_path||""')
          test -n "$TRACE_MEDIA_PATH"
          test -f ".$TRACE_MEDIA_PATH"
          CODE=$(curl -s -o /tmp/trace-incident-delete.json -w '%{http_code}' -X DELETE "$BASE/api/incidents/$TRACE_INCIDENT_ID")
          if [ "$CODE" != "200" ]; then cat /tmp/trace-incident-delete.json; exit 1; fi
          test -f ".$TRACE_MEDIA_PATH"
          CODE=$(curl -s -o /tmp/trace-checks-after-delete.json -w '%{http_code}' "$BASE/api/checks?from_date=2000-01-01&to_date=2100-12-31")
          if [ "$CODE" != "200" ]; then echo "trace-checks-after-delete HTTP=$CODE"; cat /tmp/trace-checks-after-delete.json; exit 1; fi
          node -e 'const fs=require("fs");const id=Number(process.argv[1]);const rows=JSON.parse(fs.readFileSync("/tmp/trace-checks-after-delete.json","utf8"));const r=rows.find(x=>Number(x.id)===id);if(!r)throw new Error("QR check disappeared after incident deletion");if(r.incident_id!==null&&String(r.incident_id||"")!=="")throw new Error("Deleted incident left dangling check link")' "$TRACE_CHECK_ID"

      - name: Smoke test catalog code lock integrity
        run: |
          BASE=http://127.0.0.1:5000
          curl -fsS -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"REN1","name":"Khoa đổi mã"}' >/tmp/ren-dept.json
          curl -fsS -X POST "$BASE/api/device-groups" -H 'Content-Type: application/json' --data '{"code":"RG1","name":"Nhóm đổi mã"}' >/tmp/ren-group.json
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"REN1","group_code":"RG1","name":"Thiết bị khóa danh mục","serial":"REN-CI-001","status":"Đang hoạt động","location":"Phòng CI"}' >/tmp/ren-device.json
          REN_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/ren-device.json","utf8")).id')
          CODE=$(curl -s -o /tmp/ren-dept-reject.json -w '%{http_code}' -X PUT "$BASE/api/departments/REN1" -H 'Content-Type: application/json' --data '{"code":"REN2","name":"Khoa đổi mã mới"}')
          test "$CODE" = "409"
          CODE=$(curl -s -o /tmp/ren-group-reject.json -w '%{http_code}' -X PUT "$BASE/api/device-groups/RG1" -H 'Content-Type: application/json' --data '{"code":"RG2","name":"Nhóm đổi mã mới"}')
          test "$CODE" = "409"
          curl -fsS -X PUT "$BASE/api/departments/REN1" -H 'Content-Type: application/json' --data '{"code":"REN1","name":"Khoa đổi tên"}' >/tmp/ren-dept-name.json
          curl -fsS -X PUT "$BASE/api/device-groups/RG1" -H 'Content-Type: application/json' --data '{"code":"RG1","name":"Nhóm đổi tên"}' >/tmp/ren-group-name.json
          curl -fsS "$BASE/api/devices/$REN_DEVICE" >/tmp/ren-device-after.json
          node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/ren-device-after.json","utf8"));
          const original=JSON.parse(fs.readFileSync("/tmp/ren-device.json","utf8"));
          if(d.department_code!=="REN1" || d.group_code!=="RG1") throw new Error("Referenced catalog codes changed unexpectedly");
          if(d.department_name!=="Khoa đổi tên" || d.group_name!=="Nhóm đổi tên") throw new Error("Catalog names did not update");
          if(String(d.qr_uid)!==String(original.qr_uid)) throw new Error("Catalog name update changed QR UID");
          console.log("Catalog code lock integrity passed");
          NODE

      - name: Smoke test attachment file integrity
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          ATT_DAY=$(node -e 'const p=process.argv[1].split("-").map(Number);const d=new Date(Date.UTC(p[0],p[1]-1,p[2]-1,12));process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị file CI","manufacturer":"Test","model":"FILE-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"FILE-CI-001","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí file CI","note":"","insurance_code":"","actor":"CI"}' >/tmp/attachment-device.json
          ATT_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/attachment-device.json","utf8")).id')
          ATT_QR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/attachment-device.json","utf8")).qr_uid')
          CODE=$(curl -s -o /tmp/maintenance-missing-performer.json -w '%{http_code}' -X POST "$BASE/api/maintenances" \
            -F "device_id=$ATT_DEVICE" -F "maintenance_date=$ATT_DAY 13:30" -F "type=Bảo dưỡng định kỳ" \
            -F "content=Thiếu người thực hiện" -F "result=Đạt")
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/maintenance-invalid-result.json -w '%{http_code}' -X POST "$BASE/api/maintenances" \
            -F "device_id=$ATT_DEVICE" -F "maintenance_date=$ATT_DAY 13:40" -F "type=Bảo dưỡng định kỳ" \
            -F "content=Kết quả sai" -F "result=OK" -F "performer=CI")
          test "$CODE" = "400"
          printf '%s\n' '%PDF-1.4' '%%EOF' >/tmp/attachment-a.pdf
          printf '%s\n' '%PDF-1.4' 'replacement' '%%EOF' >/tmp/attachment-b.pdf
          printf '<html>CI rejected upload</html>' >/tmp/rejected-upload.html
          printf 'CI rejected QR media' >/tmp/rejected-qr-media.txt

          BEFORE_DOC_REJECT=$(find uploads/documents -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          CODE=$(curl -s -o /tmp/rejected-document-type.json -w '%{http_code}' -X POST "$BASE/api/documents" \
            -F "device_id=$ATT_DEVICE" -F "name=File không hợp lệ" -F "type=Khác" \
            -F "file=@/tmp/rejected-upload.html;type=text/html")
          test "$CODE" = "400"
          AFTER_DOC_REJECT=$(find uploads/documents -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$BEFORE_DOC_REJECT" = "$AFTER_DOC_REJECT"

          QR_UID="$ATT_QR"
          BEFORE_QR_REJECT=$(find uploads/qr -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          CODE=$(curl -s -o /tmp/rejected-qr-media-type.json -w '%{http_code}' -X POST "$BASE/api/qr/checks" \
            -F "qr_uid=$QR_UID" -F "inspector=CI" -F "condition=Bình thường" \
            -F "media=@/tmp/rejected-qr-media.txt;type=text/plain")
          test "$CODE" = "400"
          AFTER_QR_REJECT=$(find uploads/qr -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$BEFORE_QR_REJECT" = "$AFTER_QR_REJECT"

          BEFORE=$(find uploads/documents -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          CODE=$(curl -s -o /tmp/rejected-maintenance.json -w '%{http_code}' -X POST "$BASE/api/maintenances" \
            -F "device_id=999999" -F "maintenance_date=$ATT_DAY 14:00" -F "content=Không hợp lệ" \
            -F "file=@/tmp/attachment-a.pdf;type=application/pdf")
          test "$CODE" = "400"
          AFTER=$(find uploads/documents -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$BEFORE" = "$AFTER"

          curl -fsS -X POST "$BASE/api/documents" \
            -F "device_id=$ATT_DEVICE" -F "name=Tài liệu chung kiểm thử" -F "type=Khác" -F "doc_date=$ATT_DAY" \
            -F "file=@/tmp/attachment-a.pdf;type=application/pdf" >/tmp/document-create.json
          DOC_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/document-create.json","utf8")).id')
          OLD_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/document-create.json","utf8")).file_path')
          test -f ".$OLD_PATH"
          curl -fsS "$BASE/api/devices/$ATT_DEVICE" >/tmp/device-document-snapshot.json
          node - <<'NODE'
          const fs=require("fs");
          const id=Number(JSON.parse(fs.readFileSync("/tmp/document-create.json","utf8")).id);
          const d=JSON.parse(fs.readFileSync("/tmp/device-document-snapshot.json","utf8"));
          const row=(d.documents||[]).find(x=>Number(x.id)===id);
          if(!row) throw new Error("Document snapshot record missing");
          if(row.department_code_snapshot!=="TST2") throw new Error("Document department snapshot missing");
          if(row.location_snapshot!=="Vị trí file CI") throw new Error("Document location snapshot missing: "+row.location_snapshot);
          NODE

          curl -fsS -X PUT "$BASE/api/documents/$DOC_ID" \
            -F "name=Tài liệu chung cập nhật" -F "type=Khác" -F "doc_date=$ATT_DAY" \
            -F "file=@/tmp/attachment-b.pdf;type=application/pdf" >/tmp/document-update.json
          NEW_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/document-update.json","utf8")).file_path')
          test ! -f ".$OLD_PATH"
          test -f ".$NEW_PATH"
          curl -fsS -X DELETE "$BASE/api/documents/$DOC_ID" >/tmp/document-delete.json
          test ! -f ".$NEW_PATH"

          curl -fsS -X POST "$BASE/api/documents" \
            -F "device_id=$ATT_DEVICE" -F "name=Chứng nhận rollback chưa liên kết" -F "type=Kiểm định" -F "doc_date=$ATT_DAY" \
            -F "file=@/tmp/attachment-a.pdf;type=application/pdf" >/tmp/inspection-orphan-doc.json
          ORPHAN_DOC_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/inspection-orphan-doc.json","utf8")).id')
          ORPHAN_DOC_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/inspection-orphan-doc.json","utf8")).file_path')
          test -f ".$ORPHAN_DOC_PATH"
          curl -fsS -X DELETE "$BASE/api/documents/$ORPHAN_DOC_ID" >/tmp/inspection-orphan-delete.json
          test ! -f ".$ORPHAN_DOC_PATH"

          curl -fsS -X POST "$BASE/api/documents" \
            -F "device_id=$ATT_DEVICE" -F "name=Chứng nhận đã liên kết" -F "type=Kiểm định" -F "doc_date=$ATT_DAY" \
            -F "file=@/tmp/attachment-a.pdf;type=application/pdf" >/tmp/inspection-linked-doc.json
          LINKED_DOC_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/inspection-linked-doc.json","utf8")).id')
          LINKED_DOC_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/inspection-linked-doc.json","utf8")).file_path')
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' \
            --data "{\"device_id\":$ATT_DEVICE,\"inspection_date\":\"$ATT_DAY 14:30\",\"type\":\"Kiểm định\",\"organization\":\"CI\",\"certificate_no\":\"LINKED-CERT\",\"result\":\"Đạt\",\"next_date\":\"\",\"file_note\":\"$LINKED_DOC_PATH\",\"note\":\"Kiểm thử khóa file liên kết\"}" >/tmp/inspection-linked-record.json
          CODE=$(curl -s -o /tmp/inspection-linked-doc-delete.json -w '%{http_code}' -X DELETE "$BASE/api/documents/$LINKED_DOC_ID")
          test "$CODE" = "409"
          test -f ".$LINKED_DOC_PATH"

          curl -fsS -X POST "$BASE/api/maintenances" \
            -F "device_id=$ATT_DEVICE" -F "maintenance_date=$ATT_DAY 15:00" -F "type=Bảo dưỡng định kỳ" \
            -F "content=Kiểm tra file lịch sử" -F "result=Đạt" -F "performer=CI" \
            -F "file=@/tmp/attachment-a.pdf;type=application/pdf" >/tmp/maintenance-file-create.json
          MAINT_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/maintenance-file-create.json","utf8")).id')
          MAINT_OLD_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/maintenance-file-create.json","utf8")).file_path')
          test -f ".$MAINT_OLD_PATH"
          curl -fsS -X PUT "$BASE/api/maintenances/$MAINT_ID" \
            -F "device_id=$ATT_DEVICE" -F "maintenance_date=$ATT_DAY 15:30" -F "type=Bảo dưỡng định kỳ" \
            -F "content=Thay file nhưng giữ lịch sử" -F "result=Đạt" -F "performer=CI" \
            -F "file=@/tmp/attachment-b.pdf;type=application/pdf" >/tmp/maintenance-file-update.json
          MAINT_NEW_PATH=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/maintenance-file-update.json","utf8")).file_path')
          test -f ".$MAINT_OLD_PATH"
          test -f ".$MAINT_NEW_PATH"
          curl -fsS "$BASE/api/devices/$ATT_DEVICE" >/tmp/device-maint-snapshot.json
          node - <<'NODE'
          const fs=require("fs");
          const p=String(JSON.parse(fs.readFileSync("/tmp/maintenance-file-update.json","utf8")).file_path||"");
          const d=JSON.parse(fs.readFileSync("/tmp/device-maint-snapshot.json","utf8"));
          const row=(d.documents||[]).find(x=>String(x.file_path||"")===p);
          if(!row) throw new Error("Maintenance document snapshot missing");
          if(row.department_code_snapshot!=="TST2" || row.location_snapshot!=="Vị trí file CI") throw new Error("Maintenance document historical context failed: "+JSON.stringify({department_code_snapshot:row.department_code_snapshot,location_snapshot:row.location_snapshot}));
          NODE
          CODE=$(curl -s -o /tmp/maintenance-evidence-delete.json -w '%{http_code}' -X DELETE "$BASE/api/maintenances/$MAINT_ID")
          test "$CODE" = "409"
          curl -fsS "$BASE/api/devices/$ATT_DEVICE" >/tmp/device-with-maint-doc.json
          MAINT_DOC_ID=$(node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/device-with-maint-doc.json","utf8"));
          const p=String(JSON.parse(fs.readFileSync("/tmp/maintenance-file-update.json","utf8")).file_path||"");
          const row=(d.documents||[]).find(x=>String(x.file_path||"")===p);
          if(!row) throw new Error("Maintenance document mirror missing");
          process.stdout.write(String(row.id));
          NODE
          )
          CODE=$(curl -s -o /tmp/maintenance-doc-delete-reject.json -w '%{http_code}' -X DELETE "$BASE/api/documents/$MAINT_DOC_ID")
          test "$CODE" = "409"
          test -f ".$MAINT_NEW_PATH"

          CODE=$(curl -s -o /tmp/inspection-missing-org.json -w '%{http_code}' -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data "{\"device_id\":$ATT_DEVICE,\"inspection_date\":\"$ATT_DAY 15:40\",\"type\":\"Kiểm định\",\"organization\":\"\",\"result\":\"Đạt\"}")
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/inspection-invalid-next.json -w '%{http_code}' -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data "{\"device_id\":$ATT_DEVICE,\"inspection_date\":\"$ATT_DAY 15:50\",\"type\":\"Kiểm định\",\"organization\":\"CI\",\"result\":\"Đạt\",\"next_date\":\"24/09/2027\"}")
          test "$CODE" = "400"
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data "{\"device_id\":$ATT_DEVICE,\"inspection_date\":\"$ATT_DAY 16:00\",\"type\":\"Kiểm định\",\"organization\":\"CI\",\"certificate_no\":\"CERT-CI\",\"result\":\"Đạt\",\"next_date\":\"\",\"file_note\":\"$MAINT_NEW_PATH\",\"note\":\"Kiểm tra bảo toàn chứng nhận\"}" >/tmp/inspection-evidence.json
          INSPECTION_EVIDENCE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/inspection-evidence.json","utf8")).id')
          CODE=$(curl -s -o /tmp/inspection-evidence-delete.json -w '%{http_code}' -X DELETE "$BASE/api/inspections/$INSPECTION_EVIDENCE_ID")
          test "$CODE" = "409"
          curl -fsS "$BASE/api/devices/$ATT_DEVICE" >/tmp/protected-history-after.json
          node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/protected-history-after.json","utf8"));
          const maint=Number(JSON.parse(fs.readFileSync("/tmp/maintenance-file-create.json","utf8")).id);
          const insp=Number(JSON.parse(fs.readFileSync("/tmp/inspection-evidence.json","utf8")).id);
          if(!(d.maintenances||[]).some(x=>Number(x.id)===maint)) throw new Error("Protected maintenance record disappeared");
          if(!(d.inspections||[]).some(x=>Number(x.id)===insp)) throw new Error("Protected inspection record disappeared");
          NODE
          echo "Attachment and protected technical-history integrity passed"

      - name: Smoke test quality and usage validation
        run: |
          BASE=http://127.0.0.1:5000
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).id')
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')

          CODE=$(curl -s -o /tmp/quality-invalid.json -w '%{http_code}' -X POST "$BASE/api/quality-ratings" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"rating_date\":\"$TODAY\",\"evaluator\":\"CI\",\"age_score\":26,\"performance_score\":25,\"repair_score\":20,\"inspection_score\":15,\"sparepart_score\":15}")
          test "$CODE" = "400"

          curl -fsS -X POST "$BASE/api/quality-ratings" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"rating_date\":\"$TODAY\",\"evaluator\":\"CI\",\"age_score\":25,\"performance_score\":25,\"repair_score\":20,\"inspection_score\":15,\"sparepart_score\":15,\"recommendation\":\"Tiếp tục khai thác\"}" >/tmp/quality-1.json
          QID1=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/quality-1.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/quality-ratings" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"rating_date\":\"$TODAY\",\"evaluator\":\"CI\",\"age_score\":20,\"performance_score\":20,\"repair_score\":15,\"inspection_score\":10,\"sparepart_score\":10,\"recommendation\":\"Theo dõi\"}" >/tmp/quality-2.json
          QID2=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/quality-2.json","utf8")).id')
          test "$QID1" != "$QID2"
          CODE=$(curl -s -o /tmp/quality-delete-reject.json -w '%{http_code}' -X DELETE "$BASE/api/quality-ratings/$QID1")
          test "$CODE" = "409"

          curl -fsS -X POST "$BASE/api/operation-logs" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"log_datetime\":\"$TODAY 09:00\",\"user_name\":\"CI vận hành\",\"department_code\":\"TST\",\"usage_count\":\"1\",\"status_before\":\"Đang hoạt động\",\"status_after\":\"Đang hoạt động\",\"note\":\"Kiểm thử bảo toàn lịch sử\"}" >/tmp/operation-log.json
          OPLOG_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/operation-log.json","utf8")).id')
          CODE=$(curl -s -o /tmp/operation-log-delete-reject.json -w '%{http_code}' -X DELETE "$BASE/api/operation-logs/$OPLOG_ID")
          test "$CODE" = "409"

          CODE=$(curl -s -o /tmp/usage-invalid-month.json -w '%{http_code}' -X POST "$BASE/api/usage-reports" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"year\":2026,\"month\":13,\"indicator\":\"Số ca\",\"value\":10,\"unit\":\"ca\"}")
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/usage-invalid-value.json -w '%{http_code}' -X POST "$BASE/api/usage-reports" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"year\":2026,\"month\":9,\"indicator\":\"Số ca\",\"value\":-1,\"unit\":\"ca\"}")
          test "$CODE" = "400"
          curl -fsS -X POST "$BASE/api/usage-reports" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"year\":2026,\"month\":9,\"indicator\":\"Số ca\",\"value\":12,\"unit\":\"ca\"}" >/tmp/usage-valid.json

          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST","name":"Thiết bị lưu trữ hiệu chỉnh lịch sử","manufacturer":"CI","model":"ARCH-HIST-01","serial":"ARCH-HIST-001","status":"Đang hoạt động","location":"Phòng lịch sử"}' >/tmp/archive-history-device.json
          ARCH_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/archive-history-device.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data "{\"device_id\":$ARCH_DEVICE,\"inspection_date\":\"$TODAY 10:00\",\"type\":\"Kiểm định\",\"organization\":\"CI\",\"certificate_no\":\"ARCH-CERT-OLD\",\"result\":\"Đạt\",\"next_date\":\"\"}" >/tmp/archive-history-inspection.json
          ARCH_INSPECTION=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/archive-history-inspection.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/quality-ratings" -H 'Content-Type: application/json' --data "{\"device_id\":$ARCH_DEVICE,\"rating_date\":\"$TODAY\",\"evaluator\":\"CI trước lưu trữ\",\"age_score\":20,\"performance_score\":20,\"repair_score\":15,\"inspection_score\":10,\"sparepart_score\":10,\"recommendation\":\"Theo dõi\"}" >/tmp/archive-history-quality.json
          ARCH_QUALITY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/archive-history-quality.json","utf8")).id')
          curl -fsS -X DELETE "$BASE/api/devices/$ARCH_DEVICE" >/tmp/archive-history-device-archive.json

          CODE=$(curl -s -o /tmp/archive-new-inspection-reject.json -w '%{http_code}' -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data "{\"device_id\":$ARCH_DEVICE,\"inspection_date\":\"$TODAY 11:00\",\"type\":\"Kiểm định\",\"organization\":\"CI\",\"result\":\"Đạt\"}")
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/archive-new-quality-reject.json -w '%{http_code}' -X POST "$BASE/api/quality-ratings" -H 'Content-Type: application/json' --data "{\"device_id\":$ARCH_DEVICE,\"rating_date\":\"$TODAY\",\"evaluator\":\"CI\",\"age_score\":20,\"performance_score\":20,\"repair_score\":15,\"inspection_score\":10,\"sparepart_score\":10}")
          test "$CODE" = "400"

          curl -fsS -X PUT "$BASE/api/inspections/$ARCH_INSPECTION" -H 'Content-Type: application/json' --data "{\"device_id\":$ARCH_DEVICE,\"inspection_date\":\"$TODAY 10:00\",\"type\":\"Kiểm định\",\"organization\":\"CI hiệu chỉnh\",\"certificate_no\":\"ARCH-CERT-FIX\",\"result\":\"Đạt\",\"next_date\":\"\",\"note\":\"Hiệu chỉnh sau lưu trữ\"}" >/tmp/archive-history-inspection-update.json
          curl -fsS -X PUT "$BASE/api/quality-ratings/$ARCH_QUALITY" -H 'Content-Type: application/json' --data "{\"device_id\":$ARCH_DEVICE,\"rating_date\":\"$TODAY\",\"evaluator\":\"CI hiệu chỉnh\",\"age_score\":20,\"performance_score\":20,\"repair_score\":15,\"inspection_score\":10,\"sparepart_score\":10,\"recommendation\":\"Hiệu chỉnh hồ sơ đã lưu trữ\"}" >/tmp/archive-history-quality-update.json
          curl -fsS "$BASE/api/inspections" >/tmp/archive-history-inspections-after.json
          curl -fsS "$BASE/api/quality-ratings" >/tmp/archive-history-quality-after.json
          node - "$ARCH_INSPECTION" "$ARCH_QUALITY" <<'NODE'
          const fs=require("fs");
          const inspectionId=Number(process.argv[2]);
          const qualityId=Number(process.argv[3]);
          const inspection=JSON.parse(fs.readFileSync("/tmp/archive-history-inspections-after.json","utf8")).find(x=>Number(x.id)===inspectionId);
          const quality=JSON.parse(fs.readFileSync("/tmp/archive-history-quality-after.json","utf8")).find(x=>Number(x.id)===qualityId);
          if(!inspection || inspection.organization!=="CI hiệu chỉnh" || inspection.certificate_no!=="ARCH-CERT-FIX") throw new Error("Archived inspection correction was not preserved");
          if(!quality || quality.evaluator!=="CI hiệu chỉnh" || quality.recommendation!=="Hiệu chỉnh hồ sơ đã lưu trữ") throw new Error("Archived quality correction was not preserved");
          console.log("Archived history correction policy passed");
          NODE

          echo "Quality, usage and immutable technical-history validation passed"

      - name: Smoke test frozen technical context after transfer
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          HISTORY_DAY=$(node -e 'const p=process.argv[1].split("-").map(Number);const d=new Date(Date.UTC(p[0],p[1]-1,p[2]-1,12));process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")

          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST","name":"Thiết bị snapshot kỹ thuật","manufacturer":"Test","model":"CTX-01","year_in_use":2026,"status":"Đang hoạt động","serial":"CTX-001","country":"Việt Nam","year_manufactured":2026,"cost":0,"location":"Vị trí lịch sử A","actor":"CI"}' >/tmp/context-device.json
          CTX_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/context-device.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị khác để thử khóa","manufacturer":"Test","model":"CTX-02","year_in_use":2026,"status":"Đang hoạt động","serial":"CTX-002","country":"Việt Nam","year_manufactured":2026,"cost":0,"location":"Vị trí khác","actor":"CI"}' >/tmp/context-other-device.json
          CTX_OTHER=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/context-other-device.json","utf8")).id')

          REPAIR_JSON=$(node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.argv[1]),repair_date:process.argv[2]+" 08:00",issue:"Kiểm thử snapshot sửa chữa",work:"Hoàn tất",person:"CI",method:"Nội bộ",cost:7654321,result:"Đạt",processing_status:"Đã hoàn thành",status_after:"Đang hoạt động"}))' "$CTX_DEVICE" "$HISTORY_DAY")
          curl -fsS -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data "$REPAIR_JSON" >/tmp/context-repair.json
          CTX_REPAIR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/context-repair.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/maintenances" -F "device_id=$CTX_DEVICE" -F "maintenance_date=$HISTORY_DAY 09:00" -F "type=Bảo dưỡng định kỳ" -F "content=Snapshot bảo dưỡng" -F "result=Đạt" -F "performer=CI" >/tmp/context-maint.json
          CTX_MAINT=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/context-maint.json","utf8")).id')
          INSPECTION_JSON=$(node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.argv[1]),inspection_date:process.argv[2]+" 10:00",type:"Kiểm định",organization:"CI",certificate_no:"CTX-CERT",result:"Đạt",next_date:"",file_note:"",note:"Snapshot kiểm định"}))' "$CTX_DEVICE" "$HISTORY_DAY")
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data "$INSPECTION_JSON" >/tmp/context-inspection.json
          CTX_INSP=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/context-inspection.json","utf8")).id')
          OPERATION_JSON=$(node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.argv[1]),log_datetime:process.argv[2]+" 11:00",user_name:"CI",department_code:"TST",usage_count:"1",status_before:"Đang hoạt động",status_after:"Đang hoạt động",note:"Snapshot vận hành"}))' "$CTX_DEVICE" "$HISTORY_DAY")
          curl -fsS -X POST "$BASE/api/operation-logs" -H 'Content-Type: application/json' --data "$OPERATION_JSON" >/tmp/context-operation.json
          CTX_OP=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/context-operation.json","utf8")).id')

          curl -fsS "$BASE/api/reports/summary" >/tmp/context-summary-before.json
          BACKDATED_TRANSFER_JSON=$(node -e 'process.stdout.write(JSON.stringify({transfer_datetime:process.argv[1]+" 10:30:00",to_department_code:"TST2",to_location:"Vị trí sai thời gian",reason:"Không được chèn trước hồ sơ kỹ thuật mới nhất",actor:"CI"}))' "$HISTORY_DAY")
          CODE=$(curl -s -o /tmp/context-backdated-transfer-reject.json -w '%{http_code}' -X POST "$BASE/api/devices/$CTX_DEVICE/transfer" -H 'Content-Type: application/json' --data "$BACKDATED_TRANSFER_JSON")
          test "$CODE" = "409"
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/context-backdated-transfer-reject.json","utf8")); if(!String(x.error||"").includes("hồ sơ kỹ thuật gần nhất")) throw new Error("Backdated transfer rejection did not explain chronology lock")'

          TRANSFER_JSON=$(node -e 'process.stdout.write(JSON.stringify({transfer_datetime:process.argv[1]+" 12:00:00",to_department_code:"TST2",to_location:"Vị trí hiện tại B",reason:"Kiểm thử đóng băng bối cảnh kỹ thuật",actor:"CI"}))' "$HISTORY_DAY")
          curl -fsS -X POST "$BASE/api/devices/$CTX_DEVICE/transfer" -H 'Content-Type: application/json' --data "$TRANSFER_JSON" >/tmp/context-transfer.json

          curl -fsS "$BASE/api/repairs" >/tmp/context-repairs-after.json
          curl -fsS "$BASE/api/maintenances" >/tmp/context-maints-after.json
          curl -fsS "$BASE/api/inspections" >/tmp/context-inspections-after.json
          curl -fsS "$BASE/api/devices/$CTX_DEVICE" >/tmp/context-device-after.json
          curl -fsS "$BASE/api/devices/$CTX_DEVICE/technical-history?from_date=$HISTORY_DAY&to_date=$HISTORY_DAY&type=ALL" >/tmp/context-technical-history.json
          curl -fsS "$BASE/api/reports/summary" >/tmp/context-summary-after.json

          node - "$CTX_DEVICE" "$CTX_REPAIR" "$CTX_MAINT" "$CTX_INSP" "$CTX_OP" <<'NODE'
          const fs=require("fs");
          const deviceId=Number(process.env.CTX_DEVICE_ENV || process.argv[2] || 0);
          const repairId=Number(process.argv[3]||0), maintId=Number(process.argv[4]||0), inspId=Number(process.argv[5]||0), opId=Number(process.argv[6]||0);
          const repair=JSON.parse(fs.readFileSync("/tmp/context-repairs-after.json","utf8")).find(x=>Number(x.id)===repairId);
          const maint=JSON.parse(fs.readFileSync("/tmp/context-maints-after.json","utf8")).find(x=>Number(x.id)===maintId);
          const insp=JSON.parse(fs.readFileSync("/tmp/context-inspections-after.json","utf8")).find(x=>Number(x.id)===inspId);
          const device=JSON.parse(fs.readFileSync("/tmp/context-device-after.json","utf8"));
          const op=(device.operation_logs||[]).find(x=>Number(x.id)===opId);
          for(const [name,row] of [["repair",repair],["maintenance",maint],["inspection",insp]]){
            if(!row) throw new Error(name+" row missing");
            if(row.department_code!=="TST" || row.location!=="Vị trí lịch sử A") throw new Error(name+" historical context moved: "+JSON.stringify({department_code:row.department_code,location:row.location}));
            if(row.department_code_snapshot!=="TST" || row.location_snapshot!=="Vị trí lịch sử A") throw new Error(name+" snapshot missing");
          }
          if(!op) throw new Error("operation log missing");
          if(op.department_code_snapshot!=="TST" || op.location_snapshot!=="Vị trí lịch sử A") throw new Error("operation-log snapshot moved");
          if(device.department_code!=="TST2" || device.location!=="Vị trí hiện tại B") throw new Error("current device context did not transfer");
          const technical=JSON.parse(fs.readFileSync("/tmp/context-technical-history.json","utf8"));
          for(const type of ["Sửa chữa","Bảo dưỡng","Kiểm định"]){
            const row=technical.find(x=>x.type===type);
            if(!row) throw new Error("technical timeline missing "+type);
            if(row.department_code!=="TST" || row.location!=="Vị trí lịch sử A") throw new Error("technical timeline context moved for "+type);
          }

          const before=JSON.parse(fs.readFileSync("/tmp/context-summary-before.json","utf8"));
          const after=JSON.parse(fs.readFileSync("/tmp/context-summary-after.json","utf8"));
          const cost=(obj,dept)=>Number((obj.costByDepartment||[]).find(x=>x.department_code===dept)?.total_cost||0);
          if(cost(before,"TST")!==cost(after,"TST")) throw new Error("repair cost moved away from historical department");
          if(cost(before,"TST2")!==cost(after,"TST2")) throw new Error("repair cost moved into current department after transfer");
          NODE

          CODE=$(curl -s -o /tmp/context-maint-move-reject.json -w '%{http_code}' -X PUT "$BASE/api/maintenances/$CTX_MAINT" -F "device_id=$CTX_OTHER" -F "maintenance_date=$HISTORY_DAY 09:00" -F "type=Bảo dưỡng định kỳ" -F "content=Không được đổi máy" -F "result=Đạt" -F "performer=CI")
          test "$CODE" = "409"
          INSPECTION_MOVE_JSON=$(node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.argv[1]),inspection_date:process.argv[2]+" 10:00",type:"Kiểm định",organization:"CI",certificate_no:"CTX-CERT",result:"Đạt",next_date:"",file_note:"",note:"Không được đổi máy"}))' "$CTX_OTHER" "$HISTORY_DAY")
          CODE=$(curl -s -o /tmp/context-inspection-move-reject.json -w '%{http_code}' -X PUT "$BASE/api/inspections/$CTX_INSP" -H 'Content-Type: application/json' --data "$INSPECTION_MOVE_JSON")
