name: QY4 syntax and smoke check
on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          for f in public/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Install dependencies
        run: npm ci
      - name: Start server
        run: |
          QY4_DEMO_SEED=0 node server.js > /tmp/qy4-server.log 2>&1 &
          echo $! > /tmp/qy4-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/api/devices >/tmp/devices.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qy4-server.log
          exit 1
      - name: Smoke test core APIs
        run: |
          BASE=http://127.0.0.1:5000
          curl -fsS "$BASE/api/dashboard/operations" >/tmp/dashboard.json
          curl -fsS "$BASE/api/inventory-sessions" >/tmp/inventory.json
          curl -fsS "$BASE/api/system/backups" >/tmp/backups.json
          curl -fsS "$BASE/api/devices/duplicate-check?serial=__TEST__" >/tmp/duplicate.json
          node -e 'for (const p of ["/tmp/devices.json","/tmp/dashboard.json","/tmp/inventory.json","/tmp/backups.json","/tmp/duplicate.json"]) JSON.parse(require("fs").readFileSync(p,"utf8")); console.log("Core API smoke test passed")'

      - name: Smoke test QR incident repair lifecycle
        run: |
          BASE=http://127.0.0.1:5000
          curl -fsS -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"TST","name":"Khoa kiểm thử"}' >/tmp/dept.json
          curl -fsS -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"TST2","name":"Khoa kiểm thử 2"}' >/tmp/dept2.json
          curl -fsS -X POST "$BASE/api/device-groups" -H 'Content-Type: application/json' --data '{"code":"TST","name":"Nhóm kiểm thử"}' >/tmp/group.json
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST","name":"Thiết bị kiểm thử QR","manufacturer":"Test","model":"TEST-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"SERIAL-BEFORE","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí A","note":"","device_code":"TST.TST.0001","insurance_code":"","actor":"CI"}' >/tmp/device-create.json
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).id')
          QR_UID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).qr_uid')
          test -n "$DEVICE_ID"
          test -n "$QR_UID"
          curl -fsS "$BASE/api/qr/device-uid/$QR_UID" >/tmp/qr-before.json
          NOW=$(date '+%Y-%m-%d %H:%M')
          curl -fsS -X POST "$BASE/api/incidents" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"incident_datetime\":\"$NOW\",\"description\":\"Sự cố kiểm thử CI\",\"severity\":\"Trung bình\",\"reporter\":\"CI\",\"status\":\"Mới ghi nhận\"}" >/tmp/incident-create.json
          INCIDENT_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/incident-create.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/incidents/$INCIDENT_ID/acknowledge" -H 'Content-Type: application/json' --data '{"actor":"Khoa Trang bị - CI"}' >/tmp/ack.json
          curl -fsS -X POST "$BASE/api/incidents/$INCIDENT_ID/transfer-repair" -H 'Content-Type: application/json' --data '{"actor":"Khoa Trang bị - CI"}' >/tmp/transfer.json
          REPAIR_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/transfer.json","utf8")).repair_id')
          curl -fsS -X PUT "$BASE/api/repairs/$REPAIR_ID" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$NOW\",\"issue\":\"Sự cố kiểm thử CI\",\"work\":\"Khắc phục hoàn tất\",\"person\":\"Khoa Trang bị - CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"Đạt\",\"processing_status\":\"Đã hoàn thành\"}" >/tmp/repair-complete.json
          curl -fsS -X POST "$BASE/api/devices/$DEVICE_ID/transfer" -H 'Content-Type: application/json' --data '{"to_department_code":"TST2","to_location":"Vị trí chuyển","reason":"Kiểm thử snapshot khoa","actor":"CI"}' >/tmp/device-transfer.json
          curl -fsS -X PUT "$BASE/api/devices/$DEVICE_ID" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị kiểm thử QR","manufacturer":"Test","model":"TEST-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"SERIAL-AFTER","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí B","note":"","device_code":"TST.TST.0001","insurance_code":"","actor":"CI"}' >/tmp/device-update.json
          curl -fsS "$BASE/api/qr/device-uid/$QR_UID" >/tmp/qr-after.json
          curl -fsS -X POST "$BASE/api/qr/incidents" -H 'Content-Type: application/json' --data "{\"qr_uid\":\"$QR_UID\",\"reporter\":\"QR CI\",\"description\":\"Sự cố báo qua QR CI\",\"severity\":\"Trung bình\"}" >/tmp/qr-incident.json
          QR_INCIDENT_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/qr-incident.json","utf8")).incident_id')
          TODAY=$(date '+%Y-%m-%d')
          curl -fsS "$BASE/api/incidents" >/tmp/incidents-after.json
          curl -fsS "$BASE/api/reports/kpi?from_date=$TODAY&to_date=$TODAY&department_code=ALL&response_target_minutes=30" >/tmp/kpi.json
          curl -fsS "$BASE/api/reports/kpi?from_date=$TODAY&to_date=$TODAY&department_code=TST&response_target_minutes=30" >/tmp/kpi-tst.json
          curl -fsS "$BASE/api/reports/kpi?from_date=$TODAY&to_date=$TODAY&department_code=TST2&response_target_minutes=30" >/tmp/kpi-tst2.json
          node - <<'NODE'
          const fs=require("fs");
          const before=JSON.parse(fs.readFileSync("/tmp/qr-before.json","utf8"));
          const after=JSON.parse(fs.readFileSync("/tmp/qr-after.json","utf8"));
          const incidentId=Number(JSON.parse(fs.readFileSync("/tmp/incident-create.json","utf8")).id);
          const qrIncidentId=Number(JSON.parse(fs.readFileSync("/tmp/qr-incident.json","utf8")).incident_id);
          const incidents=JSON.parse(fs.readFileSync("/tmp/incidents-after.json","utf8"));
          const row=incidents.find(x=>Number(x.id)===incidentId);
          const qrRow=incidents.find(x=>Number(x.id)===qrIncidentId);
          const kpi=JSON.parse(fs.readFileSync("/tmp/kpi.json","utf8"));
          const kpiTst=JSON.parse(fs.readFileSync("/tmp/kpi-tst.json","utf8"));
          const kpiTst2=JSON.parse(fs.readFileSync("/tmp/kpi-tst2.json","utf8"));
          if (!row) throw new Error("Incident not found after lifecycle");
          if (!qrRow) throw new Error("QR incident not found");
          if (!row.acknowledged_at) throw new Error("acknowledged_at missing");
          if (row.acknowledged_by!=="Khoa Trang bị - CI") throw new Error("acknowledged_by incorrect: "+row.acknowledged_by);
          if (row.source_channel!=="Nhập trực tiếp") throw new Error("Manual incident source incorrect");
          if (qrRow.source_channel!=="QR") throw new Error("QR incident source incorrect");
          if (row.location_snapshot!=="Vị trí A") throw new Error("Historical location snapshot changed: "+row.location_snapshot);
          if (row.department_code_snapshot!=="TST") throw new Error("Historical department snapshot changed: "+row.department_code_snapshot);
          if (!row.linked_repair_completed_at) throw new Error("repair completion timestamp missing");
          if (String(before.qr_uid)!==String(after.qr_uid)) throw new Error("QR UID changed after device edit");
          if (String(after.serial)!=="SERIAL-AFTER") throw new Error("QR did not resolve current device data");
          if (Number(kpi.summary.total_incidents)!==2) throw new Error("KPI total incident count incorrect");
          if (Number(kpi.summary.qr_incidents)!==1 || Number(kpi.summary.direct_incidents)!==1) throw new Error("KPI source counts incorrect");
          if (Number(kpi.summary.unknown_source_incidents)!==0) throw new Error("Unexpected unknown incident source");
          if (!Array.isArray(kpi.records) || kpi.records.length!==2) throw new Error("KPI detail records missing");
          if (Number(kpiTst.summary.total_incidents)!==1 || Number(kpiTst.summary.direct_incidents)!==1) throw new Error("Historical KPI department filter failed for TST");
          if (Number(kpiTst2.summary.total_incidents)!==1 || Number(kpiTst2.summary.qr_incidents)!==1) throw new Error("KPI department filter failed for TST2");
          console.log("QR/source/receiver/snapshot/KPI lifecycle passed");
          NODE
      - name: Smoke test Serial persistence after restart
        run: |
          if [ -f /tmp/qy4-server.pid ]; then kill $(cat /tmp/qy4-server.pid) || true; fi
          QY4_DEMO_SEED=0 node server.js > /tmp/qy4-restart.log 2>&1 &
          echo $! > /tmp/qy4-server.pid
          BASE=http://127.0.0.1:5000
          for i in {1..20}; do
            if curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-restarted.json; then break; fi
            sleep 1
          done
          curl -fsS "$BASE/api/reports/data-quality" >/tmp/data-quality.json
          node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/device-restarted.json","utf8"));
          const q=JSON.parse(fs.readFileSync("/tmp/data-quality.json","utf8"));
          if(d.serial!=="SERIAL-AFTER") throw new Error("Serial changed/lost after server restart: "+d.serial);
          if(String(d.insurance_code||"")!=="") throw new Error("Serial was incorrectly moved into insurance_code");
          if(Number(q.summary.missing_serial)!==0) throw new Error("Data-quality audit unexpectedly reports missing serial");
          console.log("Serial persistence after restart passed");
          NODE

      - name: Smoke test authentication and roles
        run: |
          if [ -f /tmp/qy4-server.pid ]; then kill $(cat /tmp/qy4-server.pid) || true; fi
          rm -f db/qy4_ttbyt.sqlite db/qy4_ttbyt.sqlite-shm db/qy4_ttbyt.sqlite-wal
          QY4_DEMO_SEED=0 QY4_AUTH_REQUIRED=1 QY4_ADMIN_PASSWORD='AdminPass123!' PORT=5001 node server.js > /tmp/qy4-auth-server.log 2>&1 &
          echo $! > /tmp/qy4-auth-server.pid
          BASE=http://127.0.0.1:5001
          for i in {1..20}; do
            if curl -fsS "$BASE/api/auth/status" >/tmp/auth-status.json; then break; fi
            sleep 1
          done
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/auth-status.json","utf8")); if(!x.auth_required||!x.ready) throw new Error("Auth mode not ready")'

          CODE=$(curl -s -o /tmp/unauth.json -w '%{http_code}' "$BASE/api/devices")
          test "$CODE" = "401"

          curl -fsS -c /tmp/admin-cookie.txt -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' --data '{"username":"admin","password":"AdminPass123!"}' >/tmp/admin-login.json
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"C10","name":"Khoa Trang bị"}' >/tmp/c10.json
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"TST","name":"Khoa kiểm thử"}' >/tmp/tstdept.json
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/device-groups" -H 'Content-Type: application/json' --data '{"code":"TST","name":"Nhóm kiểm thử"}' >/tmp/tstgroup.json

          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/users" -H 'Content-Type: application/json' --data '{"full_name":"Kỹ sư CI","username":"engineer","role":"Kỹ sư TTBYT","department_code":"C10","status":"Hoạt động","phone":"","password":"Engineer123!"}' >/tmp/engineer-user.json
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/users" -H 'Content-Type: application/json' --data '{"full_name":"Người dùng khoa CI","username":"deptuser","role":"Người dùng khoa","department_code":"TST","status":"Hoạt động","phone":"","password":"DeptUser123!"}' >/tmp/dept-user.json

          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST","name":"Thiết bị phân quyền","manufacturer":"Test","model":"AUTH-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"AUTH-001","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Khoa kiểm thử","note":"","device_code":"TST.TST.0001","insurance_code":"","actor":"CI"}' >/tmp/auth-device.json
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/auth-device.json","utf8")).id')

          curl -fsS -c /tmp/engineer-cookie.txt -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' --data '{"username":"engineer","password":"Engineer123!"}' >/tmp/engineer-login.json
          CODE=$(curl -s -b /tmp/engineer-cookie.txt -o /tmp/engineer-users.json -w '%{http_code}' "$BASE/api/users")
          test "$CODE" = "403"
          curl -fsS -b /tmp/engineer-cookie.txt -X POST "$BASE/api/incidents" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"incident_datetime\":\"$(date '+%Y-%m-%d %H:%M')\",\"description\":\"Kiểm thử quyền kỹ sư\",\"severity\":\"Trung bình\",\"reporter\":\"Kỹ sư CI\",\"status\":\"Mới ghi nhận\"}" >/tmp/engineer-incident.json

          curl -fsS -c /tmp/dept-cookie.txt -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' --data '{"username":"deptuser","password":"DeptUser123!"}' >/tmp/dept-login.json
          curl -fsS -b /tmp/dept-cookie.txt "$BASE/api/devices" >/tmp/dept-devices.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/dept-devices.json","utf8")); if(x.length!==1||x[0].department_code!=="TST") throw new Error("Department scope failed")'
          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/dept-write.json -w '%{http_code}' -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{}')
          test "$CODE" = "403"

          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/system/backup" -H 'Content-Type: application/json' --data '{"actor":"CI Admin"}' >/tmp/auth-backup.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/auth-backup.json","utf8")); if(!x.filename) throw new Error("Backup failed under auth")'
          echo "Authentication and role smoke test passed"

      - name: Show server log on failure
        if: failure()
        run: |
          cat /tmp/qy4-server.log || true
          cat /tmp/qy4-auth-server.log || true
