          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/dept-malformed-write.json -w '%{http_code}' -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data '{bad-json')
          test "$CODE" = "403"
          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/dept-repair-write.json -w '%{http_code}' -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data "{"device_id":$DEVICE_ID}")
          test "$CODE" = "403"
          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/dept-maintenance-write.json -w '%{http_code}' -X POST "$BASE/api/maintenances" -H 'Content-Type: application/json' --data "{"device_id":$DEVICE_ID}")
          test "$CODE" = "403"
          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/dept-inspection-write.json -w '%{http_code}' -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data "{"device_id":$DEVICE_ID}")
          test "$CODE" = "403"
          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/dept-transfer-write.json -w '%{http_code}' -X POST "$BASE/api/devices/$DEVICE_ID/transfer" -H 'Content-Type: application/json' --data '{}')
          test "$CODE" = "403"
          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/dept-transfer-history.json -w '%{http_code}' "$BASE/api/devices/$DEVICE_ID/transfers")
          test "$CODE" = "403"
          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/dept-documents.json -w '%{http_code}' "$BASE/api/documents")
          test "$CODE" = "403"
          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/own-upload.pdf -w '%{http_code}' "$BASE$OWN_UPLOAD")
          test "$CODE" = "403"
          CODE=$(curl -s -b /tmp/dept-cookie.txt -o /tmp/other-upload.pdf -w '%{http_code}' "$BASE$OTHER_UPLOAD")
          test "$CODE" = "403"

          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/system/backup" -H 'Content-Type: application/json' --data '{"actor":"CI Admin"}' >/tmp/auth-backup.json
          BACKUP_NAME=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/auth-backup.json","utf8")).filename')
          BACKUP_FILES="backups/${BACKUP_NAME%.sqlite}.files"
          test -f "backups/$BACKUP_NAME"
          test -d "$BACKUP_FILES"
          test -f "/tmp/qy4-backup-mirror/$BACKUP_NAME"
          test -d "/tmp/qy4-backup-mirror/${BACKUP_NAME%.sqlite}.files"
          SRC_FILE_COUNT=$(find uploads -type f 2>/dev/null | wc -l | tr -d ' ')
          SNAP_FILE_COUNT=$(find "$BACKUP_FILES" -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$SRC_FILE_COUNT" = "$SNAP_FILE_COUNT"
          node -e 'const Database=require("better-sqlite3");const p=process.argv[1];const db=new Database(p,{readonly:true,fileMustExist:true});const r=db.prepare("PRAGMA quick_check").get();const has=db.prepare("SELECT name FROM sqlite_master WHERE type=? AND name=?").get("table","auth_sessions");const sessions=has?db.prepare("SELECT COUNT(*) c FROM auth_sessions").get().c:0;db.close();if(String(Object.values(r)[0]).toLowerCase()!=="ok")throw new Error("Backup quick_check failed");if(Number(sessions)!==0)throw new Error("Backup still contains active login sessions")' "backups/$BACKUP_NAME"
          node -e 'const Database=require("better-sqlite3");const p=process.argv[1];const db=new Database(p,{readonly:true,fileMustExist:true});const r=db.prepare("PRAGMA quick_check").get();const has=db.prepare("SELECT name FROM sqlite_master WHERE type=? AND name=?").get("table","auth_sessions");const sessions=has?db.prepare("SELECT COUNT(*) c FROM auth_sessions").get().c:0;db.close();if(String(Object.values(r)[0]).toLowerCase()!=="ok")throw new Error("Mirror backup quick_check failed");if(Number(sessions)!==0)throw new Error("Mirror backup still contains active login sessions")' "/tmp/qy4-backup-mirror/$BACKUP_NAME"

          node scripts/verify-backup-restore.js --backup "$BACKUP_NAME" --json >/tmp/restore-rehearsal.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/restore-rehearsal.json","utf8"));
          if(r.ok!==true || (r.blockers||[]).length) throw new Error("Restore rehearsal failed: "+JSON.stringify(r.blockers));
          if(r.stats?.quick_check!=="ok" || Number(r.stats?.foreign_key_violations||0)!==0) throw new Error("Restored SQLite integrity failed");
          if(Number(r.stats?.auth_sessions||0)!==0) throw new Error("Restored backup contains auth sessions");
          if(Number(r.stats?.missing_referenced_files||0)!==0 || Number(r.stats?.referenced_file_size_mismatches||0)!==0) throw new Error("Restored attachment snapshot mismatch");
          if(Number(r.stats?.table_counts?.devices||0)<1) throw new Error("Restored backup has no device data");
          console.log("Backup restore rehearsal passed");
          NODE

          node scripts/final-release-gate.js --json >/tmp/final-release-gate.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/final-release-gate.json","utf8"));
          if(r.ok!==true || (r.blockers||[]).length) throw new Error("Final release gate failed: "+JSON.stringify(r.blockers));
          const byName=new Map((r.steps||[]).map(x=>[x.label,x]));
          if(byName.get("Preflight dữ liệu hiện tại")?.ok!==true) throw new Error("Final gate preflight did not pass");
          if(byName.get("Phục hồi thử backup mới nhất")?.ok!==true) throw new Error("Final gate backup rehearsal did not pass");
          if(byName.get("Audit bảo toàn dữ liệu sau migration")?.skipped!==true) throw new Error("Fresh-install CI final gate should skip migration audit without prestart");
          console.log("Consolidated final release gate passed");
          NODE

          rm -rf /tmp/qy4-restore-bad
          mkdir -p /tmp/qy4-restore-bad
          cp "backups/$BACKUP_NAME" "/tmp/qy4-restore-bad/$BACKUP_NAME"
          cp -a "$BACKUP_FILES" "/tmp/qy4-restore-bad/${BACKUP_NAME%.sqlite}.files"
          BAD_REL=$(node - "backups/$BACKUP_NAME" <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database(process.argv[2],{readonly:true,fileMustExist:true});
          const specs=[["incident_files","file_path"],["maintenances","file_path"],["documents","file_path"],["device_transfers","document_file_path"]];
          let value="";
          for(const [table,field] of specs){
            const t=db.prepare("SELECT name FROM sqlite_master WHERE type='table' AND name=?").get(table);
            if(!t) continue;
            const cols=new Set(db.prepare(`PRAGMA table_info(${table})`).all().map(x=>x.name));
            if(!cols.has(field)) continue;
            const row=db.prepare(`SELECT ${field} p FROM ${table} WHERE TRIM(COALESCE(${field},''))<>'' LIMIT 1`).get();
            if(row?.p){ value=String(row.p).replace(/\\/g,"/").replace(/^\/+/, "").replace(/^uploads\//i,""); break; }
          }
          db.close();
          process.stdout.write(value);
          NODE
          )
          if [ -n "$BAD_REL" ]; then
            rm -f "/tmp/qy4-restore-bad/${BACKUP_NAME%.sqlite}.files/$BAD_REL"
            set +e
            node scripts/verify-backup-restore.js --backup-dir /tmp/qy4-restore-bad --backup "$BACKUP_NAME" --json >/tmp/restore-rehearsal-bad.json
            RESTORE_BAD_CODE=$?
            set -e
            test "$RESTORE_BAD_CODE" = "2"
            node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/restore-rehearsal-bad.json","utf8"));
          if(r.ok!==false || Number(r.stats?.missing_referenced_files||0)<1) throw new Error("Restore rehearsal did not reject missing attachment: "+JSON.stringify(r));
          console.log("Incomplete backup restore rejection passed");
          NODE
          fi

          curl -fsS -b /tmp/admin-cookie.txt "$BASE/api/system/readiness" >/tmp/auth-readiness.json
          node - <<'NODE'
          const fs=require("fs");
          const b=JSON.parse(fs.readFileSync("/tmp/auth-backup.json","utf8"));
          const r=JSON.parse(fs.readFileSync("/tmp/auth-readiness.json","utf8"));
          if(!b.filename) throw new Error("Backup failed under auth");
          const m=new Map((r.checks||[]).map(x=>[x.key,x]));
          for(const key of ["database_integrity","foreign_keys","demo","auth","user_accounts","backup","qr_uid","device_catalog_integrity"]){
            if(m.get(key)?.level!=="Đạt") throw new Error("Readiness failed for "+key+": "+JSON.stringify(m.get(key)));
          }
          if(Number(r.system?.duplicate_qr_uid_groups||0)!==0) throw new Error("Authenticated readiness found duplicate QR UID");
          if(r.system?.backup_mirror_configured!==true || r.system?.latest_backup_mirrored!==true) throw new Error("Backup mirror readiness flags failed");
          if(r.system?.latest_backup_mirror_integrity!=="ok" || Number(r.system?.latest_backup_mirror_sessions||0)!==0) throw new Error("Mirror integrity/session checks failed");
          if(r.system?.latest_backup_mirror_files_match!==true) throw new Error("Mirror attachment snapshot does not match local backup");
          if(Number(r.system?.latest_backup_mirror_files_count||0)!==Number(r.system?.latest_backup_local_files_count||0)) throw new Error("Mirror/local attachment counts differ");
          if(m.get("backup_off_device")?.level!=="Lưu ý") throw new Error("Same-filesystem CI mirror must remain a warning");
          if(r.system?.backup_mirror_separate_storage!==false || r.system?.backup_mirror_same_filesystem!==true) throw new Error("Mirror storage separation detection failed");
          if(m.get("transport_security")?.level!=="Lưu ý" || r.system?.https!==false) throw new Error("HTTP authenticated deployment must remain a transport-security warning");
          if(m.get("qr_origin")?.level!=="Đạt") throw new Error("Configured QR origin should pass readiness: "+JSON.stringify(m.get("qr_origin")));
          if(r.system?.configured_qr_origin!=="http://qy4-ci.local:5001" || r.system?.qr_origin_locked!==true || r.system?.configured_qr_origin_valid!==true || r.system?.qr_origin_print_safe!==true) throw new Error("Configured QR origin readiness fields failed");
          console.log("Authenticated readiness checklist passed");
          NODE

          cp "/tmp/qy4-backup-mirror/$BACKUP_NAME" "/tmp/qy4-backup-mirror/$BACKUP_NAME.good"
          printf 'broken mirror ci' > "/tmp/qy4-backup-mirror/$BACKUP_NAME"
          curl -fsS -b /tmp/admin-cookie.txt "$BASE/api/system/readiness" >/tmp/auth-readiness-broken-mirror.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/auth-readiness-broken-mirror.json","utf8"));
          const c=(r.checks||[]).find(x=>x.key==="backup_off_device");
          if(c?.level!=="Cần xử lý" || r.system?.latest_backup_mirror_integrity!=="error") throw new Error("Corrupt mirror was not blocked by readiness: "+JSON.stringify(c));
          console.log("Corrupt mirror detection passed");
          NODE
          mv "/tmp/qy4-backup-mirror/$BACKUP_NAME.good" "/tmp/qy4-backup-mirror/$BACKUP_NAME"

          MIRROR_FILES_DIR="/tmp/qy4-backup-mirror/${BACKUP_NAME%.sqlite}.files"
          MIRROR_SAMPLE=$(find "$MIRROR_FILES_DIR" -type f | head -1 || true)
          if [ -n "$MIRROR_SAMPLE" ]; then
            MIRROR_REL="${MIRROR_SAMPLE#$MIRROR_FILES_DIR/}"
            mkdir -p /tmp/qy4-mirror-hidden
            mv "$MIRROR_SAMPLE" "/tmp/qy4-mirror-hidden/sample"
            curl -fsS -b /tmp/admin-cookie.txt "$BASE/api/system/readiness" >/tmp/auth-readiness-missing-mirror-file.json
            node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/auth-readiness-missing-mirror-file.json","utf8"));
          const c=(r.checks||[]).find(x=>x.key==="backup_off_device");
          if(c?.level!=="Cần xử lý" || r.system?.latest_backup_mirror_files_match!==false) throw new Error("Missing mirror attachment was not blocked by readiness: "+JSON.stringify(c));
          console.log("Missing mirror attachment detection passed");
          NODE
            mkdir -p "$(dirname "$MIRROR_FILES_DIR/$MIRROR_REL")"
            mv "/tmp/qy4-mirror-hidden/sample" "$MIRROR_FILES_DIR/$MIRROR_REL"
          fi
          echo "Authentication and role smoke test passed"

      - name: Smoke test authenticated demo reset
        run: |
          if [ -f /tmp/qy4-server.pid ]; then kill $(cat /tmp/qy4-server.pid) || true; fi
          if [ -f /tmp/qy4-auth-server.pid ]; then kill $(cat /tmp/qy4-auth-server.pid) || true; fi
          rm -f db/qy4_ttbyt.sqlite db/qy4_ttbyt.sqlite-shm db/qy4_ttbyt.sqlite-wal
          QY4_DEMO_SEED=1 QY4_AUTH_REQUIRED=1 QY4_ADMIN_PASSWORD='AdminPass123!' PORT=5002 node server.js > /tmp/qy4-demo-reset.log 2>&1 &
          echo $! > /tmp/qy4-demo-reset.pid
          BASE=http://127.0.0.1:5002
          for i in {1..20}; do
            if curl -fsS "$BASE/api/auth/status" >/tmp/demo-auth-status.json; then break; fi
            sleep 1
          done
          curl -fsS -c /tmp/demo-admin-cookie.txt -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' --data '{"username":"admin","password":"AdminPass123!"}' >/tmp/demo-admin-login.json
          curl -fsS -b /tmp/demo-admin-cookie.txt -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"RST1","name":"Khoa reset 1"}' >/tmp/rst1.json
          curl -fsS -b /tmp/demo-admin-cookie.txt -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"RST2","name":"Khoa reset 2"}' >/tmp/rst2.json
          curl -fsS -b /tmp/demo-admin-cookie.txt -X POST "$BASE/api/device-groups" -H 'Content-Type: application/json' --data '{"code":"RST","name":"Nhóm reset"}' >/tmp/rst-group.json
          curl -fsS -b /tmp/demo-admin-cookie.txt -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"RST1","group_code":"RST","name":"Thiết bị reset","serial":"RST-001","status":"Đang hoạt động","location":"Phòng A"}' >/tmp/rst-device.json
          RST_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/rst-device.json","utf8")).id')
          TODAY=$(node -p 'new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok"}).format(new Date())')
          curl -fsS -b /tmp/demo-admin-cookie.txt -X POST "$BASE/api/inventory-sessions" -H 'Content-Type: application/json' --data "{\"inventory_date\":\"$TODAY\",\"department_code\":\"RST1\",\"actor\":\"CI reset\"}" >/tmp/rst-session.json
          RST_SESSION=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/rst-session.json","utf8")).id')
          curl -fsS -b /tmp/demo-admin-cookie.txt "$BASE/api/inventory-sessions/$RST_SESSION" >/tmp/rst-detail.json
          RST_ITEM=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/rst-detail.json","utf8")).items.find(x=>Number(x.device_id)===Number(process.argv[1])).id' "$RST_DEVICE")
          curl -fsS -b /tmp/demo-admin-cookie.txt -X PUT "$BASE/api/inventory-items/$RST_ITEM" -H 'Content-Type: application/json' --data '{"result":"Có","actual_department_code":"RST1","actual_location":"Phòng A","updated_by":"CI reset"}' >/tmp/rst-item-update.json
          curl -fsS -b /tmp/demo-admin-cookie.txt -X POST "$BASE/api/inventory-sessions/$RST_SESSION/complete" -H 'Content-Type: application/json' --data '{"actor":"CI reset"}' >/tmp/rst-complete.json
          curl -fsS -b /tmp/demo-admin-cookie.txt -X POST "$BASE/api/devices/$RST_DEVICE/transfer" -H 'Content-Type: application/json' --data '{"to_department_code":"RST2","to_location":"Phòng B","reason":"Kiểm thử reset","actor":"CI reset"}' >/tmp/rst-transfer.json

          curl -fsS -b /tmp/demo-admin-cookie.txt -X POST "$BASE/api/reset-seed" -H 'Content-Type: application/json' --data '{}' >/tmp/rst-reset.json
          CODE=$(curl -s -b /tmp/demo-admin-cookie.txt -o /tmp/rst-old-session.json -w '%{http_code}' "$BASE/api/auth/me")
          test "$CODE" = "401"

          curl -fsS -c /tmp/demo-admin-cookie2.txt -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' --data '{"username":"admin","password":"AdminPass123!"}' >/tmp/demo-admin-login2.json
          curl -fsS -b /tmp/demo-admin-cookie2.txt "$BASE/api/system/readiness" >/tmp/rst-readiness.json
          curl -fsS -b /tmp/demo-admin-cookie2.txt "$BASE/api/devices" >/tmp/rst-devices-after.json
          node - <<'NODE'
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("/tmp/rst-readiness.json","utf8"));
          const devices=JSON.parse(fs.readFileSync("/tmp/rst-devices-after.json","utf8"));
          const m=new Map((r.checks||[]).map(x=>[x.key,x]));
          if(r.system?.foreign_keys_enabled!==true || Number(r.system?.foreign_key_violations||0)!==0) throw new Error("Foreign-key integrity failed after demo reset");
          for(const key of ["database_integrity","foreign_keys","auth","qr_uid"]){
            if(m.get(key)?.level!=="Đạt") throw new Error("Reset readiness failed: "+key);
          }
          if(m.get("demo")?.level!=="Cần xử lý") throw new Error("Demo mode should remain visibly flagged");
          if(!devices.length || devices.some(x=>!x.qr_uid)) throw new Error("Reseeded devices missing QR UID");
          if(devices.some(x=>x.serial==="RST-001")) throw new Error("Pre-reset custom device survived reset");
          const demoXray=devices.find(x=>x.serial==="XQ-C7-001");
          const demoLab=devices.find(x=>x.serial==="SH-C2-001");
          if(!demoXray || JSON.stringify(demoXray.inspection_required_types)!==JSON.stringify(["Kiểm định","Kiểm định an toàn bức xạ"])) throw new Error("Demo reset lost X-ray inspection obligations");
          if(!demoLab || JSON.stringify(demoLab.inspection_required_types)!==JSON.stringify(["Hiệu chuẩn"])) throw new Error("Demo reset lost laboratory calibration obligation");
          console.log("Authenticated demo reset passed");
          NODE

      - name: Show server log on failure
        if: failure()
        run: |
          cat /tmp/qy4-server.log || true
          cat /tmp/qy4-auth-server.log || true
          cat /tmp/qy4-demo-reset.log || true
