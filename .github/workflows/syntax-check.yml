          SNAP_REPAIR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/snap-transfer.json","utf8")).repair_id')

          CODE=$(curl -s -o /tmp/linked-repair-move.json -w '%{http_code}' -X PUT "$BASE/api/repairs/$SNAP_REPAIR" -H 'Content-Type: application/json' --data "{\"device_id\":$DEV_A}")
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/linked-repair-delete.json -w '%{http_code}' -X DELETE "$BASE/api/repairs/$SNAP_REPAIR")
          test "$CODE" = "400"

          curl -fsS -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$TODAY 16:00\",\"issue\":\"Phiếu độc lập kiểm thử\",\"work\":\"Chờ xử lý\",\"person\":\"CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"\",\"processing_status\":\"Đang xử lý\"}" >/tmp/standalone-repair.json
          STANDALONE_REPAIR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/standalone-repair.json","utf8")).id')
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-during-standalone.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/device-during-standalone.json","utf8")); if(d.status!=="Chờ sửa chữa") throw new Error("Device did not enter repair status")'

          CODE=$(curl -s -o /tmp/duplicate-open-repair.json -w '%{http_code}' -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$TODAY 16:05\",\"issue\":\"Phiếu mở trùng\",\"processing_status\":\"Đang xử lý\"}")
          test "$CODE" = "400"

          curl -fsS -X DELETE "$BASE/api/repairs/$STANDALONE_REPAIR" >/tmp/standalone-delete.json
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-after-delete-repair.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/device-after-delete-repair.json","utf8")); const x=JSON.parse(require("fs").readFileSync("/tmp/standalone-delete.json","utf8")); if(d.status!=="Đang hoạt động"||x.restored_device_status!=="Đang hoạt động") throw new Error("Pre-repair device status was not restored")'

          curl -fsS -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$TODAY 16:30\",\"issue\":\"Kiểm thử hoạt động hạn chế\",\"work\":\"Đã xử lý nhưng cần theo dõi\",\"person\":\"CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"Theo dõi\",\"processing_status\":\"Đã hoàn thành\",\"status_after\":\"Hoạt động hạn chế\"}" >/tmp/limited-repair.json
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-after-limited-repair.json
          curl -fsS "$BASE/api/dashboard/operations" >/tmp/dashboard-after-limited.json
          node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/device-after-limited-repair.json","utf8"));
          const o=JSON.parse(fs.readFileSync("/tmp/dashboard-after-limited.json","utf8"));
          if(d.status!=="Hoạt động hạn chế") throw new Error("Completed repair lost limited-operation outcome");
          if(Number(o.limited||0)<1) throw new Error("Dashboard did not count limited-operation equipment");
          if(Number(o.operational||0)!==Number(o.active||0)+Number(o.limited||0)) throw new Error("Operational count is inconsistent");
          if(Number(o.active||0)+Number(o.limited||0)+Number(o.repairing||0)+Number(o.stopped||0)!==Number(o.total||0)) throw new Error("Dashboard device-state totals do not reconcile");
          NODE
          echo "Repair integrity rules passed"

      - name: Smoke test inventory integrity rules
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          curl -fsS -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"INV","name":"Khoa kiểm kê CI"}' >/tmp/inv-dept.json
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"INV","group_code":"TST","name":"Thiết bị kiểm kê CI","serial":"INV-CI-001","status":"Đang hoạt động","location":"Phòng A","device_code":"INV.TST.0001"}' >/tmp/inv-device.json
          INV_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/inv-device.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/inventory-sessions" -H 'Content-Type: application/json' --data "{\"inventory_date\":\"$TODAY\",\"department_code\":\"INV\",\"actor\":\"CI\"}" >/tmp/inv-session.json
          INV_SESSION=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/inv-session.json","utf8")).id')
          CODE=$(curl -s -o /tmp/inv-archive-open.json -w '%{http_code}' -X DELETE "$BASE/api/devices/$INV_DEVICE")
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/inv-duplicate-session.json -w '%{http_code}' -X POST "$BASE/api/inventory-sessions" -H 'Content-Type: application/json' --data "{\"inventory_date\":\"$TODAY\",\"department_code\":\"INV\",\"actor\":\"CI\"}")
          test "$CODE" = "409"
          curl -fsS "$BASE/api/inventory-sessions/$INV_SESSION" >/tmp/inv-detail.json
          INV_ITEM=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/inv-detail.json","utf8")).items[0].id')
          CODE=$(curl -s -o /tmp/inv-force-complete.json -w '%{http_code}' -X POST "$BASE/api/inventory-sessions/$INV_SESSION/complete" -H 'Content-Type: application/json' --data '{"actor":"CI","force":"1"}')
          test "$CODE" = "409"

          CODE=$(curl -s -o /tmp/inv-bad-dept.json -w '%{http_code}' -X PUT "$BASE/api/inventory-items/$INV_ITEM" -H 'Content-Type: application/json' --data '{"result":"Sai khoa","actual_department_code":"INV","actual_location":"Phòng A","updated_by":"CI"}')
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/inv-bad-location.json -w '%{http_code}' -X PUT "$BASE/api/inventory-items/$INV_ITEM" -H 'Content-Type: application/json' --data '{"result":"Sai vị trí","actual_department_code":"INV","actual_location":"Phòng A","updated_by":"CI"}')
          test "$CODE" = "400"
          curl -fsS -X PUT "$BASE/api/inventory-items/$INV_ITEM" -H 'Content-Type: application/json' --data '{"result":"Sai vị trí","actual_department_code":"INV","actual_location":"Phòng B","note":"CI mismatch","updated_by":"CI"}' >/tmp/inv-valid.json
          INV_TRANSFER_JSON=$(node -e 'process.stdout.write(JSON.stringify({transfer_datetime:process.argv[1]+" 16:00:00",to_department_code:"INV",to_location:"Phòng B",actor:"CI",reason:"Điều chuyển theo kiểm kê CI",note:"Giữ sai lệch trong biên bản kiểm kê"}))' "$TODAY")
          curl -fsS -X POST "$BASE/api/devices/$INV_DEVICE/transfer" -H 'Content-Type: application/json' --data "$INV_TRANSFER_JSON" >/tmp/inv-transfer.json
          curl -fsS "$BASE/api/inventory-sessions/$INV_SESSION" >/tmp/inv-after-transfer-session.json
          curl -fsS "$BASE/api/devices/$INV_DEVICE" >/tmp/inv-after-transfer-device.json
          node - <<'NODE'
          const fs=require("fs");
          const s=JSON.parse(fs.readFileSync("/tmp/inv-after-transfer-session.json","utf8"));
          const d=JSON.parse(fs.readFileSync("/tmp/inv-after-transfer-device.json","utf8"));
          const item=(s.items||[])[0];
          if(!item || item.result!=="Sai vị trí" || item.actual_location!=="Phòng B") throw new Error("Inventory mismatch history was altered by transfer");
          if(d.location!=="Phòng B") throw new Error("Device current location did not update after transfer");
          if(!(d.transfers||[]).some(x=>x.reason==="Điều chuyển theo kiểm kê CI")) throw new Error("Inventory transfer missing from device history");
          NODE
          curl -fsS -X POST "$BASE/api/inventory-sessions/$INV_SESSION/complete" -H 'Content-Type: application/json' --data '{"actor":"CI"}' >/tmp/inv-complete.json
          CODE=$(curl -s -o /tmp/inv-after-complete.json -w '%{http_code}' -X PUT "$BASE/api/inventory-items/$INV_ITEM" -H 'Content-Type: application/json' --data '{"result":"Có","actual_department_code":"INV","actual_location":"Phòng A","updated_by":"CI"}')
          test "$CODE" = "400"
          curl -fsS -X DELETE "$BASE/api/devices/$INV_DEVICE" >/tmp/inv-archive-complete.json
          curl -fsS "$BASE/api/devices" >/tmp/managed-devices-after-archive.json
          curl -fsS "$BASE/api/leadership-dashboard" >/tmp/leadership-after-archive.json
          node - <<'NODE'
          const fs=require("fs");
          const devices=JSON.parse(fs.readFileSync("/tmp/managed-devices-after-archive.json","utf8"));
          const leadership=JSON.parse(fs.readFileSync("/tmp/leadership-after-archive.json","utf8"));
          if(devices.some(x=>x.device_code==="INV.TST.0001")) throw new Error("Archived device still visible in managed list");
          if(Number(leadership.total)!==devices.length) throw new Error("Leadership total includes archived equipment");
          NODE
          echo "Inventory and archival integrity rules passed"

      - name: Smoke test public QR rate limit
        run: |
          BASE=http://127.0.0.1:5000
          HIT_429=0
          for i in {1..25}; do
            CODE=$(curl -s -o /tmp/qr-rate-$i.json -w '%{http_code}' -X POST "$BASE/api/qr/incidents" -H 'Content-Type: application/json' --data '{}')
            if [ "$CODE" = "429" ]; then
              HIT_429=1
              break
            fi
          done
          test "$HIT_429" = "1"
          echo "Public QR write rate limit passed"

      - name: Smoke test Serial persistence after restart
        run: |
          if [ -f /tmp/qy4-server.pid ]; then kill $(cat /tmp/qy4-server.pid) || true; fi
          QY4_DEMO_SEED=0 node server.js > /tmp/qy4-restart.log 2>&1 &
          echo $! > /tmp/qy4-server.pid
          BASE=http://127.0.0.1:5000
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).id')
          test -n "$DEVICE_ID"
          for i in {1..20}; do
            if curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-restarted.json; then break; fi
            sleep 1
          done
          curl -fsS "$BASE/api/reports/data-quality" >/tmp/data-quality.json
          node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/device-restarted.json","utf8"));
          const q=JSON.parse(fs.readFileSync("/tmp/data-quality.json","utf8"));
          if(d.serial!=="SERIAL-AFTER") throw new Error("Serial changed/lost after server restart: "+d.serial);
          if(d.status!=="Hoạt động hạn chế") throw new Error("Limited-operation status changed after restart: "+d.status);
          if(String(d.insurance_code||"")!=="") throw new Error("Serial was incorrectly moved into insurance_code");
          if(Number(q.summary.missing_serial)!==0) throw new Error("Data-quality audit unexpectedly reports missing serial");
          console.log("Serial persistence after restart passed");
          NODE

      - name: Smoke test authentication and roles
        run: |
          if [ -f /tmp/qy4-server.pid ]; then kill $(cat /tmp/qy4-server.pid) || true; fi
          rm -f db/qy4_ttbyt.sqlite db/qy4_ttbyt.sqlite-shm db/qy4_ttbyt.sqlite-wal
          QY4_DEMO_SEED=0 QY4_AUTH_REQUIRED=1 QY4_ADMIN_PASSWORD='AdminPass123!' PORT=5001 node server.js > /tmp/qy4-auth-server.log 2>&1 &
          echo $! > /tmp/qy4-auth-server.pid
          BASE=http://127.0.0.1:5001
          for i in {1..20}; do
            if curl -fsS "$BASE/api/auth/status" >/tmp/auth-status.json; then break; fi
            sleep 1
          done
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/auth-status.json","utf8")); if(!x.auth_required||!x.ready) throw new Error("Auth mode not ready")'

          CODE=$(curl -s -o /tmp/unauth.json -w '%{http_code}' "$BASE/api/devices")
          test "$CODE" = "401"
          test "$(curl -s -o /tmp/qr-origins-unauth.json -w '%{http_code}' "$BASE/api/system/qr-origins")" = "401"

          LAST_LOGIN_CODE=0
          for i in {1..8}; do
            LAST_LOGIN_CODE=$(curl -s -o /tmp/bad-login-$i.json -w '%{http_code}' -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' --data '{"username":"blocked-user","password":"WrongPassword!"}')
          done
          test "$LAST_LOGIN_CODE" = "429"
          RETRY_AFTER=$(curl -s -D - -o /tmp/bad-login-extra.json -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' --data '{"username":"blocked-user","password":"WrongPassword!"}' | tr -d '\r' | awk -F': ' 'tolower($1)=="retry-after"{print $2}' | tail -1)
          test -n "$RETRY_AFTER"

          UPLOAD_FILE=$(find uploads/qr -maxdepth 1 -type f | head -1 || true)
          if [ -n "$UPLOAD_FILE" ]; then
            UPLOAD_URL="/uploads/qr/$(basename "$UPLOAD_FILE")"
            CODE=$(curl -s -o /tmp/upload-unauth.bin -w '%{http_code}' "$BASE$UPLOAD_URL")
            test "$CODE" = "401"
          fi

          curl -fsS -c /tmp/admin-cookie.txt -X POST "$BASE/api/auth/login" -H 'Content-Type: application/json' --data '{"username":"admin","password":"AdminPass123!"}' >/tmp/admin-login.json
          if [ -n "$UPLOAD_FILE" ]; then
            CODE=$(curl -s -b /tmp/admin-cookie.txt -o /tmp/upload-auth.bin -w '%{http_code}' "$BASE$UPLOAD_URL")
            test "$CODE" = "200"
            test -s /tmp/upload-auth.bin
          fi
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"C10","name":"Khoa Trang bị"}' >/tmp/c10.json
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"TST","name":"Khoa kiểm thử"}' >/tmp/tstdept.json
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/departments" -H 'Content-Type: application/json' --data '{"code":"TST2","name":"Khoa kiểm thử 2"}' >/tmp/tstdept2.json
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/device-groups" -H 'Content-Type: application/json' --data '{"code":"TST","name":"Nhóm kiểm thử"}' >/tmp/tstgroup.json

          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/users" -H 'Content-Type: application/json' --data '{"full_name":"Kỹ sư CI","username":"engineer","role":"Kỹ sư TTBYT","department_code":"C10","status":"Hoạt động","phone":"","password":"Engineer123!"}' >/tmp/engineer-user.json
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/users" -H 'Content-Type: application/json' --data '{"full_name":"Người dùng khoa CI","username":"deptuser","role":"Người dùng khoa","department_code":"TST","status":"Hoạt động","phone":"","password":"DeptUser123!"}' >/tmp/dept-user.json

          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST","name":"Thiết bị phân quyền","manufacturer":"Test","model":"AUTH-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"AUTH-001","country":"Việt Nam","year_manufactured":2026,"cost":123456,"funding":"Nguồn kiểm thử nội bộ","location":"Khoa kiểm thử","note":"Ghi chú nội bộ","device_code":"TST.TST.0001","insurance_code":"","actor":"CI"}' >/tmp/auth-device.json
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/auth-device.json","utf8")).id')
          AUTH_QR_UID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/auth-device.json","utf8")).qr_uid')
          test -n "$AUTH_QR_UID"
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị khoa khác","model":"AUTH-02","serial":"AUTH-002","status":"Đang hoạt động","device_code":"TST2.TST.0001"}' >/tmp/auth-device2.json
          DEVICE2_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/auth-device2.json","utf8")).id')

          CODE=$(curl -s -b /tmp/admin-cookie.txt -o /tmp/serial-dup-reject.json -w '%{http_code}' -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Máy trùng serial kiểm thử","serial":"AUTH-001","status":"Đang hoạt động","device_code":"TST2.TST.0998"}')
          test "$CODE" = "409"
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Máy trùng serial đã xác nhận","serial":"AUTH-001","status":"Đang hoạt động","device_code":"TST2.TST.0999","allow_duplicate_serial":true}' >/tmp/serial-dup-allow.json
          SERIAL_OVERRIDE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/serial-dup-allow.json","utf8")).id')
          curl -fsS -b /tmp/admin-cookie.txt -X DELETE "$BASE/api/devices/$SERIAL_OVERRIDE_ID" >/tmp/serial-dup-archive.json
          curl -fsS -b /tmp/admin-cookie.txt "$BASE/api/devices/duplicate-check?serial=NN" >/tmp/serial-placeholder.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/serial-placeholder.json","utf8")); if(x.serial_duplicate||x.serial_matches.length) throw new Error("Placeholder serial must not be treated as a real duplicate")'
          printf '%s\n' '%PDF-1.4' 'department-scope' '%%EOF' >/tmp/auth-scope.pdf
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/documents" -F "device_id=$DEVICE_ID" -F "name=Tài liệu khoa TST" -F "type=Kiểm thử" -F "file=@/tmp/auth-scope.pdf;type=application/pdf" >/tmp/auth-doc-own.json
          curl -fsS -b /tmp/admin-cookie.txt -X POST "$BASE/api/documents" -F "device_id=$DEVICE2_ID" -F "name=Tài liệu khoa TST2" -F "type=Kiểm thử" -F "file=@/tmp/auth-scope.pdf;type=application/pdf" >/tmp/auth-doc-other.json
          OWN_UPLOAD=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/auth-doc-own.json","utf8")).file_path')
          OTHER_UPLOAD=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/auth-doc-other.json","utf8")).file_path')

          CODE=$(curl -s -o /tmp/full-qr-unauth.json -w '%{http_code}' "$BASE/api/qr/device-uid/$AUTH_QR_UID")
          test "$CODE" = "401"
          curl -fsS "$BASE/api/public/device-qr/$AUTH_QR_UID" >/tmp/public-qr.json
          test "$(curl -s -o /tmp/public-legacy-id.json -w '%{http_code}' "$BASE/api/public/device/$DEVICE_ID")" = "410"
          test "$(curl -s -o /tmp/public-legacy-code.json -w '%{http_code}' "$BASE/api/public/device-code/TST.TST.0001")" = "410"
          node - <<'NODE'
