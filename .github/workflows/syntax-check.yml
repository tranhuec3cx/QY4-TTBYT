name: QY4 syntax check
on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check server syntax
        run: node --check server.js
      - name: Check application JavaScript syntax
        run: |
          for f in public/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
