name: QY4 syntax and smoke check
on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          for f in public/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Install dependencies
        run: npm ci
      - name: Start server
        run: |
          QY4_DEMO_SEED=0 node server.js > /tmp/qy4-server.log 2>&1 &
          echo $! > /tmp/qy4-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/api/devices >/tmp/devices.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qy4-server.log
          exit 1
      - name: Smoke test core APIs
        run: |
          curl -fsS http://127.0.0.1:5000/api/dashboard/operations >/tmp/dashboard.json
          curl -fsS http://127.0.0.1:5000/api/inventory-sessions >/tmp/inventory.json
          curl -fsS http://127.0.0.1:5000/api/system/backups >/tmp/backups.json
          curl -fsS "http://127.0.0.1:5000/api/devices/duplicate-check?serial=__TEST__" >/tmp/duplicate.json
          node -e 'for (const p of ["/tmp/devices.json","/tmp/dashboard.json","/tmp/inventory.json","/tmp/backups.json","/tmp/duplicate.json"]) JSON.parse(require("fs").readFileSync(p,"utf8")); console.log("Core API smoke test passed")'
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/qy4-server.log || true
