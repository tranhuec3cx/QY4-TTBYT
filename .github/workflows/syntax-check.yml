          NODE

          curl -fsS "$BASE/api/checks?preset=custom&from_date=2026-09-05&to_date=2026-09-05" >/tmp/legacy-r15-checks.json
          node - <<'NODE'
          const rows=JSON.parse(require("fs").readFileSync("/tmp/legacy-r15-checks.json","utf8"));
          const c=rows.find(x=>Number(x.device_id)===1 && x.check_datetime==="2026-09-05 09:00:00");
