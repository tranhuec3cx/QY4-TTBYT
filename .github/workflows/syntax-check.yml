          if(c.department_code!=="A12" || c.location!=="Buồng HSTC 2") throw new Error("Legacy daily-check historical context was not backfilled: "+JSON.stringify(c));
          console.log("Legacy R15 daily-check context migration passed");
          NODE

      - name: Smoke test QR incident repair lifecycle
