          CODE=$(curl -s -o /tmp/device-minimal-archived-post.json -w '%{http_code}' -X POST "$BASE/api/qr/checks" -F "qr_uid=$MIN_QR_UID" -F "inspector=CI" -F "condition=Bình thường")
