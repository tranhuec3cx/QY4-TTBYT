          QR_CHECK_TIME=$(node -e 'const fs=require("fs");const id=Number(process.argv[1]);const rows=JSON.parse(fs.readFileSync("/tmp/checks-before-edit.json","utf8"));const r=rows.find(x=>Number(x.id)===id);if(!r)throw new Error("QR check missing");process.stdout.write(String(r.check_datetime||""))' "$QR_CHECK_ID")
          curl -fsS -X PUT "$BASE/api/checks/$QR_CHECK_ID" -H 'Content-Type: application/json' --data '{"check_datetime":"2001-01-01 00:00:00","inspector":"QR Check CI sửa","content":"Hiệu chỉnh nội dung","result":"Có vấn đề","note":"Giữ nguyên thời điểm và kết quả quét"}' >/tmp/qr-check-update.json
          curl -fsS "$BASE/api/checks?from_date=2000-01-01&to_date=2100-12-31" >/tmp/checks-after-edit.json
          node -e 'const fs=require("fs");const id=Number(process.argv[1]);const expected=process.argv[2];const rows=JSON.parse(fs.readFileSync("/tmp/checks-after-edit.json","utf8"));const r=rows.find(x=>Number(x.id)===id);if(!r)throw new Error("QR check disappeared after edit");if(String(r.check_datetime)!==expected)throw new Error("QR timestamp changed");if(r.result!=="Bình thường")throw new Error("QR result changed after capture");if(r.inspector!=="QR Check CI sửa")throw new Error("QR content correction not saved")' "$QR_CHECK_ID" "$QR_CHECK_TIME"
