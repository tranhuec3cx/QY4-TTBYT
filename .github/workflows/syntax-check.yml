      - name: Smoke test repair integrity rules
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).id')
          DEV_A=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/snap-device-a.json","utf8")).id')
          SNAP_REPAIR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/snap-transfer.json","utf8")).repair_id')

          CODE=$(curl -s -o /tmp/linked-repair-move.json -w '%{http_code}' -X PUT "$BASE/api/repairs/$SNAP_REPAIR" -H 'Content-Type: application/json' --data "{\"device_id\":$DEV_A}")
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/linked-repair-delete.json -w '%{http_code}' -X DELETE "$BASE/api/repairs/$SNAP_REPAIR")
          test "$CODE" = "409"

          curl -fsS "$BASE/api/system/readiness" >/tmp/linkage-baseline-readiness.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/linkage-baseline-readiness.json","utf8"));
          const c=(r.checks||[]).find(x=>x.key==="incident_repair_linkage");
          if(c?.level!=="Đạt") throw new Error("Incident-repair linkage baseline invalid: "+JSON.stringify(c));
          console.log("Incident-repair linkage readiness baseline passed");
          NODE

          node - "$SNAP_REPAIR" "$TODAY" <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.pragma("busy_timeout=5000");
          db.pragma("foreign_keys=OFF");
          const repairId=Number(process.argv[2]);
          const day=process.argv[3];
          const linked=db.prepare(`
            SELECT r.incident_id,i.device_id
            FROM repairs r JOIN incidents i ON i.id=r.incident_id
            WHERE r.id=?
          `).get(repairId);
          if(!linked?.incident_id) throw new Error("Linked repair fixture missing incident");
          const other=db.prepare("SELECT id FROM devices WHERE id<>? ORDER BY id LIMIT 1").get(Number(linked.device_id));
          if(!other) throw new Error("Need another device for linkage corruption test");
          db.prepare(`
            INSERT INTO repairs
              (device_id,repair_date,issue,work,person,cost,result,status_after,status_before,processing_status,incident_id,received_at,updated_at,completed_at)
            VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)
          `).run(Number(other.id),day+" 15:50:00","CI_LINKAGE_WRONG_DEVICE","Dữ liệu bẩn mô phỏng","CI",0,"Đạt","Đang hoạt động","Đang hoạt động","Đã hoàn thành",Number(linked.incident_id),day+" 15:50:00",day+" 15:50:00",null);
          db.prepare(`
            INSERT INTO repairs
              (device_id,repair_date,issue,work,person,cost,result,status_after,status_before,processing_status,incident_id,received_at,updated_at,completed_at)
            VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)
          `).run(Number(other.id),day+" 15:51:00","CI_LINKAGE_ORPHAN","Dữ liệu bẩn mô phỏng","CI",0,"Đạt","Đang hoạt động","Đang hoạt động","Đã hoàn thành",999999999,day+" 15:51:00",day+" 15:51:00",day+" 15:51:00");
          db.close();
          NODE

          set +e
          node scripts/preflight-realdata.js --db db/qy4_ttbyt.sqlite --uploads uploads --json >/tmp/linkage-dirty-preflight.json
          LINKAGE_PREFLIGHT_CODE=$?
          set -e
          test "$LINKAGE_PREFLIGHT_CODE" = "2"
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/linkage-dirty-preflight.json","utf8"));
          if(Number(r.stats?.orphan_repair_incident_refs||0)<1) throw new Error("Preflight missed orphan incident reference");
          if(Number(r.stats?.incident_repair_device_mismatches||0)<1) throw new Error("Preflight missed incident/repair device mismatch");
          if(Number(r.stats?.incidents_with_multiple_repairs||0)<1) throw new Error("Preflight missed multiple linked repairs");
          if(!(r.blockers||[]).some(x=>String(x).includes("Sự cố – Sửa chữa"))) throw new Error("Preflight linkage blocker text missing");
          console.log("Incident-repair linkage preflight blocking passed");
          NODE

          curl -fsS "$BASE/api/system/readiness" >/tmp/linkage-dirty-readiness.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/linkage-dirty-readiness.json","utf8"));
          const c=(r.checks||[]).find(x=>x.key==="incident_repair_linkage");
          if(c?.level!=="Cần xử lý") throw new Error("Readiness did not block dirty incident-repair linkage: "+JSON.stringify(c));
          if(Number(r.system?.orphan_repair_incident_refs||0)<1) throw new Error("Readiness missed orphan incident reference");
          if(Number(r.system?.incident_repair_device_mismatches||0)<1) throw new Error("Readiness missed device mismatch");
          if(Number(r.system?.incidents_with_multiple_repairs||0)<1) throw new Error("Readiness missed multiple linked repairs");
          if(Number(r.system?.terminal_linked_repairs_missing_completion||0)<1) throw new Error("Readiness missed terminal repair without completed_at");
          console.log("Incident-repair linkage readiness blocking passed");
          NODE

          node - <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.pragma("foreign_keys=OFF");
          db.prepare("DELETE FROM repairs WHERE issue IN ('CI_LINKAGE_WRONG_DEVICE','CI_LINKAGE_ORPHAN')").run();
          db.close();
          NODE
          curl -fsS "$BASE/api/system/readiness" >/tmp/linkage-clean-readiness.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/linkage-clean-readiness.json","utf8")); const c=(r.checks||[]).find(x=>x.key==="incident_repair_linkage"); if(c?.level!=="Đạt") throw new Error("Linkage readiness did not return to clean baseline: "+JSON.stringify(c));'

          curl -fsS -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$TODAY 16:00\",\"issue\":\"Phiếu độc lập kiểm thử\",\"work\":\"Chờ xử lý\",\"person\":\"CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"\",\"processing_status\":\"Đang xử lý\"}" >/tmp/standalone-repair.json
          STANDALONE_REPAIR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/standalone-repair.json","utf8")).id')
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-during-standalone.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/device-during-standalone.json","utf8")); if(d.status!=="Chờ sửa chữa") throw new Error("Device did not enter repair status")'
          CODE=$(curl -s -o /tmp/device-open-repair-status-override.json -w '%{http_code}' -X PUT "$BASE/api/devices/$DEVICE_ID" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị kiểm thử QR","manufacturer":"Test","model":"TEST-01","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"SERIAL-AFTER","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí chuyển","note":"","insurance_code":""}')
          test "$CODE" = "409"

          CODE=$(curl -s -o /tmp/duplicate-open-repair.json -w '%{http_code}' -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$TODAY 16:05\",\"issue\":\"Phiếu mở trùng\",\"processing_status\":\"Đang xử lý\"}")
          test "$CODE" = "400"

          DIRTY_REPAIR=$(node - "$DEVICE_ID" "$TODAY" <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.pragma("busy_timeout=5000");
          const deviceId=Number(process.argv[2]);
          const day=process.argv[3];
          const info=db.prepare(`
            INSERT INTO repairs
              (device_id,repair_date,issue,work,person,cost,result,status_after,status_before,processing_status,received_at,updated_at)
            VALUES (?,?,?,?,?,?,?,?,?,?,?,?)
          `).run(deviceId,day+" 16:06:00","Dữ liệu bẩn legacy CI","","CI",0,"","Chờ sửa chữa","Đang hoạt động","Đang xử lý",day+" 16:06:00",day+" 16:06:00");
          db.prepare("UPDATE devices SET status='Đang hoạt động' WHERE id=?").run(deviceId);
          db.close();
          process.stdout.write(String(info.lastInsertRowid));
          NODE
          )
          test -n "$DIRTY_REPAIR"
          curl -fsS "$BASE/api/system/readiness" >/tmp/repair-dirty-readiness.json
          node - <<'NODE'
          const r=JSON.parse(require("fs").readFileSync("/tmp/repair-dirty-readiness.json","utf8"));
          const c=(r.checks||[]).find(x=>x.key==="repair_consistency");
          if(!c||c.level!=="Cần xử lý") throw new Error("Readiness did not block dirty repair data: "+JSON.stringify(c));
          if(Number(r.system?.duplicate_open_repair_devices||0)<1) throw new Error("Duplicate open repair device was not detected");
          if(Number(r.system?.open_repair_status_mismatches||0)<1) throw new Error("Open repair/device status mismatch was not detected");
          console.log("Dirty legacy repair readiness detection passed");
          NODE
          curl -fsS -X PUT "$BASE/api/repairs/$DIRTY_REPAIR" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$TODAY 16:06\",\"issue\":\"Dữ liệu bẩn legacy CI\",\"work\":\"Khép một trong hai phiếu mở\",\"person\":\"CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"Đạt\",\"processing_status\":\"Đã hoàn thành\",\"status_after\":\"Đang hoạt động\"}" >/tmp/dirty-repair-complete.json
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-after-dirty-complete.json
          node - <<'NODE'
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("/tmp/dirty-repair-complete.json","utf8"));
          const d=JSON.parse(fs.readFileSync("/tmp/device-after-dirty-complete.json","utf8"));
          if(r.device_status!=="Chờ sửa chữa" || d.status!=="Chờ sửa chữa") throw new Error("Completing one duplicate repair incorrectly reopened the device");
          console.log("Duplicate-open repair completion kept device in repair");
          NODE

          node - "$DIRTY_REPAIR" "$DEVICE_ID" "$TODAY" <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.pragma("busy_timeout=5000");
          db.prepare("DELETE FROM repairs WHERE id=?").run(Number(process.argv[2]));
          const deviceId=Number(process.argv[3]);
          const day=process.argv[4];
          const info=db.prepare(`
            INSERT INTO repairs
              (device_id,repair_date,issue,work,person,cost,result,status_after,status_before,processing_status,received_at,updated_at)
            VALUES (?,?,?,?,?,?,?,?,?,?,?,?)
          `).run(deviceId,day+" 16:07:00","Phiếu legacy nhập nhầm để thử xóa","","CI",0,"","Chờ sửa chữa","Đang hoạt động","Đang xử lý",day+" 16:07:00",day+" 16:07:00");
          db.close();
          process.stdout.write(String(info.lastInsertRowid));
          NODE
          DIRTY_DELETE_REPAIR=$(node - "$DEVICE_ID" "$TODAY" <<'NODE'
          const Database=require("better-sqlite3");
          const db=new Database("db/qy4_ttbyt.sqlite");
          db.pragma("busy_timeout=5000");
          const deviceId=Number(process.argv[2]);
          const day=process.argv[3];
          const row=db.prepare("SELECT id FROM repairs WHERE device_id=? AND issue=? ORDER BY id DESC LIMIT 1").get(deviceId,"Phiếu legacy nhập nhầm để thử xóa");
          db.close();
          if(!row) process.exit(1);
          process.stdout.write(String(row.id));
          NODE
          )
          curl -fsS -X DELETE "$BASE/api/repairs/$DIRTY_DELETE_REPAIR" >/tmp/dirty-delete-repair.json
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-after-dirty-delete.json
          node - <<'NODE'
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("/tmp/dirty-delete-repair.json","utf8"));
          const d=JSON.parse(fs.readFileSync("/tmp/device-after-dirty-delete.json","utf8"));
          if(r.restored_device_status!=="Chờ sửa chữa" || d.status!=="Chờ sửa chữa") throw new Error("Deleting one duplicate repair incorrectly restored the pre-repair device status");
          console.log("Duplicate-open repair deletion kept device in repair");
          NODE

          curl -fsS -X DELETE "$BASE/api/repairs/$STANDALONE_REPAIR" >/tmp/standalone-delete.json
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-after-delete-repair.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/device-after-delete-repair.json","utf8")); const x=JSON.parse(require("fs").readFileSync("/tmp/standalone-delete.json","utf8")); if(d.status!=="Đang hoạt động"||x.restored_device_status!=="Đang hoạt động") throw new Error("Pre-repair device status was not restored")'

          curl -fsS -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$TODAY 16:30\",\"issue\":\"Kiểm thử hoạt động hạn chế\",\"work\":\"Đã xử lý nhưng cần theo dõi\",\"person\":\"CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"Theo dõi\",\"processing_status\":\"Đã hoàn thành\",\"status_after\":\"Hoạt động hạn chế\"}" >/tmp/limited-repair.json
          LIMITED_REPAIR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/limited-repair.json","utf8")).id')
          CODE=$(curl -s -o /tmp/limited-repair-reopen-reject.json -w '%{http_code}' -X PUT "$BASE/api/repairs/$LIMITED_REPAIR" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"repair_date\":\"$TODAY 16:30\",\"issue\":\"Kiểm thử hoạt động hạn chế\",\"work\":\"Thử mở lại phiếu đã hoàn thành\",\"person\":\"CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"Theo dõi\",\"processing_status\":\"Đang xử lý\",\"status_after\":\"Đang hoạt động\"}")
          test "$CODE" = "409"
          curl -fsS "$BASE/api/repairs" >/tmp/limited-repairs-after-reopen.json
          curl -fsS "$BASE/api/devices/$DEVICE_ID" >/tmp/device-after-limited-repair.json
          node - "$LIMITED_REPAIR" <<'NODE'
          const fs=require("fs");
          const id=Number(process.argv[2]);
          const repair=JSON.parse(fs.readFileSync("/tmp/limited-repairs-after-reopen.json","utf8")).find(x=>Number(x.id)===id);
          const device=JSON.parse(fs.readFileSync("/tmp/device-after-limited-repair.json","utf8"));
          if(!repair || repair.processing_status!=="Đã hoàn thành" || !String(repair.completed_at||"").trim()) throw new Error("Terminal repair was reopened or lost completion time");
          if(device.status!=="Hoạt động hạn chế") throw new Error("Rejected repair reopen changed device status");
          console.log("Terminal repair reopen lock passed");
          NODE
          curl -fsS "$BASE/api/dashboard/operations" >/tmp/dashboard-after-limited.json
          node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("/tmp/device-after-limited-repair.json","utf8"));
          const o=JSON.parse(fs.readFileSync("/tmp/dashboard-after-limited.json","utf8"));
          if(d.status!=="Hoạt động hạn chế") throw new Error("Completed repair lost limited-operation outcome");
          if(Number(o.limited||0)<1) throw new Error("Dashboard did not count limited-operation equipment");
          if(Number(o.operational||0)!==Number(o.active||0)+Number(o.limited||0)) throw new Error("Operational count is inconsistent");
          if(Number(o.active||0)+Number(o.limited||0)+Number(o.repairing||0)+Number(o.stopped||0)!==Number(o.total||0)) throw new Error("Dashboard device-state totals do not reconcile");
          NODE

          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị không sửa được CI","manufacturer":"CI","model":"FAIL-01","serial":"FAIL-CI-001","status":"Đang hoạt động","location":"Phòng kỹ thuật"}' >/tmp/failed-device.json
          FAILED_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/failed-device.json","utf8")).id')
          FAILED_TIME=$(date -u '+%Y-%m-%d %H:%M:%S')
          curl -fsS -X POST "$BASE/api/incidents" -H 'Content-Type: application/json' --data "{\"device_id\":$FAILED_DEVICE,\"incident_datetime\":\"$FAILED_TIME\",\"description\":\"Hỏng không thể sửa CI\",\"severity\":\"Cao\",\"reporter\":\"CI\",\"status\":\"Mới ghi nhận\"}" >/tmp/failed-incident.json
          FAILED_INCIDENT=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/failed-incident.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/incidents/$FAILED_INCIDENT/transfer-repair" -H 'Content-Type: application/json' --data '{"actor":"CI"}' >/tmp/failed-transfer.json
          FAILED_REPAIR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/failed-transfer.json","utf8")).repair_id')
          curl -fsS -X PUT "$BASE/api/repairs/$FAILED_REPAIR" -H 'Content-Type: application/json' --data "{\"device_id\":$FAILED_DEVICE,\"repair_date\":\"$FAILED_TIME\",\"issue\":\"Hỏng không thể sửa CI\",\"work\":\"Đánh giá không thể khắc phục\",\"person\":\"CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"Không sửa được\",\"processing_status\":\"Không sửa được\"}" >/tmp/failed-repair-update.json
          curl -fsS "$BASE/api/repairs" >/tmp/failed-repairs.json
          curl -fsS "$BASE/api/devices/$FAILED_DEVICE" >/tmp/failed-device-after.json
          curl -fsS "$BASE/api/reports/kpi?from_date=2000-01-01&to_date=2100-12-31&department_code=ALL&response_target_minutes=30" >/tmp/failed-kpi.json
          node - <<'NODE'
          const fs=require("fs");
          const repairId=Number(JSON.parse(fs.readFileSync("/tmp/failed-transfer.json","utf8")).repair_id);
          const incidentId=Number(JSON.parse(fs.readFileSync("/tmp/failed-incident.json","utf8")).id);
          const repair=JSON.parse(fs.readFileSync("/tmp/failed-repairs.json","utf8")).find(x=>Number(x.id)===repairId);
          const device=JSON.parse(fs.readFileSync("/tmp/failed-device-after.json","utf8"));
          const kpi=JSON.parse(fs.readFileSync("/tmp/failed-kpi.json","utf8"));
          const row=(kpi.records||[]).find(x=>Number(x.id)===incidentId);
          if(!repair || repair.processing_status!=="Không sửa được" || !String(repair.completed_at||"").trim()) throw new Error("Unable-to-repair state is not terminal");
          if(device.status!=="Ngừng hoạt động") throw new Error("Unable-to-repair device was not stopped");
          if(!row || !Number.isFinite(row.resolution_minutes)) throw new Error("Unable-to-repair incident missing valid resolution KPI");
          NODE
          echo "Repair integrity rules passed"

