      - name: Smoke test backdated technical records use historical department
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          HISTORY_DAY=$(node -e 'const p=process.argv[1].split("-").map(Number);const d=new Date(Date.UTC(p[0],p[1]-1,p[2]-1,12));process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")

          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST","name":"Thiết bị hồi cứu lịch sử","manufacturer":"Test","model":"BACK-01","year_in_use":2026,"status":"Đang hoạt động","serial":"BACK-CTX-001","country":"Việt Nam","year_manufactured":2026,"cost":0,"location":"Vị trí hồi cứu A"}' >/tmp/backdated-device.json
