          node -e 'const fs=require("fs");const device=Number(process.argv[1]);const id1=Number(process.argv[2]);const id2=Number(process.argv[3]);const rows=JSON.parse(fs.readFileSync("/tmp/quality-list.json","utf8")).filter(x=>Number(x.device_id)===device);if(rows.length!==2)throw new Error("Quality history did not preserve 2 ratings: "+rows.length);const a=rows.find(x=>Number(x.id)===id1),b=rows.find(x=>Number(x.id)===id2);if(!a||!b||Number(a.is_latest)!==0||Number(b.is_latest)!==1)throw new Error("Quality latest marker invalid");' "$DEVICE_ID" "$QUALITY_ID_1" "$QUALITY_ID_2"
