          CODE=$(curl -s -o /tmp/inv-invalid-result.json -w '%{http_code}' -X PUT "$BASE/api/inventory-items/$INV_ITEM" -H 'Content-Type: application/json' --data '{"result":"Tự đặt kết quả","actual_department_code":"INV","actual_location":"Phòng A","updated_by":"CI"}')
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/inv-force-complete.json -w '%{http_code}' -X POST "$BASE/api/inventory-sessions/$INV_SESSION/complete" -H 'Content-Type: application/json' --data '{"actor":"CI","force":"1"}')
          test "$CODE" = "409"

          CODE=$(curl -s -o /tmp/inv-bad-dept.json -w '%{http_code}' -X PUT "$BASE/api/inventory-items/$INV_ITEM" -H 'Content-Type: application/json' --data '{"result":"Sai khoa","actual_department_code":"INV","actual_location":"Phòng A","updated_by":"CI"}')
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/inv-bad-location.json -w '%{http_code}' -X PUT "$BASE/api/inventory-items/$INV_ITEM" -H 'Content-Type: application/json' --data '{"result":"Sai vị trí","actual_department_code":"INV","actual_location":"Phòng A","updated_by":"CI"}')
          test "$CODE" = "400"
          curl -fsS -X PUT "$BASE/api/inventory-items/$INV_ITEM" -H 'Content-Type: application/json' --data '{"result":"Sai vị trí","actual_department_code":"INV","actual_location":"Phòng B","note":"CI mismatch","updated_by":"CI"}' >/tmp/inv-valid.json
          INV_TRANSFER_JSON='{"to_department_code":"INV","to_location":"Phòng B","actor":"CI","reason":"Điều chuyển theo kiểm kê CI","note":"Giữ sai lệch trong biên bản kiểm kê"}'
          CODE=$(curl -s -o /tmp/inv-transfer-open.json -w '%{http_code}' -X POST "$BASE/api/devices/$INV_DEVICE/transfer" -H 'Content-Type: application/json' --data "$INV_TRANSFER_JSON")
          test "$CODE" = "409"
          curl -fsS "$BASE/api/devices/$INV_DEVICE" >/tmp/inv-device-before-complete.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/inv-device-before-complete.json","utf8")); if(d.location!=="Phòng A") throw new Error("Device moved during open inventory")'
          curl -fsS -X POST "$BASE/api/inventory-sessions/$INV_SESSION/complete" -H 'Content-Type: application/json' --data '{"actor":"CI"}' >/tmp/inv-complete.json
          curl -fsS -X POST "$BASE/api/devices/$INV_DEVICE/transfer" -H 'Content-Type: application/json' --data "$INV_TRANSFER_JSON" >/tmp/inv-transfer.json
          curl -fsS "$BASE/api/inventory-sessions/$INV_SESSION" >/tmp/inv-after-transfer-session.json
          curl -fsS "$BASE/api/devices/$INV_DEVICE" >/tmp/inv-after-transfer-device.json
          node - <<'NODE'
          const fs=require("fs");
          const s=JSON.parse(fs.readFileSync("/tmp/inv-after-transfer-session.json","utf8"));
          const d=JSON.parse(fs.readFileSync("/tmp/inv-after-transfer-device.json","utf8"));
          const item=(s.items||[])[0];
          if(!item || item.result!=="Sai vị trí" || item.actual_location!=="Phòng B") throw new Error("Completed inventory mismatch history was altered by later transfer");
          if(d.location!=="Phòng B") throw new Error("Device current location did not update after completed inventory");
          if(!(d.transfers||[]).some(x=>x.reason==="Điều chuyển theo kiểm kê CI")) throw new Error("Inventory transfer missing from device history");
          if(item.current_department_code!=="INV" || item.current_location!=="Phòng B") throw new Error("Inventory detail did not expose current location after transfer");
          NODE
          CODE=$(curl -s -o /tmp/inv-after-complete.json -w '%{http_code}' -X PUT "$BASE/api/inventory-items/$INV_ITEM" -H 'Content-Type: application/json' --data '{"result":"Có","actual_department_code":"INV","actual_location":"Phòng A","updated_by":"CI"}')
          test "$CODE" = "400"
          curl -fsS -X DELETE "$BASE/api/devices/$INV_DEVICE" >/tmp/inv-archive-complete.json
          curl -fsS "$BASE/api/devices" >/tmp/managed-devices-after-archive.json
          curl -fsS "$BASE/api/leadership-dashboard" >/tmp/leadership-after-archive.json
          node - <<'NODE'
          const fs=require("fs");
          const devices=JSON.parse(fs.readFileSync("/tmp/managed-devices-after-archive.json","utf8"));
          const leadership=JSON.parse(fs.readFileSync("/tmp/leadership-after-archive.json","utf8"));
          if(devices.some(x=>x.device_code==="INV.TST.0001")) throw new Error("Archived device still visible in managed list");
          if(Number(leadership.total)!==devices.length) throw new Error("Leadership total includes archived equipment");
          NODE
          grep -q 'CURRENT.session.status!=="Đã hoàn thành"' public/inventory.js
          grep -q 'alreadyAtRecordedPlace' public/inventory.js
          echo "Inventory and archival integrity rules passed"

      - name: Smoke test periodic schedules per work type
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok"}).format(new Date())')
          PAST=$(node -e 'const d=new Date(process.argv[1]+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-10);process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")
          SOON=$(node -e 'const d=new Date(process.argv[1]+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+10);process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")
          FUTURE=$(node -e 'const d=new Date(process.argv[1]+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+60);process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")

          curl -fsS "$BASE/api/dashboard/operations" >/tmp/schedule-ops-before.json
          curl -fsS "$BASE/api/leadership-dashboard" >/tmp/schedule-lead-before.json
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị lịch định kỳ CI","manufacturer":"CI","model":"SCH-01","serial":"SCH-001","status":"Đang hoạt động","location":"Phòng lịch CI"}' >/tmp/schedule-device.json
          SCHEDULE_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/schedule-device.json","utf8")).id')

          DEVICE_ID="$SCHEDULE_DEVICE" RUN_DATE="$PAST" NEXT_DATE="$PAST" TYPE="Kiểm định" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 08:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"KD-OLD",result:"Đạt",next_date:process.env.NEXT_DATE,note:"Nghĩa vụ kiểm định quá hạn"}))' >/tmp/schedule-insp-kd.json
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data @/tmp/schedule-insp-kd.json >/tmp/schedule-insp-kd-out.json

          DEVICE_ID="$SCHEDULE_DEVICE" RUN_DATE="$TODAY" NEXT_DATE="$FUTURE" TYPE="Hiệu chuẩn" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 09:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"HC-NEW",result:"Đạt",next_date:process.env.NEXT_DATE,note:"Hiệu chuẩn mới không được che Kiểm định"}))' >/tmp/schedule-insp-hc.json
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data @/tmp/schedule-insp-hc.json >/tmp/schedule-insp-hc-out.json

          DEVICE_ID="$SCHEDULE_DEVICE" RUN_DATE="$TODAY" NEXT_DATE="$SOON" TYPE="Kiểm xạ" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 10:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"KX-SOON",result:"Đạt",next_date:process.env.NEXT_DATE,note:"Kiểm xạ sắp hạn"}))' >/tmp/schedule-insp-kx.json
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data @/tmp/schedule-insp-kx.json >/tmp/schedule-insp-kx-out.json

          DEVICE_ID="$SCHEDULE_DEVICE" RUN_DATE="$PAST" NEXT_DATE="$PAST" TYPE="ATBX" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 07:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"ATBX-LEGACY",result:"Đạt",next_date:process.env.NEXT_DATE,note:"Tên loại lịch sử"}))' >/tmp/schedule-insp-atbx-old.json
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data @/tmp/schedule-insp-atbx-old.json >/tmp/schedule-insp-atbx-old-out.json

          DEVICE_ID="$SCHEDULE_DEVICE" RUN_DATE="$TODAY" NEXT_DATE="$FUTURE" TYPE="Kiểm định an toàn bức xạ" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 11:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"ATBX-NEW",result:"Đạt",next_date:process.env.NEXT_DATE,note:"Phải thay thế cảnh báo ATBX tên cũ"}))' >/tmp/schedule-insp-atbx-new.json
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data @/tmp/schedule-insp-atbx-new.json >/tmp/schedule-insp-atbx-new-out.json

          curl -fsS -X POST "$BASE/api/maintenances"             -F "device_id=$SCHEDULE_DEVICE" -F "maintenance_date=$PAST 07:00:00" -F "type=Bảo dưỡng"             -F "content=Bảo dưỡng tên cũ" -F "result=Đạt" -F "performer=CI" -F "next_date=$PAST" >/tmp/schedule-maint-legacy.json
          curl -fsS -X POST "$BASE/api/maintenances"             -F "device_id=$SCHEDULE_DEVICE" -F "maintenance_date=$TODAY 07:00:00" -F "type=Bảo dưỡng định kỳ"             -F "content=Bảo dưỡng định kỳ mới" -F "result=Đạt" -F "performer=CI" -F "next_date=$FUTURE" >/tmp/schedule-maint-current.json
          curl -fsS -X POST "$BASE/api/maintenances"             -F "device_id=$SCHEDULE_DEVICE" -F "maintenance_date=$PAST 08:00:00" -F "type=Vệ sinh thiết bị"             -F "content=Vệ sinh quá hạn" -F "result=Đạt" -F "performer=CI" -F "next_date=$PAST" >/tmp/schedule-maint-clean.json
          curl -fsS -X POST "$BASE/api/maintenances"             -F "device_id=$SCHEDULE_DEVICE" -F "maintenance_date=$TODAY 08:00:00" -F "type=Cập nhật phần mềm"             -F "content=Cập nhật phần mềm" -F "result=Đạt" -F "performer=CI" -F "next_date=$FUTURE" >/tmp/schedule-maint-software.json

          curl -fsS "$BASE/api/dashboard/operations" >/tmp/schedule-ops-after.json
          curl -fsS "$BASE/api/leadership-dashboard" >/tmp/schedule-lead-after.json
          curl -fsS "$BASE/api/reports/summary" >/tmp/schedule-report.json
          SCHEDULE_DEVICE="$SCHEDULE_DEVICE" node - <<'NODE'
          const fs=require("fs");
          const beforeOps=JSON.parse(fs.readFileSync("/tmp/schedule-ops-before.json","utf8"));
          const afterOps=JSON.parse(fs.readFileSync("/tmp/schedule-ops-after.json","utf8"));
          const beforeLead=JSON.parse(fs.readFileSync("/tmp/schedule-lead-before.json","utf8"));
          const afterLead=JSON.parse(fs.readFileSync("/tmp/schedule-lead-after.json","utf8"));
          const report=JSON.parse(fs.readFileSync("/tmp/schedule-report.json","utf8"));
          const id=Number(process.env.SCHEDULE_DEVICE);
          if(Number(afterOps.overdueInspection)!==Number(beforeOps.overdueInspection)+1) throw new Error("Overdue inspection must remain visible when calibration is newer");
          if(Number(afterOps.dueInspection)!==Number(beforeOps.dueInspection)+1) throw new Error("Due inspection schedule must count per work type");
          if(Number(afterLead.overdueInspections)!==Number(beforeLead.overdueInspections)+1) throw new Error("Leadership overdue inspection count is not per type");
          if(Number(afterLead.dueInspections)!==Number(beforeLead.dueInspections)+1) throw new Error("Leadership due inspection count is not per type");
          if(Number(afterLead.overdueMaint)!==Number(beforeLead.overdueMaint)+1) throw new Error("Maintenance overdue count is not per type");
          const insp=(report.inspectionOverdue||[]).filter(x=>Number(x.id)===id || Number(x.device_id)===id);
          const maint=(report.maintenanceOverdue||[]).filter(x=>Number(x.id)===id || Number(x.device_id)===id);
          if(insp.length!==1 || insp[0].obligation_type!=="Kiểm định") throw new Error("Inspection overdue report lost or duplicated obligation: "+JSON.stringify(insp.map(x=>x.obligation_type)));
          if(maint.length!==1 || maint[0].obligation_type!=="Vệ sinh thiết bị") throw new Error("Maintenance overdue report lost or duplicated obligation: "+JSON.stringify(maint.map(x=>x.obligation_type)));
          console.log("Periodic schedules are isolated by device + work type");
          NODE

          grep -q 'scheduleTypeKey(row.type,defaultType)' public/dashboard.js
          grep -q 'obligation_type' public/reports.js
          grep -q 'KĐ/HC/ATBX' public/dashboard.html
          echo "Periodic schedule UI guards passed"

      - name: Smoke test required inspection schedules
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok"}).format(new Date())')
          FUTURE=$(node -e 'const d=new Date(process.argv[1]+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+180);process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")

          curl -fsS "$BASE/api/dashboard/operations" >/tmp/required-ops-before.json
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị nghĩa vụ CI","manufacturer":"CI","model":"REQ-01","serial":"REQ-001","status":"Đang hoạt động","location":"Phòng nghĩa vụ","inspection_required_types":["Kiểm định","Hiệu chuẩn"]}' >/tmp/required-device.json
          REQUIRED_DEVICE=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/required-device.json","utf8")).id')
          curl -fsS "$BASE/api/devices/$REQUIRED_DEVICE" >/tmp/required-device-detail.json
          curl -fsS "$BASE/api/dashboard/operations" >/tmp/required-ops-created.json
          curl -fsS "$BASE/api/reports/summary" >/tmp/required-report-created.json
          curl -fsS "$BASE/api/system/readiness" >/tmp/required-readiness-created.json

          REQUIRED_DEVICE="$REQUIRED_DEVICE" node - <<'NODE'
          const fs=require("fs");
          const before=JSON.parse(fs.readFileSync("/tmp/required-ops-before.json","utf8"));
          const after=JSON.parse(fs.readFileSync("/tmp/required-ops-created.json","utf8"));
          const device=JSON.parse(fs.readFileSync("/tmp/required-device-detail.json","utf8"));
          const report=JSON.parse(fs.readFileSync("/tmp/required-report-created.json","utf8"));
          const readiness=JSON.parse(fs.readFileSync("/tmp/required-readiness-created.json","utf8"));
          const id=Number(process.env.REQUIRED_DEVICE);
          if(JSON.stringify(device.inspection_required_types)!==JSON.stringify(["Kiểm định","Hiệu chuẩn"])) throw new Error("Required inspection types were not persisted");
          if(Number(after.missingInspectionSchedule)!==Number(before.missingInspectionSchedule)+2) throw new Error("Two required schedules should be missing after device creation");
          const gaps=(report.inspectionMissingSchedule||[]).filter(x=>Number(x.id)===id || Number(x.device_id)===id);
          if(gaps.length!==2 || gaps.some(x=>x.schedule_issue!=="Chưa có hồ sơ")) throw new Error("Initial missing schedule state incorrect: "+JSON.stringify(gaps));
          const readyCheck=(readiness.checks||[]).find(x=>x.key==="inspection_schedule");
          if(readyCheck?.level!=="Cần xử lý" || Number(readiness.system?.missing_inspection_schedules||0)<2) throw new Error("Readiness did not block incomplete required schedules");
          NODE

          DEVICE_ID="$REQUIRED_DEVICE" RUN_DATE="$TODAY" TYPE="Kiểm định" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 08:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"REQ-KD-1",result:"Đạt",next_date:"",note:"Có hồ sơ nhưng chưa đặt hạn"}))' >/tmp/required-kd-no-next.json
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data @/tmp/required-kd-no-next.json >/tmp/required-kd-no-next-out.json
          curl -fsS "$BASE/api/reports/summary" >/tmp/required-report-mid.json
          REQUIRED_DEVICE="$REQUIRED_DEVICE" node - <<'NODE'
          const fs=require("fs");
          const report=JSON.parse(fs.readFileSync("/tmp/required-report-mid.json","utf8"));
          const id=Number(process.env.REQUIRED_DEVICE);
          const gaps=(report.inspectionMissingSchedule||[]).filter(x=>Number(x.id)===id || Number(x.device_id)===id);
          const byType=new Map(gaps.map(x=>[x.obligation_type,x.schedule_issue]));
          if(byType.get("Kiểm định")!=="Chưa đặt hạn tiếp theo") throw new Error("Inspection should change to missing next date");
          if(byType.get("Hiệu chuẩn")!=="Chưa có hồ sơ") throw new Error("Calibration should still be missing first record");
          NODE

          curl -fsS -X PUT "$BASE/api/devices/$REQUIRED_DEVICE" -H 'Content-Type: application/json' --data '{"note":"Cập nhật không được làm mất nghĩa vụ"}' >/tmp/required-device-put.json
          curl -fsS "$BASE/api/devices/$REQUIRED_DEVICE" >/tmp/required-device-after-put.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/required-device-after-put.json","utf8")); if(JSON.stringify(x.inspection_required_types)!==JSON.stringify(["Kiểm định","Hiệu chuẩn"])) throw new Error("Unrelated device update erased inspection obligations")'

          DEVICE_ID="$REQUIRED_DEVICE" RUN_DATE="$TODAY" NEXT_DATE="$FUTURE" TYPE="Hiệu chuẩn" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 09:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"REQ-HC-1",result:"Đạt",next_date:process.env.NEXT_DATE,note:"Lịch hiệu chuẩn hợp lệ"}))' >/tmp/required-hc.json
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data @/tmp/required-hc.json >/tmp/required-hc-out.json
          curl -fsS "$BASE/api/reports/summary" >/tmp/required-report-one-gap.json
          REQUIRED_DEVICE="$REQUIRED_DEVICE" node - <<'NODE'
          const fs=require("fs");
          const report=JSON.parse(fs.readFileSync("/tmp/required-report-one-gap.json","utf8"));
          const id=Number(process.env.REQUIRED_DEVICE);
          const gaps=(report.inspectionMissingSchedule||[]).filter(x=>Number(x.id)===id || Number(x.device_id)===id);
          if(gaps.length!==1 || gaps[0].obligation_type!=="Kiểm định" || gaps[0].schedule_issue!=="Chưa đặt hạn tiếp theo") throw new Error("Valid calibration schedule should clear only calibration gap");
          NODE

          DEVICE_ID="$REQUIRED_DEVICE" RUN_DATE="$TODAY" NEXT_DATE="$FUTURE" TYPE="Kiểm định" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 10:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"REQ-KD-2",result:"Đạt",next_date:process.env.NEXT_DATE,note:"Lịch kiểm định đã thiết lập"}))' >/tmp/required-kd-final.json
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data @/tmp/required-kd-final.json >/tmp/required-kd-final-out.json
          curl -fsS "$BASE/api/dashboard/operations" >/tmp/required-ops-final.json
          curl -fsS "$BASE/api/reports/summary" >/tmp/required-report-final.json
          curl -fsS "$BASE/api/system/readiness" >/tmp/required-readiness-final.json
          REQUIRED_DEVICE="$REQUIRED_DEVICE" node - <<'NODE'
          const fs=require("fs");
          const before=JSON.parse(fs.readFileSync("/tmp/required-ops-before.json","utf8"));
          const after=JSON.parse(fs.readFileSync("/tmp/required-ops-final.json","utf8"));
          const report=JSON.parse(fs.readFileSync("/tmp/required-report-final.json","utf8"));
          const readiness=JSON.parse(fs.readFileSync("/tmp/required-readiness-final.json","utf8"));
          const id=Number(process.env.REQUIRED_DEVICE);
          if(Number(after.missingInspectionSchedule)!==Number(before.missingInspectionSchedule)) throw new Error("All required schedules should be complete");
          const gaps=(report.inspectionMissingSchedule||[]).filter(x=>Number(x.id)===id || Number(x.device_id)===id);
          if(gaps.length) throw new Error("Completed required schedules still reported missing");
          const readyCheck=(readiness.checks||[]).find(x=>x.key==="inspection_schedule");
          if(readyCheck?.level!=="Đạt") throw new Error("Readiness did not clear after completing required schedules");
          NODE

          curl -fsS "$BASE/api/dashboard/operations" >/tmp/failed-ops-before.json
          curl -fsS "$BASE/api/system/readiness" >/tmp/failed-readiness-before.json
          DEVICE_ID="$REQUIRED_DEVICE" RUN_DATE="$TODAY" NEXT_DATE="$FUTURE" TYPE="Kiểm xạ" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 11:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"REQ-KX-FAIL",result:"Không đạt",next_date:process.env.NEXT_DATE,note:"Kết quả không đạt phải cảnh báo dù có hạn tiếp theo"}))' >/tmp/required-kx-fail.json
          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data @/tmp/required-kx-fail.json >/tmp/required-kx-fail-out.json
          curl -fsS "$BASE/api/dashboard/operations" >/tmp/failed-ops-active.json
          curl -fsS "$BASE/api/system/readiness" >/tmp/failed-readiness-active.json
          curl -fsS "$BASE/api/reports/summary" >/tmp/failed-report-active.json
          REQUIRED_DEVICE="$REQUIRED_DEVICE" node - <<'NODE'
          const fs=require("fs");
          const before=JSON.parse(fs.readFileSync("/tmp/failed-ops-before.json","utf8"));
          const after=JSON.parse(fs.readFileSync("/tmp/failed-ops-active.json","utf8"));
          const readiness=JSON.parse(fs.readFileSync("/tmp/failed-readiness-active.json","utf8"));
          const report=JSON.parse(fs.readFileSync("/tmp/failed-report-active.json","utf8"));
          const id=Number(process.env.REQUIRED_DEVICE);
          if(Number(after.failedInspection)!==Number(before.failedInspection||0)+1) throw new Error("Latest failed inspection was not counted");
          const rows=(report.inspectionFailed||[]).filter(x=>Number(x.id)===id && x.obligation_type==="Kiểm xạ");
          if(rows.length!==1 || rows[0].inspection?.result!=="Không đạt") throw new Error("Failed inspection report missing latest failed obligation");
          const check=(readiness.checks||[]).find(x=>x.key==="inspection_result");
          if(check?.level!=="Cần xử lý") throw new Error("Readiness did not block latest failed inspection");
          NODE

          DEVICE_ID="$REQUIRED_DEVICE" RUN_DATE="$TODAY" NEXT_DATE="$FUTURE" TYPE="Kiểm xạ" node -e 'process.stdout.write(JSON.stringify({device_id:Number(process.env.DEVICE_ID),inspection_date:process.env.RUN_DATE+" 12:00:00",type:process.env.TYPE,organization:"CI",certificate_no:"REQ-KX-PASS",result:"Đạt",next_date:process.env.NEXT_DATE,note:"Hồ sơ mới cùng loại đã đạt"}))' >/tmp/required-kx-pass.json
