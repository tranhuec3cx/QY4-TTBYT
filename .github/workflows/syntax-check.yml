          OPLOG_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/operation-log.json","utf8")).id')
          CODE=$(curl -s -o /tmp/operation-log-delete-reject.json -w '%{http_code}' -X DELETE "$BASE/api/operation-logs/$OPLOG_ID")
          test "$CODE" = "409"

          CODE=$(curl -s -o /tmp/usage-invalid-month.json -w '%{http_code}' -X POST "$BASE/api/usage-reports" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"year\":2026,\"month\":13,\"indicator\":\"Số ca\",\"value\":10,\"unit\":\"ca\"}")
          test "$CODE" = "400"
          CODE=$(curl -s -o /tmp/usage-invalid-value.json -w '%{http_code}' -X POST "$BASE/api/usage-reports" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"year\":2026,\"month\":9,\"indicator\":\"Số ca\",\"value\":-1,\"unit\":\"ca\"}")
          test "$CODE" = "400"
          curl -fsS -X POST "$BASE/api/usage-reports" -H 'Content-Type: application/json' --data "{\"device_id\":$DEVICE_ID,\"year\":2026,\"month\":9,\"indicator\":\"Số ca\",\"value\":12,\"unit\":\"ca\"}" >/tmp/usage-valid.json
          echo "Quality, usage and immutable technical-history validation passed"

      - name: Smoke test incident snapshot correction rules
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST","group_code":"TST","name":"Thiết bị sửa snapshot A","manufacturer":"Test","model":"SNAP-A","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"SNAP-A-001","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí snapshot A","note":"","device_code":"TST.TST.0101","insurance_code":"","actor":"CI"}' >/tmp/snap-device-a.json
          curl -fsS -X POST "$BASE/api/devices" -H 'Content-Type: application/json' --data '{"department_code":"TST2","group_code":"TST","name":"Thiết bị sửa snapshot B","manufacturer":"Test","model":"SNAP-B","year_in_use":2026,"warranty_end":"","status":"Đang hoạt động","quality_level":3,"serial":"SNAP-B-001","country":"Việt Nam","year_manufactured":2026,"cost":0,"funding":"","location":"Vị trí snapshot B","note":"","device_code":"TST2.TST.0102","insurance_code":"","actor":"CI"}' >/tmp/snap-device-b.json
          DEV_A=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/snap-device-a.json","utf8")).id')
          DEV_B=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/snap-device-b.json","utf8")).id')
          curl -fsS -X POST "$BASE/api/incidents" -H 'Content-Type: application/json' --data "{\"device_id\":$DEV_A,\"incident_datetime\":\"$TODAY 13:00\",\"description\":\"Sự cố cần sửa đúng thiết bị\",\"severity\":\"Trung bình\",\"reporter\":\"CI\",\"status\":\"Mới ghi nhận\"}" >/tmp/snap-incident.json
          SNAP_INC=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/snap-incident.json","utf8")).id')
          curl -fsS -X PUT "$BASE/api/incidents/$SNAP_INC" -H 'Content-Type: application/json' --data "{\"device_id\":$DEV_B,\"incident_datetime\":\"$TODAY 13:00\",\"description\":\"Sự cố cần sửa đúng thiết bị\",\"severity\":\"Trung bình\",\"reporter\":\"CI\",\"status\":\"Mới ghi nhận\"}" >/tmp/snap-update.json
          curl -fsS "$BASE/api/incidents" >/tmp/snap-incidents.json
          node - <<'NODE'
          const fs=require("fs");
          const id=Number(JSON.parse(fs.readFileSync("/tmp/snap-incident.json","utf8")).id);
          const rows=JSON.parse(fs.readFileSync("/tmp/snap-incidents.json","utf8"));
          const r=rows.find(x=>Number(x.id)===id);
          if(!r) throw new Error("Corrected incident missing");
          if(r.department_code!=="TST2" || r.department_code_snapshot!=="TST2") throw new Error("Corrected department snapshot failed");
          if(r.location!=="Vị trí snapshot B" || r.location_snapshot!=="Vị trí snapshot B") throw new Error("Corrected location snapshot failed");
          if(r.device_name!=="Thiết bị sửa snapshot B") throw new Error("Corrected device snapshot failed");
          NODE
          curl -fsS -X POST "$BASE/api/incidents/$SNAP_INC/acknowledge" -H 'Content-Type: application/json' --data '{"actor":"CI"}' >/tmp/snap-ack.json
          curl -fsS -X POST "$BASE/api/incidents/$SNAP_INC/transfer-repair" -H 'Content-Type: application/json' --data '{"actor":"CI"}' >/tmp/snap-transfer.json
          CODE=$(curl -s -o /tmp/snap-reject.json -w '%{http_code}' -X PUT "$BASE/api/incidents/$SNAP_INC" -H 'Content-Type: application/json' --data "{\"device_id\":$DEV_A,\"incident_datetime\":\"$TODAY 13:00\",\"description\":\"Không được đổi sau sửa chữa\",\"severity\":\"Trung bình\",\"reporter\":\"CI\",\"status\":\"Đã chuyển sửa chữa\"}")
          test "$CODE" = "400"
          echo "Incident snapshot correction rules passed"

      - name: Smoke test repair integrity rules
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          DEVICE_ID=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/device-create.json","utf8")).id')
