          CODE=$(curl -s -o /tmp/snap-reject.json -w '%{http_code}' -X PUT "$BASE/api/incidents/$SNAP_INC" -H 'Content-Type: application/json' --data "{\"device_id\":$DEV_A,\"incident_datetime\":\"$SNAP_DAY 13:00\",\"description\":\"Không được đổi sau sửa chữa\",\"severity\":\"Trung bình\",\"reporter\":\"CI\",\"status\":\"Đã chuyển sửa chữa\"}")
