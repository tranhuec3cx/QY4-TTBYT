            -F "content=Hồ sơ hồi cứu bảo dưỡng" -F "result=Đạt" -F "performer=CI" >/tmp/backdated-maint.json
          BACK_MAINT=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/backdated-maint.json","utf8")).id')

          curl -fsS -X POST "$BASE/api/inspections" -H 'Content-Type: application/json' --data "{\"device_id\":$BACK_DEVICE,\"inspection_date\":\"$HISTORY_DAY 09:00\",\"type\":\"Kiểm định\",\"organization\":\"CI\",\"certificate_no\":\"BACK-CERT\",\"result\":\"Đạt\",\"next_date\":\"\"}" >/tmp/backdated-insp.json
          BACK_INSP=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/backdated-insp.json","utf8")).id')

          curl -fsS -X POST "$BASE/api/operation-logs" -H 'Content-Type: application/json' --data "{\"device_id\":$BACK_DEVICE,\"log_datetime\":\"$HISTORY_DAY 10:00\",\"user_name\":\"CI\",\"usage_count\":\"1\",\"note\":\"Hồi cứu vận hành\"}" >/tmp/backdated-op.json
          BACK_OP=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/backdated-op.json","utf8")).id')

          curl -fsS -X POST "$BASE/api/documents" \
            -F "device_id=$BACK_DEVICE" -F "name=Tài liệu hồi cứu" -F "type=Khác" -F "doc_date=$HISTORY_DAY" -F "updated_by=CI" >/tmp/backdated-doc.json
          BACK_DOC=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/backdated-doc.json","utf8")).id')

          curl -fsS -X POST "$BASE/api/repairs" -H 'Content-Type: application/json' --data "{\"device_id\":$BACK_DEVICE,\"repair_date\":\"$HISTORY_DAY 07:30\",\"received_at\":\"$HISTORY_DAY 07:20\",\"issue\":\"Hồi cứu sửa chữa\",\"work\":\"Đã hoàn thành\",\"person\":\"CI\",\"method\":\"Nội bộ\",\"cost\":0,\"result\":\"Đạt\",\"processing_status\":\"Đã hoàn thành\",\"status_after\":\"Đang hoạt động\"}" >/tmp/backdated-repair.json
          BACK_REPAIR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/backdated-repair.json","utf8")).id')

          curl -fsS -X POST "$BASE/api/incidents" -H 'Content-Type: application/json' --data "{\"device_id\":$BACK_DEVICE,\"incident_datetime\":\"$HISTORY_DAY 07:00\",\"description\":\"Hồi cứu sự cố\",\"severity\":\"Trung bình\",\"reporter\":\"CI\",\"status\":\"Mới ghi nhận\"}" >/tmp/backdated-incident.json
          BACK_INC=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/backdated-incident.json","utf8")).id')

          curl -fsS "$BASE/api/incidents" >/tmp/backdated-incidents.json
          curl -fsS "$BASE/api/repairs" >/tmp/backdated-repairs.json
          curl -fsS "$BASE/api/maintenances" >/tmp/backdated-maints.json
          curl -fsS "$BASE/api/inspections" >/tmp/backdated-inspections.json
          curl -fsS "$BASE/api/devices/$BACK_DEVICE" >/tmp/backdated-detail.json

          node - "$BACK_INC" "$BACK_REPAIR" "$BACK_MAINT" "$BACK_INSP" "$BACK_OP" "$BACK_DOC" <<'NODE'
          const fs=require("fs");
          const ids=process.argv.slice(2).map(Number);
          const incident=(JSON.parse(fs.readFileSync("/tmp/backdated-incidents.json","utf8"))||[]).find(x=>Number(x.id)===ids[0]);
          const repair=(JSON.parse(fs.readFileSync("/tmp/backdated-repairs.json","utf8"))||[]).find(x=>Number(x.id)===ids[1]);
          const maint=(JSON.parse(fs.readFileSync("/tmp/backdated-maints.json","utf8"))||[]).find(x=>Number(x.id)===ids[2]);
          const insp=(JSON.parse(fs.readFileSync("/tmp/backdated-inspections.json","utf8"))||[]).find(x=>Number(x.id)===ids[3]);
          const detail=JSON.parse(fs.readFileSync("/tmp/backdated-detail.json","utf8"));
          const op=(detail.operation_logs||[]).find(x=>Number(x.id)===ids[4]);
          const doc=(detail.documents||[]).find(x=>Number(x.id)===ids[5]);
          const rows=[["incident",incident],["repair",repair],["maintenance",maint],["inspection",insp],["operation",op],["document",doc]];
          for(const [name,row] of rows){
            if(!row) throw new Error("Backdated "+name+" row missing");
            if(String(row.department_code_snapshot||row.department_code||"")!=="TST") throw new Error("Backdated "+name+" assigned wrong department");
            if(String(row.location_snapshot||row.location||"")!=="Vị trí hồi cứu A") throw new Error("Backdated "+name+" assigned wrong location");
          }
          if(detail.department_code!=="TST2" || detail.location!=="Vị trí hiện tại B") throw new Error("Current device context changed by backdated records");
          console.log("Backdated technical context passed");
          NODE

      - name: Smoke test latest maintenance and inspection schedule semantics
        run: |
          BASE=http://127.0.0.1:5000
          TODAY=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/dashboard-ops.json","utf8")).today')
          OLD_DATE=$(node -e 'const d=new Date(process.argv[1]+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-10);process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")
          PAST_DUE=$(node -e 'const d=new Date(process.argv[1]+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-1);process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")
          FUTURE_DUE=$(node -e 'const d=new Date(process.argv[1]+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+60);process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")
          DUE_SOON=$(node -e 'const d=new Date(process.argv[1]+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+10);process.stdout.write(d.toISOString().slice(0,10))' "$TODAY")

          curl -fsS "$BASE/api/dashboard/operations" >/tmp/latest-baseline-ops.json
