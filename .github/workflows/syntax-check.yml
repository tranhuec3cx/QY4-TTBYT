          const readinessBefore=JSON.parse(fs.readFileSync("/tmp/failed-readiness-before.json","utf8"));
          const readinessAfter=JSON.parse(fs.readFileSync("/tmp/failed-readiness-cleared.json","utf8"));
          const report=JSON.parse(fs.readFileSync("/tmp/failed-report-cleared.json","utf8"));
          const id=Number(process.env.REQUIRED_DEVICE);
          if(Number(after.failedInspection)!==Number(before.failedInspection||0)) throw new Error("New passing record did not clear failed inspection alert");
          const rows=(report.inspectionFailed||[]).filter(x=>Number(x.id)===id && x.obligation_type==="Kiểm xạ");
