          CODE=$(curl -s -o /tmp/context-operation-move-reject.json -w '%{http_code}' -X PUT "$BASE/api/operation-logs/$CTX_OP" -H 'Content-Type: application/json' --data "$OPERATION_MOVE_JSON")
